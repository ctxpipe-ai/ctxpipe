[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Watch paths are repo-root globs even when the service root directory is set.
watchPatterns = ["/ops/observability/railway-telemetry/**"]

[deploy]
# Config-as-code schedule. Provider 0.6.1 has a cron_schedule attribute, but
# only when replicas total 1, and it does not read this file. The deploy uses
# railway.toml, which overrides the dashboard.
cronSchedule = "*/5 * * * *"
restartPolicyType = "NEVER"
