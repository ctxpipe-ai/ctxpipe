# ClickStack collector custom merge (CUSTOM_OTELCOL_CONFIG_FILE).
# Loaded last via `--config` (see the image entrypoint). Do not redefine
# otlp/hyperdx, memory_limiter, batch, the clickhouse exporter, or the base
# `transform` processor (logs pipeline). Confmap replaces arrays, so do not
# set service.telemetry here: base config.yaml already exposes internal
# metrics on 0.0.0.0:8888 (readers.pull.exporter.prometheus).
# The base receiver name is otlp/hyperdx (not otlp). Hosted allowlist source of
# truth; keep in sync with apps/otel-collector/config.yaml.
#
# otelcol-hyperdx 0.155.0 (clickhouse/clickstack-otel-collector) includes
# prometheus, resource, and transform, but not the redis receiver. metrics/self
# therefore scrapes the collector and ClickHouse only. Do not add a second
# collector to cover Redis.

receivers:
  # job label becomes resource service.name (otel-collector, clickhouse).
  prometheus/self:
    config:
      global:
        scrape_interval: 60s
        scrape_timeout: 10s
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets: ["127.0.0.1:8888"]
          # The collector SDK publishes target_info{service_name="otelcol-hyperdx"},
          # and the prometheus receiver copies that over the job label. Drop it so
          # service.name stays otel-collector.
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: target_info
              action: drop
        - job_name: clickhouse
          static_configs:
            - targets: ["clickhouse.railway.internal:9363"]
          # /metrics exposes thousands of series. A 1 GiB ClickHouse node OOMs
          # inserting that every 60s. Keep the Observability Stack dashboard
          # names plus a small unlabeled health set (no ZooKeeper, no per-error
          # or per-interface series).
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "ClickHouseMetrics_(Query|Merge|BackgroundMergesAndMutationsPoolTask|BackgroundFetchesPoolTask|BackgroundCommonPoolTask|BackgroundSchedulePoolTask|TCPConnection|HTTPConnection|InterserverConnection|Read|Write|QueryThread|MemoryTracking|DelayedInserts|GlobalThreadActive|PartsCommitted|PartsActive)|ClickHouseProfileEvents_(Query|SelectQuery|InsertQuery|FailedQuery|FailedSelectQuery|FailedInsertQuery|InsertedRows|InsertedBytes|SelectedRows|SelectedBytes|DelayedInserts|Merge|MergedRows|MergedUncompressedBytes|NetworkReceiveBytes|NetworkSendBytes|OSReadBytes|OSWriteBytes)|ClickHouseAsyncMetrics_(MemoryResident|jemalloc_resident|TotalPartsOfMergeTreeTables|MaxPartCountForPartition|Uptime|FilesystemMainPathUsedBytes|FilesystemMainPathTotalBytes)"
              action: keep

processors:
  filter/llm_only:
    error_mode: ignore
    traces:
      span:
        - 'not ((attributes["gen_ai.system"] != nil) or (attributes["gen_ai.operation.name"] != nil) or (attributes["gen_ai.request.model"] != nil) or (attributes["gen_ai.response.model"] != nil) or (attributes["gen_ai.provider.name"] != nil) or (attributes["gen_ai.usage.input_tokens"] != nil) or (attributes["gen_ai.usage.output_tokens"] != nil) or (attributes["gen_ai.response.id"] != nil) or (attributes["gen_ai.conversation.id"] != nil) or (attributes["gen_ai.tool.name"] != nil) or (attributes["gen_ai.tool.call.id"] != nil) or (attributes["gen_ai.tool.type"] != nil) or (attributes["gen_ai.data_source.id"] != nil) or (attributes["gen_ai.agent.name"] != nil) or (attributes["gen_ai.request.choice.count"] != nil) or (attributes["gen_ai.response.finish_reasons"] != nil) or IsMatch(instrumentation_scope.name, "(?i).*(langfuse|langchain|langgraph).*"))'
  batch/langfuse:
    timeout: 5s
    send_batch_size: 512
  # Prometheus receiver sets service.name from the job label. This processor
  # only adds the shared ops-stack resource attributes.
  resource/self:
    attributes:
      - key: deployment.environment
        value: observability
        action: upsert
      - key: service.namespace
        value: ctxpipe
        action: upsert

exporters:
  otlphttp/langfuse:
    endpoint: "${env:LANGFUSE_OTLP_ENDPOINT}"
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH_STRING}"
      x-langfuse-ingestion-version: "4"

service:
  pipelines:
    traces/llm:
      receivers: [otlp/hyperdx]
      processors: [filter/llm_only, batch/langfuse]
      exporters: [otlphttp/langfuse]
    metrics/self:
      receivers: [prometheus/self]
      processors: [memory_limiter, resource/self, batch]
      exporters: [clickhouse]
