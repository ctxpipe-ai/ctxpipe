[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Watch paths are repo-root globs even when the service root directory is set.
watchPatterns = ["/ops/observability/clickhouse/**"]

[deploy]
healthcheckPath = "/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
# Platform default is 10. A bucket outage at boot exits in about 10s;
# 120 attempts covers a longer blip before the deployment is marked Crashed.
restartPolicyMaxRetries = 120
sleepApplication = false
