packages:
  - apps/*
  - packages/*
  - examples/*
  - ops/observability/cost-telemetry

# Supply chain (CTX-1538). pnpm installs a version only when it is at least 7 days
# old, and it checks each lockfile entry again on install. A compromised release
# is usually found and removed in that time. A security fix that cannot wait
# goes into minimumReleaseAgeExclude as `name@version`, with its reason.
minimumReleaseAge: 10080
# Stop when a package loses the trust evidence (trusted publisher, provenance)
# that an earlier release had.
trustPolicy: no-downgrade
# Versions that were in the lockfile before the trust policy, and that have
# less trust evidence than an earlier release of the same package. Each one was
# published by the package's own maintainer (checked 2026-11-22). Remove an
# entry when an update moves past that version.
trustPolicyExclude:
  - '@pierre/theme@2.0.0'
  - '@vercel/detect-agent@1.2.5'
  - 'chokidar@4.0.3'
  - 'evlog@2.14.1'
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'

# pnpm runs no dependency build script. Each package with a build script is
# listed as false, so that an install stops at a new one (strictDepBuilds).
allowBuilds:
  '@ast-grep/cli': false
  '@forge/cli': false
  '@parcel/watcher': false
  cloudflared: false
  core-js: false
  cpu-features: false
  esbuild: false
  keytar: false
  msw: false
  opencode-ai: false
  protobufjs: false
  sharp: false
  ssh2: false

# pnpm 11 runs an install before `pnpm run` when node_modules is out of date.
# CI and the Docker builds install with --filter and --prod, so keep the pnpm 10
# behavior.
verifyDepsBeforeRun: false

overrides:
  '@daveyplate/better-auth-ui>better-call': 1.4.5
  '@luma.gl/core': 9.2.6
  '@luma.gl/engine': 9.2.6
  '@luma.gl/webgl': 9.2.6
  '@luma.gl/shadertools': 9.2.6
  '@luma.gl/constants': 9.2.6

patchedDependencies:
  '@cosmograph/cosmograph@2.2.1': patches/@cosmograph__cosmograph@2.2.1.patch
  # Route typing: `const` on the route type of `createRoute` and `openapi`, so a handler that returns
  # a union of statuses (publishWhenNoTurnRuns) checks against each response. Upstream 1.6 infers the
  # request and response schemas itself, so the older inference hunks and the zod-to-openapi patch are gone.
  '@hono/zod-openapi@1.6.3': patches/@hono__zod-openapi@1.6.3.patch
  # Temporary (ADR-044). Ticket 01, upstream PR pending: SSE readiness and completion, abort on dispose.
  # CTX-1061: resolve a prompt only at the session idle after its reply, because a late message update can show the reply finished before its text.
  # CTX-1322: beforePrompt, the caller's setup that runs while the server starts, and its system prompts.
  # OpenCode 1.x: permission.asked with its own reply route, and text and reasoning as message.part.delta events.
  # Upstream in 1.0, so no longer patched: assistant-only parts and the "pending" tool part (CTX-576), and the 1 s
  # teardown step (ticket 15, https://github.com/TanStack/ai/issues/1638, fixed in https://github.com/TanStack/ai/pull/1773).
  '@tanstack/ai-opencode@1.0.1': patches/@tanstack__ai-opencode@1.0.1.patch
  # @tanstack/ai 1.x imports fast-json-patch. Its package ships index.ts beside index.js, without the src/ that
  # index.ts imports, and tsx loads index.ts: every tsx run that reaches @tanstack/ai (src/db/migrate.ts in CI and
  # db:migrate, the tests that spawn `--import tsx`) fails with "Cannot find module './src/core'". The patch
  # deletes index.ts. Node and Bun load index.js and are not affected. Temporary: drop it once fast-json-patch
  # (https://github.com/Starcounter-Jack/JSON-Patch/issues/347) or tsx is fixed upstream. Accepted by the CTO on 2026-11-27.
  'fast-json-patch@3.1.1': patches/fast-json-patch@3.1.1.patch
  # The checks run OpenCode from the root devDependency, and pnpm runs no
  # dependency build script. The launcher runs the binary of the platform
  # package that the lockfile installed, so the postinstall is not needed.
  'opencode-ai@1.19.5': patches/opencode-ai@1.19.5.patch
  # CTX-1478: claim runs in the order they became available. Upstream (0.10.1
  # and 0.11.0) claims each pending run first, so a parent that a child woke
  # waited for a free slot while newer pending runs took it, for up to 32
  # minutes in production.
  'openworkflow@0.10.1': patches/openworkflow@0.10.1.patch
