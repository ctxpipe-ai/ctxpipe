# Codex project config. Keep the MCP servers in parity with .mcp.json
# (scripts/ci/check-agent-harness.mjs checks it).

# BEGIN ctxpipe-memory-capture
[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "bash \"$(git rev-parse --show-toplevel)/.agents/hooks/memory-capture.sh\" memory capture observe --host codex --event UserPromptSubmit"

[[hooks.PostToolUse]]
[[hooks.PostToolUse.hooks]]
type = "command"
command = "bash \"$(git rev-parse --show-toplevel)/.agents/hooks/memory-capture.sh\" memory capture observe --host codex --event PostToolUse"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "bash \"$(git rev-parse --show-toplevel)/.agents/hooks/memory-capture.sh\" memory capture finalize --host codex --event Stop"
# END ctxpipe-memory-capture

[mcp_servers.ctxpipe]
url = "https://app.ctxpipe.ai/mcp?orgSlug=ctx-tev"
env_http_headers = { "x-api-key" = "CTXPIPE_API_KEY" }

[mcp_servers.ctxpipe-storybook]
url = "http://127.0.0.1:6006/mcp"

[mcp_servers.neon]
url = "https://mcp.neon.tech/mcp?readonly=true"
bearer_token_env_var = "NEON_API_KEY"

[mcp_servers.railway]
command = "npx"
args = ["-y", "@railway/cli@5.63.1", "mcp", "local"]

[mcp_servers.hyperdx]
url = "https://hyperdx.ctxpipe.ai/api/mcp"
bearer_token_env_var = "HYPERDX_ACCESS_KEY"

# Langfuse needs "Authorization: Basic <LANGFUSE_AUTH_STRING>". Codex cannot put
# the "Basic " prefix in front of an env var, so a stdio bridge sends the header.
[mcp_servers.langfuse]
command = "bash"
args = ["-c", "exec npx -y mcp-remote@0.15.2 https://langfuse.ctxpipe.ai/api/public/mcp --header \"Authorization: Basic ${LANGFUSE_AUTH_STRING}\""]
