# Contributor laptop collector (Compose profile `infra` / `pnpm dev:infra`).
# Prints OTLP to stdout. No upstream token. Hosted ingest is the ClickStack
# collector of the observability stack in the factory repo (ADR-061).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
