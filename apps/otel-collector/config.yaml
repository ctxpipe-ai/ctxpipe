# Contributor laptop collector (Compose profile `infra` / `pnpm dev:infra`).
# Prints OTLP to stdout. No upstream token. Hosted ingest is
# ops/observability/collector/config.yaml (ADR-038).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
