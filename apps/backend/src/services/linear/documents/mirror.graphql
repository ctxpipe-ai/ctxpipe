fragment LinearPageInfo on PageInfo {
  hasNextPage
  endCursor
}

fragment LinearActor on User {
  id
  name
  displayName
  active
  admin
  guest
  avatarUrl
}

fragment LinearCommentNode on Comment {
  id
  body
  createdAt
  updatedAt
  user {
    ...LinearActor
  }
}

fragment LinearAttachmentNode on Attachment {
  id
  title
  url
  sourceType
  metadata
}

fragment LinearLabelNode on IssueLabel {
  id
  name
  description
  color
  team {
    id
  }
}

fragment LinearNeedNode on CustomerNeed {
  id
  url
  body
  content
  priority
  createdAt
  updatedAt
  customer {
    id
  }
  issue {
    id
  }
  project {
    id
  }
  creator {
    ...LinearActor
  }
}

fragment LinearDocumentNode on Document {
  id
  title
  url
  content
  createdAt
  updatedAt
  project {
    id
  }
  creator {
    ...LinearActor
  }
}

fragment LinearIssueCore on Issue {
  id
  identifier
  title
  description
  url
  priorityLabel
  createdAt
  updatedAt
  state {
    name
  }
  team {
    id
    key
    name
  }
  project {
    id
    name
    teams(first: 50) {
      nodes {
        id
      }
      pageInfo {
        ...LinearPageInfo
      }
    }
  }
  cycle {
    id
    name
  }
  assignee {
    ...LinearActor
  }
  creator {
    ...LinearActor
  }
  labels(first: 20) {
    nodes {
      ...LinearLabelNode
    }
    pageInfo {
      ...LinearPageInfo
    }
  }
  comments(first: 15) {
    nodes {
      ...LinearCommentNode
    }
    pageInfo {
      ...LinearPageInfo
    }
  }
  attachments(first: 20) {
    nodes {
      ...LinearAttachmentNode
    }
    pageInfo {
      ...LinearPageInfo
    }
  }
}

fragment LinearProjectNode on Project {
  id
  name
  url
  content
  description
  priorityLabel
  progress
  startDate
  targetDate
  createdAt
  updatedAt
  status {
    id
  }
  lead {
    ...LinearActor
  }
  teams(first: 50) {
    nodes {
      id
    }
    pageInfo {
      ...LinearPageInfo
    }
  }
  projectUpdates(first: 20) {
    nodes {
      body
      health
      createdAt
    }
    pageInfo {
      ...LinearPageInfo
    }
  }
  documents(first: 20, includeArchived: true) {
    nodes {
      ...LinearDocumentNode
    }
    pageInfo {
      ...LinearPageInfo
    }
  }
}

query DiscoverTeams($after: String) {
  teams(first: 100, after: $after) {
    nodes {
      id
      name
      key
    }
    pageInfo {
      ...LinearPageInfo
    }
  }
}

query DiscoverProjects($after: String) {
  projects(first: 50, after: $after, includeArchived: true) {
    nodes {
      id
      name
      url
      teams(first: 1) {
        nodes {
          id
          key
        }
      }
    }
    pageInfo {
      ...LinearPageInfo
    }
  }
}

query DiscoverDocuments($after: String) {
  documents(first: 50, after: $after, includeArchived: true) {
    nodes {
      id
      title
      url
      project {
        id
      }
    }
    pageInfo {
      ...LinearPageInfo
    }
  }
}

query DiscoverInitiatives($after: String) {
  initiatives(first: 100, after: $after, includeArchived: true) {
    nodes {
