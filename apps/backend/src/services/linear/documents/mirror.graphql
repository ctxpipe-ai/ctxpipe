}

query TeamRecord($id: String!) {
  team(id: $id) {
    id
    name
    key
    description
    createdAt
    updatedAt
    parent {
      id
    }
  }
}

query TeamIssues($id: String!, $after: String) {
  team(id: $id) {
    issues(first: 20, after: $after, includeArchived: true) {
      nodes {
        ...LinearIssueCore
      }
      pageInfo {
        ...LinearPageInfo
      }
    }
  }
}

query TeamIssuesWithNeeds($id: String!, $after: String) {
  team(id: $id) {
    issues(first: 20, after: $after, includeArchived: true) {
      nodes {
        ...LinearIssueCore
        needs(first: 10) {
          nodes {
            ...LinearNeedNode
          }
          pageInfo {
            ...LinearPageInfo
          }
        }
      }
      pageInfo {
        ...LinearPageInfo
      }
    }
  }
}

