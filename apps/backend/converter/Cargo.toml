[package]
name = "ctxpipe-convert"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Converts one file (PDF, DOCX, PPTX, XLSX, HTML, SVG) to text for the ctxpipe knowledge plane"

# Exact versions: the same bytes give the same text only with the same
# parsers. A change of a version changes CONVERTER_VERSION in
# src/knowledge-plane/convert-file.ts (ADR-067).
[dependencies]
anydoc = "=0.2.5"
pdf-inspector = "=1.26.1"
htmd = "=0.6.0"
resvg = "=0.50.0"
roxmltree = "=0.21.2"
base64 = "=0.23.1"
serde_json = "=1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
panic = "abort"
