# The MCP proxy of the CTX arm (run.py adds this file to the Harbor job).
# The egress allowlist of the agent phase holds only the model gateway and
# ctxpipe-mcp-proxy. The bench key stays in this container: the agent sends
# no key, and the proxy adds it. Each trial has its own proxy, so its limits
# apply to one run (README.md).
services:
  ctxpipe-mcp-proxy:
    image: python:3.12.11-alpine3.22@sha256:efcdfa6a6b2fd2afb9c7dfa9a5b288a6f68338b5cfdebe6b637d986067d85757
    # An explicit network: Harbor then does not put the proxy behind the
    # egress sidecar, and the proxy can reach the MCP server.
    networks: [default]
    command: ["python", "-u", "/proxy.py"]
    environment:
      PROXY_UPSTREAM: ${MCP_PROXY_UPSTREAM:?}
      PROXY_KEY: ${MCP_PROXY_KEY:?}
      PROXY_CONVERSATION_ID: ${MCP_PROXY_CONVERSATION_ID:?}
      PROXY_TOOLS: ${MCP_PROXY_TOOLS:?}
      PROXY_MAX_TOOL_CALLS: ${MCP_PROXY_MAX_TOOL_CALLS:?}
    volumes:
      - ${MCP_PROXY_OUT:?}:/out
    configs:
      - source: mcp-proxy
        target: /proxy.py

configs:
  mcp-proxy:
    content: |
      # Forward only /mcp to PROXY_UPSTREAM, with these limits:
      # - the proxy adds the bench key (x-api-key) and the conversation id of
      #   the run; it removes each credential and cookie of the client,
      # - only the tools in PROXY_TOOLS (arms.json): Bash can send a request,
      #   so the proxy also refuses get_related (FalkorDB, D5),
      # - at most PROXY_MAX_TOOL_CALLS tool calls (the count of the server
      #   reserve of the CTX arm),
      # - one JSON-RPC message for each request (no batch), and a small body,
      # - no tracing headers of the client, so that the server samples and
      #   counts each of its model calls.
      # /out/calls.json counts the forwarded tool calls and the HTTP status of
      # each upstream response. A 5xx, a 429, a timeout or a connection error
      # of the server is an error of the arm's own service (ADR-075 decision 7).
      import http.client
      import http.server
      import json
      import os
      import threading
      from urllib.parse import urlsplit

      UPSTREAM = urlsplit(os.environ["PROXY_UPSTREAM"])
      KEY = os.environ["PROXY_KEY"]
      CONVERSATION = os.environ["PROXY_CONVERSATION_ID"]
      TOOLS = set(os.environ["PROXY_TOOLS"].split(","))
      MAX_TOOL_CALLS = int(os.environ["PROXY_MAX_TOOL_CALLS"])
      MAX_BODY = 64 * 1024
      TIMEOUT = 300
      DROP = {"host", "connection", "content-length", "transfer-encoding", "traceparent", "tracestate", "baggage", "x-api-key", "authorization", "cookie", "x-ctxpipe-conversation-id"}
      lock = threading.Lock()
      calls = {"toolCalls": 0, "statuses": {}, "timeouts": 0, "connectionErrors": 0, "refusedTools": {}, "refusedCap": 0}


      def save():
          with open("/out/calls.json.tmp", "w") as f:
              json.dump(calls, f)
          os.replace("/out/calls.json.tmp", "/out/calls.json")


      def count(key, name=None):
          with lock:
              if name is None:
                  calls[key] += 1
              else:
                  calls[key][name] = calls[key].get(name, 0) + 1
              save()


      class Proxy(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              self.forward(None)

          def do_DELETE(self):
              self.forward(None)

          def do_POST(self):
              if self.path != "/mcp":
                  return self.send_error(404)
              length = int(self.headers.get("content-length") or 0)
              if "transfer-encoding" in self.headers or length > MAX_BODY:
                  return self.send_error(413)
              body = self.rfile.read(length)
              try:
                  message = json.loads(body)
              except ValueError:
                  return self.send_error(400, "not JSON")
              if not isinstance(message, dict):
                  return self.send_error(400, "a batch is not allowed")
              if message.get("method") == "tools/call":
                  name = str((message.get("params") or {}).get("name"))
                  if name not in TOOLS:
                      count("refusedTools", name)
                      return self.send_error(403, "the CTX arm does not allow this tool")
                  with lock:
                      if calls["toolCalls"] >= MAX_TOOL_CALLS:
                          calls["refusedCap"] += 1
                          save()
                          return self.send_error(429, "the run used its tool calls")
                      calls["toolCalls"] += 1
                      save()
              self.forward(body)

          def forward(self, body):
              if self.path != "/mcp":
                  return self.send_error(404)
              headers = {k: v for k, v in self.headers.items() if k.lower() not in DROP}
              headers["Host"] = UPSTREAM.netloc
              headers["x-api-key"] = KEY
              headers["x-ctxpipe-conversation-id"] = CONVERSATION
              connection = http.client.HTTPSConnection if UPSTREAM.scheme == "https" else http.client.HTTPConnection
              upstream = connection(UPSTREAM.hostname, UPSTREAM.port, timeout=TIMEOUT)
              try:
                  upstream.request(self.command, UPSTREAM.path, body, headers)
                  response = upstream.getresponse()
              except TimeoutError:
                  count("timeouts")
                  return self.send_error(504, "the MCP server did not answer in time")
              except OSError:
                  count("connectionErrors")
                  return self.send_error(502, "the proxy cannot reach the MCP server")
              count("statuses", str(response.status))
              self.send_response(response.status)
              for k, v in response.getheaders():
                  if k.lower() not in {"connection", "content-length", "transfer-encoding", "set-cookie"}:
                      self.send_header(k, v)
              self.end_headers()
              # Server-sent events: send each part when it comes.
              try:
                  while part := response.read1(65536):
                      self.wfile.write(part)
                      self.wfile.flush()
              except TimeoutError:
                  count("timeouts")
              finally:
                  upstream.close()


      save()
      http.server.ThreadingHTTPServer(("", 80), Proxy).serve_forever()
