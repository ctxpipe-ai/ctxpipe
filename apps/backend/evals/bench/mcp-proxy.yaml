# The MCP proxy of the CTX arm (run.py adds this file to the Harbor job).
# The egress allowlist of the agent phase holds only the model host and
# ctxpipe-mcp-proxy, never host.docker.internal. Thus the agent cannot reach
# the other ports of the host (FalkorDB, ClickHouse, Postgres). The proxy
# forwards only the path /mcp, to the bench backend on port 3660, with the
# headers of the request (x-api-key, x-ctxpipe-conversation-id). The Host
# header to the backend is host.docker.internal:3660, the host of AUTH_BASE_URL.
services:
  ctxpipe-mcp-proxy:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    # An explicit network: Harbor then does not put the proxy behind the
    # egress sidecar, and the proxy can reach the backend on the host.
    networks: [default]
    configs:
      - source: mcp-proxy
        target: /etc/nginx/conf.d/default.conf

configs:
  mcp-proxy:
    content: |
      server {
        listen 80;
        location = /mcp {
          proxy_pass http://host.docker.internal:3660/mcp;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_read_timeout 600s;
        }
        location / {
          return 404;
        }
      }
