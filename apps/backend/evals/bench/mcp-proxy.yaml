# The MCP proxy of the CTX arm (run.py adds this file to the Harbor job).
# The egress allowlist of the agent phase holds only the model host and
# ctxpipe-mcp-proxy, never host.docker.internal. Thus the agent cannot reach
# the other ports of the host (FalkorDB, ClickHouse, Postgres). Each trial has
# its own proxy, so its limits apply to one run (README.md).
services:
  ctxpipe-mcp-proxy:
    image: python:3.12.11-alpine3.22@sha256:efcdfa6a6b2fd2afb9c7dfa9a5b288a6f68338b5cfdebe6b637d986067d85757
    # An explicit network: Harbor then does not put the proxy behind the
    # egress sidecar, and the proxy can reach the backend on the host.
    networks: [default]
    command: ["python", "-u", "/proxy.py"]
    configs:
      - source: mcp-proxy
        target: /proxy.py

configs:
  mcp-proxy:
    content: |
      # Forward only /mcp to the bench backend, with these limits:
      # - only the tools that the CTX arm allows (arms.json): Bash can send a
      #   request, so the proxy also refuses get_related (FalkorDB, D5),
      # - at most MAX_TOOL_CALLS tool calls (the count of the server reserve
      #   of the CTX arm in arms.json),
      # - one JSON-RPC message for each request (no batch), and a small body,
      # - no tracing headers of the client, so that the backend samples
      #   and counts each of its model calls.
      # The Host header is host.docker.internal:3660, the host of
      # AUTH_BASE_URL (the DNS rebinding check of the backend).
      import http.client
      import http.server
      import json
      import threading

      UPSTREAM = "host.docker.internal:3660"
      MAX_TOOL_CALLS = 120
      TOOLS = {"list_workspaces", "search_knowledge", "read_file", "list_files"}
      MAX_BODY = 64 * 1024
      DROP = {"host", "connection", "content-length", "transfer-encoding", "traceparent", "tracestate", "baggage"}
      lock = threading.Lock()
      tool_calls = 0


      class Proxy(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              self.forward(None)

          def do_DELETE(self):
              self.forward(None)

          def do_POST(self):
              global tool_calls
              if self.path != "/mcp":
                  return self.send_error(404)
              length = int(self.headers.get("content-length") or 0)
              if "transfer-encoding" in self.headers or length > MAX_BODY:
                  return self.send_error(413)
              body = self.rfile.read(length)
              try:
                  message = json.loads(body)
              except ValueError:
                  return self.send_error(400, "not JSON")
              if not isinstance(message, dict):
                  return self.send_error(400, "a batch is not allowed")
              if message.get("method") == "tools/call":
                  if (message.get("params") or {}).get("name") not in TOOLS:
                      return self.send_error(403, "the CTX arm does not allow this tool")
                  with lock:
                      if tool_calls >= MAX_TOOL_CALLS:
                          return self.send_error(429, "the run used its tool calls")
                      tool_calls += 1
              self.forward(body)

          def forward(self, body):
              if self.path != "/mcp":
                  return self.send_error(404)
              headers = {k: v for k, v in self.headers.items() if k.lower() not in DROP}
              headers["Host"] = UPSTREAM
              upstream = http.client.HTTPConnection(UPSTREAM, timeout=600)
              upstream.request(self.command, "/mcp", body, headers)
              response = upstream.getresponse()
              self.send_response(response.status)
              for k, v in response.getheaders():
                  if k.lower() not in DROP:
                      self.send_header(k, v)
              self.end_headers()
              # Server-sent events: send each part when it comes.
              while part := response.read1(65536):
                  self.wfile.write(part)
                  self.wfile.flush()
              upstream.close()


      http.server.ThreadingHTTPServer(("", 80), Proxy).serve_forever()
