<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #09090b; color: #e4e4e7; font-family: ui-sans-serif, system-ui, sans-serif; }
      .page { padding: 20px 24px 28px; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      .meta { color: #71717a; font-size: 12px; margin: 0 0 16px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .card { border: 1px solid #3f3f46; overflow: hidden; background: #18181b; }
      .card h2 { margin: 0; padding: 8px 12px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: #a1a1aa; background: #27272a; }
      .stage { min-height: 140px; display: grid; place-items: center; padding: 24px; background: #09090b; }
      .stage.light { background: #f4f4f5; }
      .stage img { height: 44px; width: auto; display: block; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1 id="title">Four directions</h1>
      <p class="meta">Same loop. Four new ways. Dark then light.</p>
      <div class="grid">
        <section class="card"><h2 id="l0">A</h2><div class="stage"><img id="d0" alt="" /></div><div class="stage light"><img id="lgt0" alt="" /></div></section>
        <section class="card"><h2 id="l1">B</h2><div class="stage"><img id="d1" alt="" /></div><div class="stage light"><img id="lgt1" alt="" /></div></section>
        <section class="card"><h2 id="l2">C</h2><div class="stage"><img id="d2" alt="" /></div><div class="stage light"><img id="lgt2" alt="" /></div></section>
        <section class="card"><h2 id="l3">D</h2><div class="stage"><img id="d3" alt="" /></div><div class="stage light"><img id="lgt3" alt="" /></div></section>
      </div>
    </div>
    <script>
      const q = new URLSearchParams(location.search)
      if (q.get("title")) document.getElementById("title").textContent = q.get("title")
      for (let i = 0; i < 4; i++) {
        const name = q.get("n"+i) || String.fromCharCode(65+i)
        document.getElementById("l"+i).textContent = name
        const d = q.get("d"+i); const l = q.get("l"+i)
        if (d) document.getElementById("d"+i).src = d
        if (l) document.getElementById("lgt"+i).src = l
      }
    </script>
  </body>
</html>
