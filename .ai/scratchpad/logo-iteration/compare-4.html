<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ctxpipe logo options</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; background: #111113; color: #e4e4e7; }
      .page { padding: 28px 32px 40px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .meta { color: #a1a1aa; font-size: 13px; margin: 0 0 22px; }
      .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .opt { border: 1px solid #3f3f46; border-radius: 12px; overflow: hidden; background: #18181b; }
      .opt h2 { margin: 0; padding: 10px 14px 2px; font-size: 15px; }
      .opt p { margin: 0; padding: 0 14px 10px; color: #a1a1aa; font-size: 12px; line-height: 1.4; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; }
      .stage { min-height: 140px; display: grid; place-items: center; padding: 18px; }
      .dark { background: #09090b; }
      .light { background: #f4f4f5; }
      .stage img { height: 48px; width: auto; display: block; }
      .sizes { display: flex; gap: 18px; align-items: flex-end; padding: 12px 14px 16px; background: #09090b; border-top: 1px solid #27272a; }
      .sizes img { display: block; width: auto; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1 id="title">Logo options</h1>
      <p class="meta" id="meta">Four candidates. Dark + light + 32/16 scale.</p>
      <div class="opts" id="opts"></div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const title = params.get("title");
      const meta = params.get("meta");
      if (title) document.getElementById("title").textContent = title;
      if (meta) document.getElementById("meta").textContent = meta;
      const items = JSON.parse(params.get("items") || "[]");
      const root = document.getElementById("opts");
      for (const item of items) {
        const el = document.createElement("section");
        el.className = "opt";
        el.innerHTML = `
          <h2>${item.id}. ${item.name}</h2>
          <p>${item.blurb}</p>
          <div class="pair">
            <div class="stage dark"><img src="${item.dark}" alt="" /></div>
            <div class="stage light"><img src="${item.light}" alt="" /></div>
          </div>
          <div class="sizes">
            <img src="${item.dark}" style="height:32px" alt="" />
            <img src="${item.dark}" style="height:16px" alt="" />
          </div>`;
        root.appendChild(el);
      }
    </script>
  </body>
</html>
