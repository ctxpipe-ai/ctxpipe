# Host-side ports are parameterized so a second Compose project can avoid bind conflicts.
# Copy docker-compose.env.example → .env (Compose loads it from this directory).
#
# Profiles:
#   infra  — Postgres, FalkorDB, OTEL (host dev: pnpm dev:infra)
#   deploy — Full containerized stack (pnpm start): infra shared with deploy + apps
#
# Local Zoekt + codesearch API: use `pnpm dev` — Docker image runs start.sh (zoekt-webserver + Bun) with a random host port.

services:
  postgres:
    profiles: [infra, deploy]
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ctxpipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctxpipe}
      POSTGRES_DB: ${POSTGRES_DB:-ctxpipe}
    ports:
      - "${CTXPIPE_POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  falkordb:
    profiles: [infra, deploy]
    image: falkordb/falkordb:latest
    restart: unless-stopped
    environment:
      FALKORDB_ARGS: "BOLT_PORT 7687"
    ports:
      - "${CTXPIPE_FALKOR_REDIS_HOST_PORT:-6379}:6379"
      - "${CTXPIPE_FALKOR_BOLT_HOST_PORT:-7687}:7687"
      - "${CTXPIPE_FALKOR_ADMIN_HOST_PORT:-3003}:3000"

  otel-collector:
    profiles: [infra, deploy]
    image: otel/opentelemetry-collector-contrib:0.149.0
    restart: unless-stopped
    env_file:
      - path: ./apps/otel-collector/.env
        required: false
      - path: ./apps/otel-collector/.env.local
        required: false
    volumes:
      - ./apps/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config", "/etc/otelcol/config.yaml"]
    ports:
      - "${CTXPIPE_OTEL_COLLECTOR_HOST_PORT:-4318}:4318"

  migrate:
    profiles: [deploy]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ctxpipe}:${POSTGRES_PASSWORD:-ctxpipe}@postgres:5432/${POSTGRES_DB:-ctxpipe}
      DATABASE_APP_PASSWORD: ${POSTGRES_PASSWORD:-ctxpipe}
    command: ["bun", "run", "apps/backend/src/db/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy

  dind:
    profiles: [deploy]
    build:
      context: ./scripts/sandbox-runner
    restart: unless-stopped
    # Only the infrastructure runner is privileged; agent containers are not.
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:dind
      CTXPIPE_SANDBOX_STORAGE_GIB: ${CTXPIPE_SANDBOX_STORAGE_GIB:-64}
    volumes:
      - sandbox_storage:/var/lib/ctxpipe-sandbox-storage
      - sandbox_server_certs:/certs/server
      - sandbox_client_certs:/certs/client
      - sandbox_ca:/certs/ca
    healthcheck:
      test: ["CMD-SHELL", "docker --host unix:///var/run/docker.sock info --format '{{.Driver}}' | grep -qx btrfs"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    profiles: [deploy]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$${SANDBOX_CALLBACK_HOST:-}" ]; then
          SANDBOX_CALLBACK_HOST="$$(hostname -i | awk '{ for (i = 1; i <= NF; i++) { count++; address = $$i } } END { if (count == 1) print address; else exit 1 }')" || {
            echo "backend must have exactly one container IP or SANDBOX_CALLBACK_HOST must be set" >&2
            exit 1
          }
          export SANDBOX_CALLBACK_HOST
        fi
        exec "$$@"
      - --
    command: ["bun", "run", "apps/backend/src/server.ts"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ctxpipe_app:${POSTGRES_PASSWORD:-ctxpipe}@postgres:5432/${POSTGRES_DB:-ctxpipe}
      GRAPH_DB_URI: redis://falkordb:6379
      UI_PROXY_URL: http://ui:3002
      CODESEARCH_URL: http://codesearch:3001
      SANDBOX_PROVIDER: docker
      SANDBOX_CALLBACK_HOST: ${SANDBOX_CALLBACK_HOST:-}
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      PORT: "3000"
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3000}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_SERVICE_NAME: backend
      AMPLITUDE_API_KEY: ${AMPLITUDE_API_KEY:-}
      AMPLITUDE_REGION: ${AMPLITUDE_REGION:-us}
      CONFLUENCE_FORGE_INSTALL_URL: ${CONFLUENCE_FORGE_INSTALL_URL:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-}
      CONNECTION_SECRETS_ENCRYPTION_KEY: ${CONNECTION_SECRETS_ENCRYPTION_KEY:-}
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      LINEAR_REDIRECT_URI: ${LINEAR_REDIRECT_URI:-}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
    ports:
      - "${CTXPIPE_BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - sandbox_client_certs:/certs/client:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_started
      otel-collector:
        condition: service_started
      ui:
        condition: service_started
      dind:
        condition: service_healthy

  worker:
    profiles: [deploy]
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ctxpipe_app:${POSTGRES_PASSWORD:-ctxpipe}@postgres:5432/${POSTGRES_DB:-ctxpipe}
      GRAPH_DB_URI: redis://falkordb:6379
      SANDBOX_PROVIDER: docker
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      # Required to decrypt connection secrets (Slack bot tokens, GitHub App keys).
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3000}
      CONNECTION_SECRETS_ENCRYPTION_KEY: ${CONNECTION_SECRETS_ENCRYPTION_KEY:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_SERVICE_NAME: openworkflow
      LINEAR_CLIENT_ID: ${LINEAR_CLIENT_ID:-}
      LINEAR_CLIENT_SECRET: ${LINEAR_CLIENT_SECRET:-}
      LINEAR_REDIRECT_URI: ${LINEAR_REDIRECT_URI:-}
      LINEAR_WEBHOOK_SECRET: ${LINEAR_WEBHOOK_SECRET:-}
    volumes:
      - sandbox_client_certs:/certs/client:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_started
      dind:
        condition: service_healthy

  ui:
    profiles: [deploy]
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        VITE_PUBLIC_API_URL: ${CTXPIPE_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOST: "0.0.0.0"
      AMPLITUDE_API_KEY: ${AMPLITUDE_API_KEY:-}
      AMPLITUDE_REGION: ${AMPLITUDE_REGION:-us}
      CONFLUENCE_FORGE_INSTALL_URL: ${CONFLUENCE_FORGE_INSTALL_URL:-}
    ports:
      - "${CTXPIPE_UI_HOST_PORT:-3002}:3002"

  codesearch:
    profiles: [deploy]
    build:
      context: .
      dockerfile: apps/codesearch/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ctxpipe_app:${POSTGRES_PASSWORD:-ctxpipe}@postgres:5432/${POSTGRES_DB:-ctxpipe}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ZOEKT_WEBSERVER_URL: http://127.0.0.1:6070
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PORT: "3001"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      OTEL_SERVICE_NAME: codesearch
    ports:
      - "${CTXPIPE_CODESEARCH_HOST_PORT:-3001}:3001"
    volumes:
      - zoekt_index_deploy:/data/zoekt-index
      - repo_cache:/data/repo-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  sandbox_storage:
  sandbox_server_certs:
  sandbox_client_certs:
  sandbox_ca:
  zoekt_index_deploy:
  repo_cache:
