name: File converter of the knowledge plane
description: >
  Restore or build the file converter (apps/backend/converter) before a job
  starts the backend Vitest config. Its global setup runs the `converter`
  prerequisite, which then only checks the binary (SKIP_CONVERTER_BUILD=1).
  The cache holds the binary, keyed by the files of the converter (a checkout
  has no `target/` yet), which hold the Rust pin (rust-toolchain.toml). A
  miss builds it here, before
  the tests start: a cold build takes minutes, longer than a test case may
  take. Run it after pnpm install.
runs:
  using: composite
  steps:
    - name: Restore the file converter
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: apps/backend/converter/target/release/ctxpipe-convert
        key: converter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/backend/converter/**') }}
    - name: Required file converter
      shell: bash
      run: |
        if [ ! -x apps/backend/converter/target/release/ctxpipe-convert ]; then
          node scripts/checks/prerequisites.mjs converter
        fi
        echo "SKIP_CONVERTER_BUILD=1" >> "$GITHUB_ENV"
