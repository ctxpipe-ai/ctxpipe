name: PR Deploy

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
  # Cloud-agent git pushes often do not emit pull_request synchronize. Manual
  # redeploy: Actions → PR Deploy → Run workflow → enter PR number.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to deploy (e.g. 255)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('pr-{0}', inputs.pr_number) || github.ref }}

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  resolve_pr:
    name: Resolve PR number and head SHA
    if: |
      github.event_name == 'workflow_dispatch' || (
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PR_NUMBER="${{ inputs.pr_number }}"
            HEAD_SHA="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq .head.sha)"
          else
            PR_NUMBER="${{ github.event.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR_NUMBER @ $HEAD_SHA"

  build_pr_images:
    name: Build and Publish PR GHCR Images
    needs: [resolve_pr]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: apps/backend/Dockerfile
          - image: worker
            dockerfile: apps/backend/Dockerfile.worker
          - image: ui
            dockerfile: apps/ui/Dockerfile
          - image: codesearch
            dockerfile: apps/codesearch/Dockerfile
          # otel-collector is not built/deployed for PR envs (keeps previews asleep; no Better Stack quota burn).
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.resolve_pr.outputs.head_sha }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1
        with:
          max-cache-size-mb: "61440"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/ctxpipe-ai/${{ matrix.image }}:pr-${{ needs.resolve_pr.outputs.pr_number }}-${{ needs.resolve_pr.outputs.head_sha }}
            ghcr.io/ctxpipe-ai/${{ matrix.image }}:${{ needs.resolve_pr.outputs.head_sha }}

  deploy_pr_environment:
    name: Deploy PR environment (Railway + Neon)
    needs: [resolve_pr, build_pr_images]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PR_ENV: pr-${{ needs.resolve_pr.outputs.pr_number }}
      IMAGE_TAG: pr-${{ needs.resolve_pr.outputs.pr_number }}-${{ needs.resolve_pr.outputs.head_sha }}
      PR_NUMBER: ${{ needs.resolve_pr.outputs.pr_number }}
    outputs:
      env_id: ${{ steps.railway_env.outputs.env_id }}
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1
        with:
          ref: ${{ needs.resolve_pr.outputs.head_sha }}

      - name: Mount pnpm store sticky disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-pnpm-store
          path: ~/.pnpm-store

      - uses: pnpm/action-setup@v4

      - uses: useblacksmith/setup-node@v5
        with:
          node-version: "22"

      - name: Force pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Install Railway CLI
        # @railway/cli postinstall fetches a GitHub release tarball; that often
        # socket-hangs (ECONNRESET) on hosted runners.
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 15
          command: npm install -g @railway/cli@4.35.2

      - name: Ensure Railway PR environment exists
        # Railway API/CLI calls can be flaky; retry once before failing.
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 12
          max_attempts: 2
          command: |
            set -euo pipefail
            railway link --project "${{ vars.RAILWAY_PROJECT_ID }}" --environment production
            if railway environment config --environment "$PR_ENV" --json >/dev/null 2>&1; then
              echo "Railway environment $PR_ENV already exists"
            else
              set +e
              railway environment new "$PR_ENV" --duplicate production
              CREATE_STATUS=$?
              set -e

              if [[ "$CREATE_STATUS" -ne 0 ]]; then
                echo "Failed to create Railway environment $PR_ENV from production duplicate."
                echo "Deleting partially-created environment so retry can start from a clean slate."
                railway environment delete "$PR_ENV" --yes || echo "Railway environment delete skipped or already removed"
                echo "Waiting 10 minutes for Railway environment deletion consistency before retry..."
                sleep 600
                exit "$CREATE_STATUS"
              fi
            fi
            railway link --project "${{ vars.RAILWAY_PROJECT_ID }}" --environment "$PR_ENV"

      - name: Neon branch expiration (14 days)
        id: neon_expires
        run: echo "expires_at=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # Preview DBs are ephemeral. Recreate so squashed / rewritten migrations always
      # apply on a clean schema (reusing a dirty branch fails with "already exists").
      - name: Delete existing Neon preview branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          PROJECT_ID="${{ vars.NEON_PROJECT_ID }}"
          BRANCH_NAME="preview/pr-${{ needs.resolve_pr.outputs.pr_number }}"
          API="https://console.neon.tech/api/v2"
          RESP=$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" \
            "${API}/projects/${PROJECT_ID}/branches")
          BID=$(echo "$RESP" | jq -r --arg n "$BRANCH_NAME" '.branches[]? | select(.name == $n) | .id' | head -1)
          if [[ -z "$BID" ]]; then
            echo "Neon branch not found (first deploy?): $BRANCH_NAME"
            exit 0
          fi
          curl -fsS -X DELETE -H "Authorization: Bearer ${NEON_API_KEY}" \
            "${API}/projects/${PROJECT_ID}/branches/${BID}"
          echo "Deleted Neon branch $BRANCH_NAME for a fresh migrate"

      - name: Create Neon branch
        id: neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ needs.resolve_pr.outputs.pr_number }}
          parent_branch: production
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.neon_expires.outputs.expires_at }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle migrations on PR Neon branch
        working-directory: apps/backend
        run: NO_COLOR=1 CI=true stdbuf -oL -eL pnpm exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ steps.neon_branch.outputs.db_url }}

      - name: Get Railway environment ID
        id: railway_env
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        # Railway API/CLI calls can be flaky; retry once before failing.
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: |
            set -euo pipefail
            ENV_NAME="pr-${{ needs.resolve_pr.outputs.pr_number }}"
            # Query for environment ID by name
            ENV_ID=$(curl -fsS -X POST \
              -H "Authorization: Bearer ${RAILWAY_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"query\": \"query { project(id: \\\"${{ vars.RAILWAY_PROJECT_ID }}\\\") { environments { edges { node { id name } } } } }\"}" \
              https://backboard.railway.com/graphql/v2 \
              | jq -r --arg name "$ENV_NAME" '.data.project.environments.edges[] | select(.node.name == $name) | .node.id')
            if [[ -z "$ENV_ID" ]]; then
              echo "Error: Could not find environment $ENV_NAME"
              exit 1
            fi
            echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"
            echo "Found environment ID: $ENV_ID"

      - name: Update Railway service config via GraphQL and deploy once
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          ENV_ID: ${{ steps.railway_env.outputs.env_id }}
          NEON_DB_URL: ${{ steps.neon_branch.outputs.db_url }}
          BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
          WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
          UI_SERVICE_ID: ${{ vars.RAILWAY_UI_SERVICE_ID }}
          CODESEARCH_SERVICE_ID: ${{ vars.RAILWAY_CODESEARCH_SERVICE_ID }}
          BACKEND_IMAGE: ghcr.io/ctxpipe-ai/backend:${{ env.IMAGE_TAG }}
          WORKER_IMAGE: ghcr.io/ctxpipe-ai/worker:${{ env.IMAGE_TAG }}
          UI_IMAGE: ghcr.io/ctxpipe-ai/ui:${{ env.IMAGE_TAG }}
          CODESEARCH_IMAGE: ghcr.io/ctxpipe-ai/codesearch:${{ env.IMAGE_TAG }}
        # Railway API/CLI calls can be flaky; retry once before failing.
        # Waits for backend/worker/ui/codesearch deploys to SUCCESS (up to ~7m each).
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 35
          max_attempts: 2
          command: |
            set -euo pipefail

            if [[ -z "${RAILWAY_API_TOKEN:-}" ]]; then
              echo "Missing RAILWAY_API_TOKEN secret"
              exit 1
            fi

            if [[ -z "${ENV_ID:-}" ]]; then
              echo "Missing Railway environment id output"
              exit 1
            fi

            if [[ -z "${RAILWAY_PROJECT_ID:-}" ]]; then
              echo "Missing RAILWAY_PROJECT_ID variable"
              exit 1
            fi

            if [[ -z "${NEON_DB_URL:-}" ]]; then
              echo "Missing NEON_DB_URL output"
              exit 1
            fi

            require_var() {
              local name="$1"
              if [[ -z "${!name:-}" ]]; then
                echo "Missing required variable: $name"
                exit 1
              fi
            }

            require_var BACKEND_SERVICE_ID
            require_var WORKER_SERVICE_ID
            require_var UI_SERVICE_ID
            require_var CODESEARCH_SERVICE_ID

            railway_graphql() {
              local query="$1"
              local variables="$2"
              local raw http_code body
              # Capture body + status so GraphQL validation/400s are visible in logs
              # (curl -f alone only prints "returned error: 400").
              raw="$(curl -sS -w '\n%{http_code}' \
                -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$(jq -nc --arg q "$query" --argjson v "$variables" '{query:$q,variables:$v}')" \
                https://backboard.railway.com/graphql/v2)" || return $?
              http_code="$(printf '%s' "$raw" | tail -n1)"
              body="$(printf '%s' "$raw" | sed '$d')"
              if [[ "$http_code" != "200" ]]; then
                echo "Railway GraphQL HTTP $http_code for query: ${query:0:120}…" >&2
                echo "$body" >&2
                return 22
              fi
              # Railway often returns HTTP 200 with GraphQL errors; treat those as failure
              # so image updates / deploys cannot silently no-op.
              if echo "$body" | jq -e '.errors | type == "array" and length > 0' >/dev/null 2>&1; then
                echo "Railway GraphQL errors for query: ${query:0:120}…" >&2
                echo "$body" | jq -c '.errors' >&2
                return 22
              fi
              printf '%s' "$body"
            }

            # Cache of name -> id from a single project services query (Terraform names).
            SERVICE_IDS_BY_NAME_JSON=""

            load_service_ids_by_name() {
              if [[ -n "$SERVICE_IDS_BY_NAME_JSON" ]]; then
                return 0
              fi
              local response
              response="$(railway_graphql \
                'query ProjectServices($id: String!) { project(id: $id) { services { edges { node { id name } } } } }' \
                "$(jq -nc --arg id "$RAILWAY_PROJECT_ID" '{id:$id}')")"
              if echo "$response" | jq -e '.errors | length > 0' >/dev/null 2>&1; then
                echo "Failed to list Railway project services: $(echo "$response" | jq -r '.errors[].message' | paste -sd '; ' -)" >&2
                exit 1
              fi
              SERVICE_IDS_BY_NAME_JSON="$(echo "$response" | jq -c '
                [.data.project.services.edges[]?.node // empty | select(.name and .id) | {key: .name, value: .id}]
                | from_entries
              ')"
              echo "Loaded Railway service name map ($(echo "$SERVICE_IDS_BY_NAME_JSON" | jq 'keys | length') services)" >&2
            }

            resolve_service_id_by_name() {
              local name="$1"
              load_service_ids_by_name
              echo "$SERVICE_IDS_BY_NAME_JSON" | jq -r --arg name "$name" '.[$name] // empty'
            }

            current_database_url() {
              local service_id="$1"
              railway_graphql \
                'query variables($projectId: String!, $environmentId: String!, $serviceId: String) { variables(projectId: $projectId, environmentId: $environmentId, serviceId: $serviceId) }' \
                "$(jq -nc --arg project "$RAILWAY_PROJECT_ID" --arg env "$ENV_ID" --arg service "$service_id" '{projectId:$project, environmentId:$env, serviceId:$service}')" \
                | jq -r '.data.variables.DATABASE_URL // empty'
            }

            upsert_database_url_without_deploy() {
              local service_id="$1"
              local current_db_url
              current_db_url="$(current_database_url "$service_id")"

              if [[ "$current_db_url" == "$NEON_DB_URL" ]]; then
                echo "DATABASE_URL unchanged for service $service_id; skipping variable update"
                return 0
              fi

              railway_graphql \
                'mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }' \
                "$(jq -nc --arg project "$RAILWAY_PROJECT_ID" --arg env "$ENV_ID" --arg service "$service_id" --arg db "$NEON_DB_URL" '{input:{projectId:$project, environmentId:$env, serviceId:$service, variables:{DATABASE_URL:$db}, skipDeploys:true}}')"

              echo "Updated DATABASE_URL for service $service_id with skipDeploys=true"
            }

            # Preview-only: turn off LangSmith and delete OTEL exporters so apps do not
            # emit 60s metrics/logs (which keep Railway Serverless awake and wake otelcollector).
            delete_service_variable() {
              local service_id="$1"
              local name="$2"
              railway_graphql \
                'mutation variableDelete($input: VariableDeleteInput!) { variableDelete(input: $input) }' \
                "$(jq -nc --arg project "$RAILWAY_PROJECT_ID" --arg env "$ENV_ID" --arg service "$service_id" --arg name "$name" \
                  '{input:{projectId:$project, environmentId:$env, serviceId:$service, name:$name}}')" >/dev/null 2>&1 || true
            }

            upsert_preview_service_variables() {
              local service_id="$1"
              railway_graphql \
                'mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }' \
                "$(jq -nc --arg project "$RAILWAY_PROJECT_ID" --arg env "$ENV_ID" --arg service "$service_id" \
                  '{
                    input: {
                      projectId: $project,
                      environmentId: $env,
                      serviceId: $service,
                      skipDeploys: true,
                      variables: {
                        ENABLE_LANGSMITH: "false"
                      }
                    }
                  }')"
              # Delete (not empty-string upsert) so Railway truly unsets OTEL endpoints.
              delete_service_variable "$service_id" "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT"
              delete_service_variable "$service_id" "OTEL_EXPORTER_OTLP_LOGS_ENDPOINT"
              delete_service_variable "$service_id" "OTEL_EXPORTER_OTLP_METRICS_ENDPOINT"
              echo "Updated preview ENABLE_LANGSMITH=false and deleted OTEL exporters for service $service_id"
            }

            # UI Nitro must bind 0.0.0.0 or Railway healthcheck on / never reaches the process.
            upsert_preview_ui_bind_variables() {
              local service_id="$1"
              railway_graphql \
                'mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }' \
                "$(jq -nc --arg project "$RAILWAY_PROJECT_ID" --arg env "$ENV_ID" --arg service "$service_id" \
                  '{
                    input: {
                      projectId: $project,
                      environmentId: $env,
                      serviceId: $service,
                      skipDeploys: true,
                      variables: {
                        HOST: "0.0.0.0",
                        NITRO_HOST: "0.0.0.0"
                      }
                    }
                  }')"
              echo "Set HOST=0.0.0.0 and NITRO_HOST=0.0.0.0 for UI $service_id"
            }

            # Backend: allow waking the worker after enqueue (Railway GraphQL deploy).
            upsert_preview_backend_wake_variables() {
              local service_id="$1"
              local token
              token="${RAILWAY_API_TOKEN:?RAILWAY_API_TOKEN must be set for preview worker wake}"
              railway_graphql \
                'mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }' \
                "$(jq -nc \
                  --arg project "$RAILWAY_PROJECT_ID" \
                  --arg env "$ENV_ID" \
                  --arg service "$service_id" \
                  --arg wake_token "$token" \
                  '{
                    input: {
                      projectId: $project,
                      environmentId: $env,
                      serviceId: $service,
                      skipDeploys: true,
                      variables: {
                        RAILWAY_TOKEN: $wake_token
                      }
                    }
                  }')"
              echo "Updated preview RAILWAY_TOKEN on backend service $service_id for worker wake"
            }

            update_preview_worker_service_instance() {
              local service_id="$1"
              local image="$2"
              railway_graphql \
                'mutation serviceInstanceUpdate($environmentId: String, $serviceId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: $input) }' \
                "$(jq -nc --arg env "$ENV_ID" --arg service "$service_id" --arg img "$image" '{environmentId:$env, serviceId:$service, input:{source:{image:$img}, sleepApplication:true, restartPolicyType:"ON_FAILURE"}}')"
              echo "Updated preview worker image, serverless, and restart policy ON_FAILURE for $service_id"
            }

            upsert_preview_worker_idle_exit() {
              local service_id="$1"
              # Explicit OPENWORKFLOW_PR_IDLE_EXIT so supervisor idle-exits even if
              # RAILWAY_ENVIRONMENT_NAME is missing. 180s idle; 1h stale window.
              railway_graphql \
                'mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }' \
                "$(jq -nc --arg project "$RAILWAY_PROJECT_ID" --arg env "$ENV_ID" --arg service "$service_id" \
                  '{
                    input: {
                      projectId: $project,
                      environmentId: $env,
                      serviceId: $service,
                      skipDeploys: true,
                      variables: {
                        OPENWORKFLOW_PR_IDLE_EXIT: "true",
                        OPENWORKFLOW_IDLE_EXIT_SECONDS: "180",
                        OPENWORKFLOW_IDLE_STALE_AFTER_HOURS: "1"
                      }
                    }
                  }')"
              echo "Set OPENWORKFLOW_PR_IDLE_EXIT + IDLE_EXIT=180 + STALE_AFTER_HOURS=1 for worker $service_id"
            }

            update_source_image() {
              local service_id="$1"
              local image="$2"
              railway_graphql \
                'mutation serviceInstanceUpdate($environmentId: String, $serviceId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: $input) }' \
                "$(jq -nc --arg env "$ENV_ID" --arg service "$service_id" --arg img "$image" '{environmentId:$env, serviceId:$service, input:{source:{image:$img}, sleepApplication:true}}')"
            }

            # Preview UI: Nitro SSR can pass local curls but Railway's / healthcheck
            # stays "service unavailable" for 5m and blocks the image roll. Clear the
            # path so deploy can succeed; backend still proxies to the UI privately.
            update_ui_source_image() {
              local service_id="$1"
              local image="$2"
              railway_graphql \
                'mutation serviceInstanceUpdate($environmentId: String, $serviceId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: $input) }' \
                "$(jq -nc --arg env "$ENV_ID" --arg service "$service_id" --arg img "$image" \
                  '{environmentId:$env, serviceId:$service, input:{source:{image:$img}, sleepApplication:true, healthcheckPath:""}}')"
              echo "Updated UI image and cleared healthcheckPath for $service_id"
            }

            # Serverless only (no image change) — for infra images managed by Terraform (e.g. FalkorDB).
            enable_serverless() {
              local service_id="$1"
              railway_graphql \
                'mutation serviceInstanceUpdate($environmentId: String, $serviceId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: $input) }' \
                "$(jq -nc --arg env "$ENV_ID" --arg service "$service_id" '{environmentId:$env, serviceId:$service, input:{sleepApplication:true}}')"
            }

            # Scale a service to zero replicas in this environment (config only).
            # Use multiRegionConfig only — top-level numReplicas is deprecated, and
            # serviceInstance has no `regions` field (that query returned HTTP 400).
            # Region matches Terraform default in infra/module/ctxpipe/railway.tf.
            # Non-fatal: deploymentStop below is what actually stops running containers.
            scale_service_to_zero() {
              local service_id="$1"
              if railway_graphql \
                'mutation serviceInstanceUpdate($environmentId: String, $serviceId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: $input) }' \
                "$(jq -nc --arg env "$ENV_ID" --arg service "$service_id" '{
                  environmentId: $env,
                  serviceId: $service,
                  input: {
                    sleepApplication: true,
                    multiRegionConfig: {"asia-southeast1-eqsg3a": {"numReplicas": 0}}
                  }
                }')" >/dev/null; then
                echo "Scaled service $service_id to 0 replicas (config)"
              else
                echo "Warning: failed to scale service $service_id to 0 replicas (continuing with deploymentStop)" >&2
              fi
            }

            # Stop active deployments without creating a new one (no "Deploy" in UI).
            stop_active_deployments() {
              local service_id="$1"
              local response dep_ids
              response="$(railway_graphql \
                'query deployments($input: DeploymentListInput!) { deployments(input: $input) { edges { node { id status } } } }' \
                "$(jq -nc --arg env "$ENV_ID" --arg service "$service_id" '{input:{environmentId:$env, serviceId:$service}}')")"
              dep_ids="$(echo "$response" | jq -r '
                .data.deployments.edges[]?
                | .node
                | select(.status == "SUCCESS" or .status == "DEPLOYING" or .status == "INITIALIZING" or .status == "BUILDING" or .status == "WAITING")
                | .id
              ' 2>/dev/null || true)"
              if [[ -z "$dep_ids" ]]; then
                echo "No active deployments to stop for service $service_id"
                return 0
              fi
              while IFS= read -r dep_id; do
                [[ -z "$dep_id" ]] && continue
                railway_graphql \
                  'mutation deploymentStop($id: String!) { deploymentStop(id: $id) }' \
                  "$(jq -nc --arg id "$dep_id" '{id:$id}')" >/dev/null || true
                echo "Stopped deployment $dep_id for service $service_id"
              done <<< "$dep_ids"
            }

            # Read back sleepApplication for deploy logs / debugging.
            verify_sleep_application() {
              local label="$1"
              local service_id="$2"
              local response sleep_val
              response="$(railway_graphql \
                'query serviceInstanceSleep($environmentId: String!, $serviceId: String!) { serviceInstance(environmentId: $environmentId, serviceId: $serviceId) { sleepApplication } }' \
                "$(jq -nc --arg env "$ENV_ID" --arg service "$service_id" '{environmentId:$env, serviceId:$service}')")"
              sleep_val="$(echo "$response" | jq -r '.data.serviceInstance.sleepApplication // empty')"
              echo "$label ($service_id) sleepApplication=$( [[ -n "$sleep_val" ]] && echo "$sleep_val" || echo "unknown" ) raw=$(echo "$response" | jq -c '{data,errors}')"
              if [[ "$sleep_val" != "true" ]]; then
                echo "Warning: expected sleepApplication=true for $label but got '$sleep_val'"
              fi
            }

            deploy_service() {
              local service_id="$1"
              railway_graphql \
                'mutation serviceInstanceDeployV2($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }' \
                "$(jq -nc --arg env "$ENV_ID" --arg service "$service_id" '{environmentId:$env, serviceId:$service}')"
            }

            # serviceInstanceDeployV2 is async — without waiting, preview can stay on a
            # stale UI image while the workflow reports green.
            wait_for_image_deploy() {
              local label="$1"
              local service_id="$2"
              local expected_image="$3"
              local timeout_s="${4:-420}"
              local expected_tag="${expected_image##*:}"
              local started_at deadline response status image node_json newest
              started_at="$(date +%s)"
              deadline=$((started_at + timeout_s))
              echo "Waiting for $label ($service_id) to reach SUCCESS with image $expected_image (timeout ${timeout_s}s)"
              while true; do
                response="$(railway_graphql \
                  'query deployments($input: DeploymentListInput!) { deployments(input: $input) { edges { node { id status createdAt meta } } } }' \
                  "$(jq -nc --arg env "$ENV_ID" --arg service "$service_id" '{input:{environmentId:$env, serviceId:$service}}')")"
                # Only accept a deployment whose meta mentions the expected image/tag.
                # Never treat an older SUCCESS (different tag) as done.
                node_json="$(echo "$response" | jq -c --arg img "$expected_image" --arg tag "$expected_tag" '
                  [.data.deployments.edges[]?.node // empty
                    | select(
                        ((.meta | tostring) | contains($img))
                        or ((.meta | tostring) | contains($tag))
                      )
                  ][0] // empty
                ')"
                if [[ -n "$node_json" && "$node_json" != "null" ]]; then
                  status="$(echo "$node_json" | jq -r '.status // empty')"
                  image="$(echo "$node_json" | jq -r '.meta.image // empty')"
                  echo "$label matching deploy status=${status:-unknown} image=${image:-unknown}"
                  if [[ "$status" == "SUCCESS" ]]; then
                    # Best-effort confirm configured source image (schema may vary).
                    if response="$(railway_graphql \
                      'query serviceInstanceSource($environmentId: String!, $serviceId: String!) { serviceInstance(environmentId: $environmentId, serviceId: $serviceId) { source { image } } }' \
                      "$(jq -nc --arg env "$ENV_ID" --arg service "$service_id" '{environmentId:$env, serviceId:$service}')" 2>/dev/null)"; then
                      image="$(echo "$response" | jq -r '.data.serviceInstance.source.image // empty')"
                      echo "$label serviceInstance.source.image=${image:-unknown}"
                      if [[ -n "$image" && "$image" != *"$expected_tag"* ]]; then
                        echo "ERROR: $label source image is '$image', expected to contain '$expected_tag'" >&2
                        return 1
                      fi
                    else
                      echo "Warning: could not query $label serviceInstance.source.image (continuing after SUCCESS)"
                    fi
                    return 0
                  fi
                  if [[ "$status" == "FAILED" || "$status" == "CRASHED" || "$status" == "REMOVED" ]]; then
                    echo "ERROR: $label deployment ended with status=$status" >&2
                    echo "$node_json" >&2
                    dep_id="$(echo "$node_json" | jq -r '.id // empty')"
                    if [[ -n "$dep_id" ]]; then
                      echo "=== $label deploymentLogs for $dep_id ===" >&2
                      railway_graphql \
                        'query($id: String!, $limit: Int) { deploymentLogs(deploymentId: $id, limit: $limit) { timestamp severity message } }' \
                        "$(jq -nc --arg id "$dep_id" '{id:$id, limit:200}')" \
                        | jq -r '(.data.deploymentLogs // [])[]? | "\(.timestamp) [\(.severity)] \(.message)"' >&2 || true
                      echo "=== $label buildLogs for $dep_id ===" >&2
                      railway_graphql \
                        'query($id: String!, $limit: Int) { buildLogs(deploymentId: $id, limit: $limit) { timestamp severity message } }' \
                        "$(jq -nc --arg id "$dep_id" '{id:$id, limit:100}')" \
                        | jq -r '(.data.buildLogs // [])[]? | "\(.timestamp) [\(.severity)] \(.message)"' >&2 || true
                    fi
                    return 1
                  fi
                else
                  newest="$(echo "$response" | jq -r '.data.deployments.edges[0].node | "\(.status // "?") meta=\(.meta|tostring)"')"
                  echo "$label no deploy yet for $expected_tag (newest: ${newest:-none})"
                fi
                if (( $(date +%s) >= deadline )); then
                  echo "ERROR: timed out waiting for $label deployment with image $expected_image" >&2
                  echo "$response" | jq -c '.data.deployments.edges[0:5]' >&2 || true
                  return 1
                fi
                sleep 8
              done
            }

            upsert_database_url_without_deploy "$BACKEND_SERVICE_ID" >/dev/null
            upsert_preview_service_variables "$BACKEND_SERVICE_ID" >/dev/null
            upsert_preview_backend_wake_variables "$BACKEND_SERVICE_ID" >/dev/null
            update_source_image "$BACKEND_SERVICE_ID" "$BACKEND_IMAGE" >/dev/null
            deploy_service "$BACKEND_SERVICE_ID" >/dev/null
            wait_for_image_deploy "backend" "$BACKEND_SERVICE_ID" "$BACKEND_IMAGE"

            upsert_database_url_without_deploy "$WORKER_SERVICE_ID" >/dev/null
            upsert_preview_service_variables "$WORKER_SERVICE_ID" >/dev/null
            upsert_preview_worker_idle_exit "$WORKER_SERVICE_ID" >/dev/null
            update_preview_worker_service_instance "$WORKER_SERVICE_ID" "$WORKER_IMAGE" >/dev/null
            deploy_service "$WORKER_SERVICE_ID" >/dev/null
            wait_for_image_deploy "worker" "$WORKER_SERVICE_ID" "$WORKER_IMAGE"

            upsert_preview_service_variables "$UI_SERVICE_ID" >/dev/null
            upsert_preview_ui_bind_variables "$UI_SERVICE_ID" >/dev/null
            update_ui_source_image "$UI_SERVICE_ID" "$UI_IMAGE" >/dev/null
            deploy_service "$UI_SERVICE_ID" >/dev/null
            wait_for_image_deploy "ui" "$UI_SERVICE_ID" "$UI_IMAGE"

            upsert_database_url_without_deploy "$CODESEARCH_SERVICE_ID" >/dev/null
            update_source_image "$CODESEARCH_SERVICE_ID" "$CODESEARCH_IMAGE" >/dev/null
            deploy_service "$CODESEARCH_SERVICE_ID" >/dev/null
            wait_for_image_deploy "codesearch" "$CODESEARCH_SERVICE_ID" "$CODESEARCH_IMAGE"

            # Terraform service names: otelcollector, falkordb (resolved via GraphQL; no GitHub vars).
            load_service_ids_by_name
            OTELCOLLECTOR_SERVICE_ID="$(echo "$SERVICE_IDS_BY_NAME_JSON" | jq -r '.otelcollector // empty')"
            FALKORDB_SERVICE_ID="$(echo "$SERVICE_IDS_BY_NAME_JSON" | jq -r '.falkordb // empty')"

            # Never deploy otelcollector in PR: scale to 0 and stop active deployments
            # (no serviceInstanceDeployV2 — that was waking/starting containers).
            if [[ -n "$OTELCOLLECTOR_SERVICE_ID" ]]; then
              delete_service_variable "$OTELCOLLECTOR_SERVICE_ID" "BETTER_STACK_TOKEN"
              scale_service_to_zero "$OTELCOLLECTOR_SERVICE_ID" >/dev/null
              stop_active_deployments "$OTELCOLLECTOR_SERVICE_ID"
              echo "otel-collector ($OTELCOLLECTOR_SERVICE_ID) scaled to 0 and active deployments stopped (not deployed)"
              verify_sleep_application "otel-collector" "$OTELCOLLECTOR_SERVICE_ID"
            else
              echo "Warning: no Railway service named otelcollector in project $RAILWAY_PROJECT_ID; skipping"
            fi

            if [[ -n "$FALKORDB_SERVICE_ID" ]]; then
              enable_serverless "$FALKORDB_SERVICE_ID" >/dev/null
              deploy_service "$FALKORDB_SERVICE_ID" >/dev/null
              echo "falkordb ($FALKORDB_SERVICE_ID) serverless enabled and deployed"
              verify_sleep_application "falkordb" "$FALKORDB_SERVICE_ID"
            else
              echo "Warning: no Railway service named falkordb in project $RAILWAY_PROJECT_ID; skipping"
            fi

            echo "All services updated and deployed with a single deploy per service"

      - name: Get backend public URL
        id: backend_url
        continue-on-error: true
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ENV_ID: ${{ steps.railway_env.outputs.env_id }}
          BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
        # Railway API/CLI calls can be flaky; retry once before failing.
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: |
            set -euo pipefail

            if [[ -z "${RAILWAY_API_TOKEN:-}" || -z "${ENV_ID:-}" || -z "${BACKEND_SERVICE_ID:-}" ]]; then
              echo "Missing Railway token/environment/service id, skipping backend URL lookup"
              echo "backend_url=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            RESPONSE=$(curl -fsS \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg env "$ENV_ID" --arg service "$BACKEND_SERVICE_ID" '{query:"query serviceInstanceDomain($environmentId: String!, $serviceId: String!) { serviceInstance(environmentId: $environmentId, serviceId: $serviceId) { domains { serviceDomains { domain } customDomains { domain } } } }",variables:{environmentId:$env,serviceId:$service}}')" \
              https://backboard.railway.com/graphql/v2)

            DOMAIN=$(echo "$RESPONSE" | jq -r '.data.serviceInstance.domains.customDomains[0].domain // .data.serviceInstance.domains.serviceDomains[0].domain // empty')
            if [[ -n "$DOMAIN" ]]; then
              echo "backend_url=https://$DOMAIN" >> "$GITHUB_OUTPUT"
              echo "Resolved backend URL: https://$DOMAIN"
            else
              echo "No backend public domain found for service instance"
              echo "backend_url=" >> "$GITHUB_OUTPUT"
            fi

      - name: Build PR deploy comment body
        if: always()
        run: |
          set -euo pipefail
          BACKEND_URL="${{ steps.backend_url.outputs.backend_url }}"
          DASHBOARD_URL="https://railway.com/project/${{ vars.RAILWAY_PROJECT_ID }}?environmentId=${{ steps.railway_env.outputs.env_id }}"

          {
            echo "## PR Preview Environment"
            echo
            if [[ -n "$BACKEND_URL" ]]; then
              echo "- Preview URL: $BACKEND_URL"
            else
              echo "- Preview URL: _Unavailable (service may still be provisioning or has no public domain)_"
            fi
            echo "- Railway Dashboard: $DASHBOARD_URL"
            echo "- If you want to sign in with Github on this preview URL, you need to add $BACKEND_URL/.auth/api/v1/auth/callback/github to list of callback URLs [here](https://github.com/organizations/ctxpipe-ai/settings/apps/ctxpipe-agent). Unfortunately, GitHub doesn't allow wildcard callback URLs or an API to do this automatically, so you need to add the exact URL."
            echo "- To test Linear OAuth, add $BACKEND_URL/api/v1/integrations/linear/callback to the Linear application's redirect URIs. Linear applications have one webhook URL, so a shared production application will not deliver incremental events to this preview; use a dedicated preview application if webhook testing is required."
          } > pr-deploy-comment.md

      - name: Find existing PR preview comment
        if: always()
        id: find-preview-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ needs.resolve_pr.outputs.pr_number }}
          comment-author: "github-actions[bot]"
          body-includes: "## PR Preview Environment"

      - name: Create or update PR preview comment
        if: always()
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ steps.find-preview-comment.outputs.comment-id }}
          issue-number: ${{ needs.resolve_pr.outputs.pr_number }}
          body-path: pr-deploy-comment.md
          edit-mode: replace

  cleanup_pr_environment:
    name: Cleanup Neon, Railway, and PR GHCR images
    if: |
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - name: Delete Neon branch
        run: |
          set -euo pipefail
          PROJECT_ID="${{ vars.NEON_PROJECT_ID }}"
          BRANCH_NAME="preview/pr-${{ github.event.number }}"
          API="https://console.neon.tech/api/v2"
          RESP=$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" \
            "${API}/projects/${PROJECT_ID}/branches")
          BID=$(echo "$RESP" | jq -r --arg n "$BRANCH_NAME" '.branches[]? | select(.name == $n) | .id' | head -1)
          if [[ -z "$BID" ]]; then
            echo "Neon branch not found (already deleted?): $BRANCH_NAME"
            exit 0
          fi
          curl -fsS -X DELETE -H "Authorization: Bearer ${NEON_API_KEY}" \
            "${API}/projects/${PROJECT_ID}/branches/${BID}"
          echo "Deleted Neon branch $BRANCH_NAME"

      - name: Install Railway CLI
        # @railway/cli postinstall fetches a GitHub release tarball; that often
        # socket-hangs (ECONNRESET) on hosted runners.
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 15
          command: npm install -g @railway/cli@4.35.2

      - name: Delete Railway environment
        # Railway API/CLI calls can be flaky; retry once before failing.
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: |
            set -euo pipefail
            railway link --project "${{ vars.RAILWAY_PROJECT_ID }}" --environment production
            railway environment delete "pr-${{ github.event.number }}" --yes || echo "Railway environment delete skipped or already removed"

      # Requires packages:write (workflow) and Admin on each GHCR package → Manage Actions access for this repo.
      - name: Delete PR-tagged GHCR images
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ctxpipe-ai
          packages: backend,worker,ui,codesearch,otel-collector
          delete-tags: '^pr-${{ github.event.number }}-'
          use-regex: true
