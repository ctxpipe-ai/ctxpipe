name: Visual critic bake-off

# The bake-off of the visual critic (CTX-1202): each arm (a judge with its
# settings) judges each case of packages/visual-review/evals/critic/cases.json,
# and the job writes the report (packages/visual-review/evals/critic/README.md).
# With `panel`, the job runs the judge panel (CTX-1249) instead: it labels the
# cases, and the artifact holds the new cases.json to commit. With
# `calibration`, the arms judge the owner calibration set (CTX-1269) instead,
# and the report counts the owner issues that each arm flags. A model call
# costs money, so the workflow runs only by hand. Two limits keep the spend
# below the budget of $100: the runner starts no paid call when the known
# cost reaches max_cost, and the model key of the workbench environment has
# its own spend cap.
on:
  workflow_dispatch:
    inputs:
      panel:
        description: "Run the judge panel, not the bake-off. The panel uses panel_models only, and its own spend cap of $40."
        required: false
        type: boolean
        default: false
      calibration:
        description: "Judge the owner calibration set (owner-calibration.json) with the arms, not the bake-off cases. Arms: jev, decision:<model> or llm:<model>."
        required: false
        type: boolean
        default: false
      panel_models:
        description: "The judge panel, comma-separated. Empty: the default panel of panel.ts (see the README)."
        required: false
        type: string
        default: ""
      arms:
        description: "The arms, comma-separated (see the README)."
        required: false
        type: string
        default: "llm:anthropic/claude-opus-5.5,llm:anthropic/claude-sonnet-5.5,llm:anthropic/claude-haiku-5.5,llm:google/gemini-4-argon,llm:google/gemini-3.8-flash,llm:openai/gpt-6.1-sol,llm:qwen/qwen3.8-flash,llm-no-facts:anthropic/claude-opus-5.5,llm-no-facts:anthropic/claude-sonnet-5.5,llm-no-facts:anthropic/claude-haiku-5.5,llm-no-facts:google/gemini-4-argon,llm-no-facts:google/gemini-3.8-flash,llm-no-facts:openai/gpt-6.1-sol,llm-no-facts:qwen/qwen3.8-flash,llm-one-step:anthropic/claude-opus-5.5,llm-one-step:anthropic/claude-sonnet-5.5,llm-one-step:anthropic/claude-haiku-5.5,llm-one-step:google/gemini-4-argon,llm-one-step:google/gemini-3.8-flash,llm-one-step:openai/gpt-6.1-sol,llm-one-step:qwen/qwen3.8-flash,jev,decision:baseten/elephant-1,decision:baseten/mammoth-1,cascade:anthropic/claude-sonnet-5.5,cascade:baseten/elephant-1+anthropic/claude-sonnet-5.5,cascade:baseten/mammoth-1+anthropic/claude-sonnet-5.5,blazediff-local"
      runs:
        description: "The runs of each arm on each case."
        required: false
        type: string
        default: "3"
      max_cost:
        description: "The spend cap of the run in USD. Calls that already started finish after the cap, so keep a margin below the $100 limit of the key."
        required: false
        type: string
        default: "90"
      hold_out_only:
        description: "Run only the cases of the hold-out set."
        required: false
        type: boolean
        default: false
      skip_hold_out:
        description: "Run only the cases that are not in the hold-out set (to tune a judge)."
        required: false
        type: boolean
        default: false
      cases:
        description: "The case manifest of the bake-off, from the repository root. Empty: cases.json. The redesign set is packages/visual-review/evals/critic/redesign.json."
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Bake-off
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 360
    # The model key is a secret of the workbench environment: the
    # spend-capped key of the bake-off. This job runs pnpm install and npm
    # install, so it must never get the production key.
    environment: workbench
    env:
      MODEL_PROVIDER_URL: ${{ vars.MODEL_PROVIDER_URL }}
    steps:
      - name: Check the workbench model key
        env:
          MODEL_PROVIDER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
        run: |
          [[ -n "$MODEL_PROVIDER_API_KEY" ]] || {
            echo "::error::MODEL_PROVIDER_API_KEY is missing. Add the spend-capped model key to the workbench environment (Settings > Environments)."
            exit 1
          }
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The local judge of BlazeDiff runs ONNX models (about 460 MB of
      # packages and the model weights), so it is not a dependency of the
      # repository. It goes into its own folder.
      - name: Install the local judge of BlazeDiff
        if: ${{ !inputs.panel && !inputs.calibration && contains(inputs.arms, 'blazediff-local') }}
        run: |
          npm install --prefix "$RUNNER_TEMP/blazediff-agent" --no-audit --no-fund \
            @blazediff/agent@0.13.2 @huggingface/transformers@4.3.2
      # The panel and the runner get the image of a case from the release
      # visual-bakeoff-images only when the case runs, and check it against
      # the SHA-256 of the manifest. The panel writes its votes into
      # cases.json. The artifact holds it, to commit in a pull request.
      - name: Run the judge panel
        if: ${{ inputs.panel }}
        env:
          MODEL_PROVIDER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
          PANEL_MODELS: ${{ inputs.panel_models }}
        run: |
          out="$RUNNER_TEMP/visual-bakeoff-report"
          mkdir -p "$out"
          models=()
          if [[ -n "$PANEL_MODELS" ]]; then models+=(--models "$PANEL_MODELS"); fi
          status=0
          node packages/visual-review/evals/critic/panel.ts \
            "${models[@]}" \
            --images "$RUNNER_TEMP/visual-bakeoff-images" \
            > "$out/report.md" || status=$?
          cat "$out/report.md"
          # The votes so far, also after an image error.
          cp packages/visual-review/evals/critic/cases.json "$out/"
          exit "$status"
      - name: Run the owner calibration
        if: ${{ !inputs.panel && inputs.calibration }}
        env:
          MODEL_PROVIDER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
          ARMS: ${{ inputs.arms }}
          MAX_COST: ${{ inputs.max_cost }}
        run: |
          node packages/visual-review/evals/critic/calibration.ts \
            --arms "$ARMS" \
            --max-cost "$MAX_COST" \
            --images "$RUNNER_TEMP/visual-bakeoff-images" \
            --out "$RUNNER_TEMP/visual-bakeoff-report"
      - name: Run the bake-off
        if: ${{ !inputs.panel && !inputs.calibration }}
        env:
          MODEL_PROVIDER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
          ARMS: ${{ inputs.arms }}
          RUNS: ${{ inputs.runs }}
          MAX_COST: ${{ inputs.max_cost }}
          HOLD_OUT_ONLY: ${{ inputs.hold_out_only }}
          CASES: ${{ inputs.cases }}
          SKIP_HOLD_OUT: ${{ inputs.skip_hold_out }}
        run: |
          extra=()
          if [[ "$HOLD_OUT_ONLY" == true ]]; then extra+=(--hold-out-only); fi
          if [[ -n "$CASES" ]]; then extra+=(--cases "$CASES"); fi
          if [[ "$SKIP_HOLD_OUT" == true ]]; then extra+=(--skip-hold-out); fi
          pnpm visual:bakeoff:run \
            --arms "$ARMS" \
            --runs "$RUNS" \
            --max-cost "$MAX_COST" \
            --max-minutes 300 \
            "${extra[@]}" \
            --images "$RUNNER_TEMP/visual-bakeoff-images" \
            --out "$RUNNER_TEMP/visual-bakeoff-report" \
            --blazediff-agent "$RUNNER_TEMP/blazediff-agent"
      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/visual-bakeoff-report/report.md" ]; then
            cat "$RUNNER_TEMP/visual-bakeoff-report/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-bakeoff-report
          path: ${{ runner.temp }}/visual-bakeoff-report/
          if-no-files-found: ignore
