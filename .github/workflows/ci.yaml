name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Cloud Agent pushes sometimes skip pull_request synchronize. Keep push so
  # those commits still get CI. Jobs XOR: agents run on push only; everyone
  # else on pull_request only. Do not rely on concurrency to hide the twin.
  # branches must be listed (not only tags-ignore) or GitHub skips branch pushes.
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Cloud Agent (`cursor[bot]` / `cursoragent`): push only.
# Humans: pull_request only.
jobs:
  lint:
    name: Biome
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Reject skipped proof and owned mocks
        run: node scripts/ci/check-test-policy.mjs
      - name: CI command regression tests
        run: node --test scripts/tests/ci-*.test.mjs

  typecheck:
    name: Typecheck
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full projects with shrinking diagnostic allowances
        run: pnpm typecheck

  test:
    name: Tests
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same pgvector image as the migrate job so default-suite persist tests
        # hit the live unique index instead of a dummy DATABASE_URL.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: ctxpipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d ctxpipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      falkordb:
        image: falkordb/falkordb@sha256:52b6583afe7b5ba6bbf5b5f0290bdaa765bd97477b310a590771dc33ebc7b5f5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Required chat engine binary
        run: npm install --global opencode-ai@1.18.18
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache: false
      - name: Required native revision index tools
        run: |
          npm install --global @ast-grep/cli@0.45.0
          mkdir -p "$RUNNER_TEMP/ctxpipe-zoekt"
          # proxy.golang.org occasionally resets the zoekt zip mid-download.
          for tool in zoekt-index zoekt-webserver; do
            n=0
            until GOBIN="$RUNNER_TEMP/ctxpipe-zoekt" go install \
              "github.com/sourcegraph/zoekt/cmd/${tool}@596c362fcf1388fe0082acfcfc80c4d172efb7c1"
            do
              n=$((n + 1))
              [ "$n" -lt 4 ] || exit 1
              sleep $((n * 4))
            done
          done
          echo "$RUNNER_TEMP/ctxpipe-zoekt" >> "$GITHUB_PATH"
      - name: Migrate backend schema
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/ctxpipe
          DATABASE_APP_PASSWORD: ctxpipe
        working-directory: apps/backend
        run: |
          pnpm exec drizzle-kit migrate
          pnpm exec tsx src/db/migrate-openworkflow.ts
          pnpm exec tsx src/db/migrate-checkpoints.ts
          pnpm exec tsx src/db/provision-app-role-cli.ts
      - name: Backend tests
        env:
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
        run: pnpm --filter @ctxpipe/backend test
      - name: Required native sandbox quota runner
        run: |
          docker build -t ctxpipe-sandbox-runner:ci scripts/sandbox-runner
          node scripts/ci/start-sandbox-quota-runner.mjs
      - name: Required deterministic contracts
        env:
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
        run: pnpm test:contracts
      - name: Remove native sandbox quota runner
        if: always() && env.CTXPIPE_TEST_QUOTA_RUNNER_ID != ''
        run: docker rm -fv "$CTXPIPE_TEST_QUOTA_RUNNER_ID"
      - name: UI tests
        run: pnpm --filter @ctxpipe/ui test
      - name: CLI tests
        run: node scripts/ci/test-suite.mjs cli
      - name: CDK tests
        run: node scripts/ci/test-suite.mjs aws-cdk
      - name: Preserve executed test inventories and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-test-results
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error

  production-builds:
    timeout-minutes: 30
    name: Production build (${{ matrix.name }})
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: apps/backend/Dockerfile
          - name: worker
            dockerfile: apps/backend/Dockerfile.worker
          - name: ui
            dockerfile: apps/ui/Dockerfile
          - name: codesearch
            dockerfile: apps/codesearch/Dockerfile
          - name: docs
            dockerfile: apps/docs/Dockerfile
          - name: otel-collector
            dockerfile: apps/otel-collector/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - run: docker build --progress=plain -f '${{ matrix.dockerfile }}' .

  packages:
    name: Runnable packages and examples
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ctxpipe/backend build
      - run: pnpm --filter @ctxpipe/codesearch build
      - run: pnpm --filter @ctxpipe/aws-cdk build
      - run: pnpm --filter ctxpipe build
      - run: pnpm --filter @ctxpipe/aws-cdk-self-host typecheck

  storybook-golden:
    timeout-minutes: 30
    name: Storybook Playwright golden journey
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Storybook Playwright
        working-directory: apps/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Required Storybook golden plays
        run: node scripts/ci/storybook-golden.mjs
      - name: Preserve golden play results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-golden-results
          path: .ci-results/storybook-golden/
          include-hidden-files: true
          if-no-files-found: error

  codesearch:
    timeout-minutes: 30
    name: Codesearch real toolchain contracts
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm --filter @ctxpipe/codesearch test

  terraform-validate:
    name: Terraform configuration
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
      - name: Validate without remote state or account credentials
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

  migrate:
    name: Migrations (fresh and previous schema)
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches local Compose (pgvector); plain postgres:16 lacks the vector extension.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations from empty and from main
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/postgres
          MIGRATE_BASE_REF: origin/main
        run: bash scripts/ci-migrate.sh
      - name: Isolation tests as ctxpipe_app
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/ctxpipe_migrate_fresh
          DATABASE_APP_PASSWORD: ctxpipe
        working-directory: apps/backend
        run: |
          pnpm exec tsx src/db/provision-app-role-cli.ts
          DATABASE_URL=postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe_migrate_fresh \
            pnpm exec vitest run src/db/rls-isolation.test.ts
