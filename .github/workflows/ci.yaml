name: CI

on:
  workflow_dispatch:
  # A nightly run of the tests on main records the trace of main with
  # `--trace`. Only the jobs whose `if:` names `schedule`, and the jobs after
  # them, run on it. It is the safety net of the merge gate (ADR-062). It
  # stops at its first job (Nightly change) when main has no commit since the
  # last successful nightly run.
  schedule:
    - cron: "23 2 * * *"
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node on the arm64 runner stops at a 2 GB heap, so the Storybook build
  # jobs run out of memory without this.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # The first job of the nightly run: `run` is false when main has no commit
  # since the last successful nightly run (scripts/ci/nightly.mjs). Then no
  # other job of the run starts. Each job that runs on the schedule needs it.
  # On another event it does not run, and its output is empty.
  nightly-change:
    timeout-minutes: 5
    name: Nightly change
    if: github.event_name == 'schedule'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Compare main with the last successful nightly run
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/nightly.mjs changed

  lint:
    timeout-minutes: 15
    name: Lint and format
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The trace tests start a Bun child process.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm lint
      - run: pnpm format:check
      - name: Reject unused files, exports and dependencies
        run: pnpm knip
      - run: node scripts/ci/check-workflow-credentials.mjs
      - run: node scripts/ci/check-secret-jobs.mjs
      - run: node scripts/ci/check-agent-harness.mjs
      - name: Fetch Gate 0 classification pin
        run: git fetch origin 7dfa6b93a5baedc3eb2c86dd1056662e89cace00 --no-tags
      - name: Reject skipped proof and owned mocks
        run: node scripts/ci/check-test-policy.mjs
      - name: Reject slow UI motion
        run: node scripts/ci/check-ui-motion.mjs
      - name: Reject racy Storybook play checks
        run: node scripts/ci/check-story-play-timing.mjs
      - name: Reject a route with no page story
        run: node scripts/ci/check-page-stories.mjs
      - name: Reject a Playwright image pin that differs from the lockfile
        run: node scripts/ci/check-visual-container.mjs
      - name: Reject non-Blacksmith runners
        run: node scripts/ci/check-runners.mjs
      - name: Reject outside values in run scripts and workflows without permissions
        run: node scripts/ci/check-workflow-inputs.mjs
      - name: Validate and install the Claude plugin
        run: node scripts/ci/check-claude-plugin.mjs
      - name: Reject dead docs links
        run: node scripts/ci/check-docs-links.mjs
      - name: Reject an ADR that the index omits
        run: node scripts/ci/check-adr.mjs . origin/main
      - name: Reject new single-use module-scope values
        run: node scripts/ci/check-module-scope-values.mjs .
      - name: Chat sandbox AgentCore shim tests
        run: node --test scripts/tests/chat-sandbox-agentcore-shim.test.mjs
      - name: CI command regression tests
        run: |
          node --test scripts/tests/ci-*.test.mjs
          node --test scripts/tests/railway-sync-variables.test.mjs

  typecheck:
    timeout-minutes: 30
    name: Typecheck
    # In gate mode it runs only when the plan selects a typecheck check
    # (scripts/checks/README.md, Merge gate). A push to main runs no check
    # (ADR-062): each night, the job Project check times runs every typecheck.
    needs: merge-gate-plan
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.typecheck != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `bun check` is the checker (scripts/ci/typecheck.mjs). The pinned Bun
      # version is the TypeScript 7 version that it matches.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The check runner runs each project with its diagnostic allowance and
      # writes one result record for each, for the merge gate. The output of
      # each project is in .ci-results/checks (the next step prints it).
      - name: Full projects with shrinking diagnostic allowances
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: |
          set -o pipefail
          mkdir -p .ci-results/typecheck
          pnpm -s checks:list |
            jq -r '.checks[] | select(.family == "typecheck") | .id' > "$RUNNER_TEMP/typecheck.txt"
          node scripts/checks/run.mjs "$RUNNER_TEMP/typecheck.txt" |
            tee .ci-results/typecheck/records.ndjson
      # The plan job gives the check ids of this job in plan.json, by the
      # artifact id of its upload (scripts/checks/README.md, Merge gate).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.merge-gate-plan.outputs.mode == 'gate' && needs.merge-gate-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.merge-gate-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/plan
      - name: Selected projects (merge gate)
        if: needs.merge-gate-plan.outputs.mode == 'gate'
        run: node scripts/checks/selected.mjs .ci-results/typecheck "$RUNNER_TEMP/plan/plan.json" typecheck
      - name: Typecheck output
        if: always()
        run: cat .ci-results/checks/*.log || true
      - name: Preserve the typecheck results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-typecheck
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore

  test-shards:
    # The runner's own limit (scripts/ci/test-suite.mjs) is 30 min for backend
    # and 45 min for contracts. The job limit adds 15 min for setup, so the
    # named runner timeout fires before the job is cancelled.
    timeout-minutes: ${{ matrix.lane != 'backend' && 60 || 45 }}
    # One shard runs its files in series in its own database, so a worker in
    # one shard cannot claim a run that a file in another shard opened.
    name: ${{ matrix.lane }} tests (shard ${{ matrix.shard }}/${{ matrix.count }})
    # The nightly run (schedule) also runs the tests, to record the trace of main.
    needs: [merge-gate-plan, nightly-change]
    if: |
      !cancelled() && needs.nightly-change.outputs.run != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.test-shards != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        # The full run: shard counts come from the measured file times in
        # scripts/ci/test-weights.json, about 200 s of backend test time and
        # 240 s of contract test time per shard. In gate mode the plan job
        # gives the shards of the selected checks (lane `selected`).
        include: >-
          ${{ fromJSON(needs.merge-gate-plan.outputs.test-shards || '[
          {"lane": "backend", "shard": 1, "count": 4},
          {"lane": "backend", "shard": 2, "count": 4},
          {"lane": "backend", "shard": 3, "count": 4},
          {"lane": "backend", "shard": 4, "count": 4},
          {"lane": "contracts", "shard": 1, "count": 5},
          {"lane": "contracts", "shard": 2, "count": 5},
          {"lane": "contracts", "shard": 3, "count": 5},
          {"lane": "contracts", "shard": 4, "count": 5},
          {"lane": "contracts", "shard": 5, "count": 5}
          ]') }}
    services:
      postgres:
        # Same pgvector image as the migrate job so default-suite persist tests
        # hit the live unique index instead of a dummy DATABASE_URL.
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: ctxpipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d ctxpipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/falkordb
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Required chat engine binary
        run: npm install --global opencode-ai@1.18.34
      # Test files start these images in parallel. A Docker Hub token request
      # can time out, so pull each image once here, with retries, before the
      # tests start.
      - name: Required test container images
        if: matrix.lane != 'backend'
        run: |
          for image in $(jq -r '.contracts[] | "\(.image):\(.tag)@\(.digest)"' scripts/ci/service-pins.json); do
            n=0
            until docker pull --quiet "$image"; do
              n=$((n + 1))
              if [ "$n" -ge 4 ]; then
                echo "::error::Outside service unavailable: Docker Hub did not serve $image after 4 attempts"
                exit 1
              fi
              sleep $((n * 10))
            done
          done
      - name: Restore native revision index tools
        id: zoekt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ctxpipe-zoekt
          key: zoekt-both-${{ runner.os }}-${{ runner.arch }}-go1.25.12-596c362fcf1388fe0082acfcfc80c4d172efb7c1-v2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.zoekt.outputs.cache-hit != 'true'
        with:
          go-version: 1.25.12
          cache: false
      - name: Required native revision index tools
        run: |
          npm install --global @ast-grep/cli@0.45.0
          if [ ! -x "$RUNNER_TEMP/ctxpipe-zoekt/zoekt-webserver" ] || [ ! -x "$RUNNER_TEMP/ctxpipe-zoekt/zoekt-index" ]; then
            mkdir -p "$RUNNER_TEMP/ctxpipe-zoekt"
            # proxy.golang.org occasionally resets the zoekt zip mid-download.
            for tool in zoekt-index zoekt-webserver; do
              n=0
              until GOBIN="$RUNNER_TEMP/ctxpipe-zoekt" go install \
                "github.com/sourcegraph/zoekt/cmd/${tool}@596c362fcf1388fe0082acfcfc80c4d172efb7c1"
              do
                n=$((n + 1))
                [ "$n" -lt 4 ] || exit 1
                sleep $((n * 4))
              done
            done
          fi
          echo "$RUNNER_TEMP/ctxpipe-zoekt" >> "$GITHUB_PATH"
      - name: Migrate backend schema
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/ctxpipe
          DATABASE_APP_PASSWORD: ctxpipe
        working-directory: apps/backend
        run: |
          pnpm exec tsx src/db/migrate.ts
      - uses: ./.github/actions/setup-buildx
      # This job reads the layer cache without a login. The layer-cache job
      # writes it (see the comment there).
      - name: Required chat sandbox image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: scripts/chat-sandbox
          tags: ctxpipe-chat-sandbox:opencode-1.18.34-r4
          load: true
          cache-from: type=registry,ref=ghcr.io/ctxpipe-ai/ci-cache:chat-sandbox-arm64
      - name: Required ${{ matrix.lane }} tests
        if: matrix.lane != 'selected'
        env:
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
          EVENT: ${{ github.event_name }}
        # The trace (scripts/checks/README.md) is data only; PR runs skip it.
        run: |
          node scripts/ci/test-suite.mjs ${{ matrix.lane }} --shard=${{ matrix.shard }}/${{ matrix.count }} \
            $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      # The plan job gives the check ids of this job in plan.json, by the
      # artifact id of its upload (scripts/checks/README.md, Merge gate).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.lane == 'selected' && needs.merge-gate-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.merge-gate-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/plan
      # The nightly run of main traces the checks of its plan.
      - name: Selected tests (merge gate)
        if: matrix.lane == 'selected'
        env:
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
          SHARD: ${{ matrix.shard }}
          TRACE: ${{ github.event_name != 'pull_request' && '.ci-results/selected' || '' }}
        run: node scripts/checks/selected.mjs .ci-results/selected "$RUNNER_TEMP/plan/plan.json" test-shards "$SHARD"
      - name: FalkorDB diagnostics
        if: failure()
        continue-on-error: true
        run: |
          # Record the thread stacks only when the server does not answer.
          # The action already did this if FalkorDB never became healthy.
          if timeout 5 docker exec falkordb redis-cli PING; then
            echo "FalkorDB answers"
          else
            bash .github/actions/falkordb/diagnose.sh
          fi
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      - name: Run the failed checks again
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 20
        env:
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
        run: node scripts/checks/rerun-failed.mjs .ci-results
      - name: Preserve shard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.lane }}-${{ matrix.shard }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error

  package-tests:
    timeout-minutes: 30
    name: UI, CLI and CDK tests
    # The nightly run (schedule) also runs the tests, to record the trace of main.
    needs: [merge-gate-plan, nightly-change]
    if: |
      !cancelled() && needs.nightly-change.outputs.run != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.package-tests != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    env:
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: UI tests
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: node scripts/ci/test-suite.mjs ui $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      - name: CLI tests
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: node scripts/ci/test-suite.mjs cli $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      - name: CDK tests
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: node scripts/ci/test-suite.mjs aws-cdk $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      - name: Visual review tests
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: node scripts/ci/test-suite.mjs visual-review $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      # The plan job gives the check ids of this job in plan.json, by the
      # artifact id of its upload (scripts/checks/README.md, Merge gate).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.merge-gate-plan.outputs.mode == 'gate' && needs.merge-gate-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.merge-gate-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/plan
      # The nightly run of main traces the checks of its plan.
      - name: Selected UI, CLI and CDK tests (merge gate)
        if: needs.merge-gate-plan.outputs.mode == 'gate'
        env:
          TRACE: ${{ github.event_name != 'pull_request' && '.ci-results/selected' || '' }}
        run: node scripts/checks/selected.mjs .ci-results/selected "$RUNNER_TEMP/plan/plan.json" package-tests
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      - name: Run the failed checks again
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/checks/rerun-failed.mjs .ci-results
      - name: Preserve package test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-packages
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error

  test:
    timeout-minutes: 10
    # Keeps the single "Tests" check: it passes only when every shard and
    # package job passed and the shard union matches each full inventory.
    name: Tests
    # A gated run has no full inventory: the merge gate is its check.
    needs: [merge-gate-plan, nightly-change, test-shards, package-tests]
    if: |
      always() && needs.nightly-change.outputs.run != 'false' && (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request') &&
      needs.merge-gate-plan.outputs.mode != 'gate'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - name: Require every test job
        env:
          SHARDS: ${{ needs.test-shards.result }}
          PACKAGES: ${{ needs.package-tests.result }}
        run: |
          [ "$SHARDS" = success ] && [ "$PACKAGES" = success ] || {
            echo "Test shards: $SHARDS; package tests: $PACKAGES"
            exit 1
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-results-*
          path: .ci-results/
          merge-multiple: true
      - name: Check the union of the backend shards
        run: node scripts/ci/test-suite.mjs backend --merge
      - name: Check the union of the contract shards
        run: node scripts/ci/test-suite.mjs contracts --merge
      - name: Preserve executed test inventories and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-test-results
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error

  # One trace of a traced run, named by its commit, for `factory check`
  # (scripts/checks/README.md). It is data only, so this job is not required
  # and a failure here fails no check.
  trace:
    timeout-minutes: 10
    name: Trace
    needs:
      [
        test-shards,
        package-tests,
        codesearch,
        storybook-plays,
        storybook-visual,
        upgrade-from-previous-release,
        project-checks,
        nightly-change,
        nightly-plan,
      ]
    if: |
      always() && needs.nightly-change.outputs.run != 'false' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      # One folder for each artifact: the shards of a planned run each write
      # .ci-results/selected/trace.json.gz.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-results-*
          path: .ci-results/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lane-trace-*
          path: .ci-results/trace-parts/
      - name: Merge the traces
        run: |
          find .ci-results -name trace.json.gz -print0 | sort -z |
            xargs -0 node scripts/checks/trace.mjs merge "$RUNNER_TEMP/partial.json.gz"
      # The trace of main: the records of this run, and the records of the
      # previous trace that the nightly plan keeps (factory trace combine).
      # Without a nightly plan (a run by hand off main), it is this run's
      # trace. The selector release comes from the nightly plan, checked
      # against the pin again.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.nightly-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.nightly-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/nightly
      - name: Combine with the previous trace
        env:
          PLANNED: ${{ needs.nightly-plan.outputs.artifact-id != '' }}
        run: |
          if [ "$PLANNED" != true ]; then
            cp "$RUNNER_TEMP/partial.json.gz" "$RUNNER_TEMP/trace.json.gz"
            exit 0
          fi
          sha256="$(jq -er .factory.sha256 .github/merge-gate.json)"
          echo "$sha256  $RUNNER_TEMP/nightly/factory.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/nightly/factory.tar.gz" -C "$RUNNER_TEMP/bin" factory
          previous=()
          if [ -f "$RUNNER_TEMP/nightly/previous.json.gz" ]; then
            previous=(--previous "$RUNNER_TEMP/nightly/previous.json.gz")
          fi
          "$RUNNER_TEMP/bin/factory" trace combine --plan "$RUNNER_TEMP/nightly/plan.json" \
            "${previous[@]}" --partial "$RUNNER_TEMP/partial.json.gz" \
            --out "$RUNNER_TEMP/trace.json.gz" | tee "$RUNNER_TEMP/combine.txt"
          {
            echo "## Trace"
            echo
            echo '```'
            cat "$RUNNER_TEMP/combine.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the trace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-${{ github.sha }}
          path: ${{ runner.temp }}/trace.json.gz
          if-no-files-found: error

  # The time of each project check (typecheck, lint, policy) for the trace
  # (scripts/checks/README.md). The lint and typecheck jobs gate the change;
  # this job is data only and runs only on a traced run. An incremental
  # nightly run runs only the project checks of its plan.
  project-checks:
    timeout-minutes: 45
    name: Project check times
    needs: [nightly-change, merge-gate-plan]
    if: |
      !cancelled() && needs.nightly-change.outputs.run != 'false' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.project-checks != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The typecheck checks run `bun check`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.merge-gate-plan.outputs.mode == 'gate' && needs.merge-gate-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.merge-gate-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/plan
      - name: Project checks through the check runner
        env:
          MODE: ${{ needs.merge-gate-plan.outputs.mode }}
        run: |
          set -o pipefail
          if [ "$MODE" != gate ]; then
            # A check with cacheable false reads outside state (Docker) that
            # this job lacks, and its time is not the job's purpose.
            pnpm -s checks:list |
              jq -r '.checks[] | select((.family == "typecheck" or .family == "lint" or .family == "policy") and .cacheable != false) | .id' \
              > "$RUNNER_TEMP/project-checks.txt"
          else
            jq -r '.jobs["project-checks"].ids[]' "$RUNNER_TEMP/plan/plan.json" > "$RUNNER_TEMP/project-checks.txt"
          fi
          mkdir -p "$RUNNER_TEMP/project-trace"
          # The result records also go to the Results writer.
          node scripts/checks/run.mjs --trace "$RUNNER_TEMP/project-trace" "$RUNNER_TEMP/project-checks.txt" |
            tee "$RUNNER_TEMP/project-trace/records.ndjson"
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      - name: Run the failed checks again
        if: failure()
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/checks/rerun-failed.mjs "$RUNNER_TEMP/project-trace"
      - name: Preserve the project check trace and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-trace-projects
          path: |
            ${{ runner.temp }}/project-trace/trace.json.gz
            ${{ runner.temp }}/project-trace/records.ndjson
            ${{ runner.temp }}/project-trace/rerun/
          if-no-files-found: ignore

  production-builds:
    timeout-minutes: 45
    name: Production build (${{ matrix.name }})
    # In gate mode it builds only the selected images. A person asks for
    # every build with Run workflow (workflow_dispatch) on the PR branch.
    # A full nightly run (by hand, or each 7 days) builds every image: it is
    # the safety net of the gate. An image build has no cache key, so an
    # incremental nightly run does not build it (scripts/checks/README.md,
    # Traces).
    needs: [merge-gate-plan, nightly-change]
    if: |
      !cancelled() && needs.nightly-change.outputs.run != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.production-builds != '')
    # The images build for linux/arm64, the platform of the AWS hosts
    # (Graviton). deploy.yaml publishes each image for amd64 and arm64.
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        # Each entry is the check `build:image-<name>:` of the manifest
        # (scripts/checks/projects.mjs). The merge gate takes the result of
        # the job `Production build (<name>)` as the check result, so this
        # job needs no workspace install. In gate mode the plan job gives the
        # entries of the selected images (plan.mjs keeps the same options).
        include: >-
          ${{ fromJSON(needs.merge-gate-plan.outputs.production-builds || '[
          {"name": "backend", "dockerfile": "apps/backend/Dockerfile"},
          {"name": "worker", "dockerfile": "apps/backend/Dockerfile.worker"},
          {"name": "ui", "dockerfile": "apps/ui/Dockerfile"},
          {"name": "codesearch", "dockerfile": "apps/codesearch/Dockerfile"},
          {"name": "docs", "dockerfile": "apps/docs/Dockerfile"},
          {"name": "chat-sandbox", "dockerfile": "scripts/chat-sandbox/Dockerfile",
          "context": "scripts/chat-sandbox"}
          ]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-buildx
      # Only codesearch reads a layer cache: its toolchain stages are the slow
      # part. This job reads it without a login. The layer-cache job writes it
      # (see the comment there).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: ${{ matrix.name == 'codesearch' && 'type=registry,ref=ghcr.io/ctxpipe-ai/ci-cache:production-codesearch' || '' }}

  # Writes the Docker layer caches that test-shards (chat sandbox) and
  # production-builds (codesearch) read.
  # - The cache is in GHCR, not in the GHA cache. The GHA cache evicts layer
  #   blobs while their manifest stays, and BuildKit then fails the build with
  #   "BlobNotFound". GHCR keeps each blob until someone deletes its version.
  # - Do not delete versions of ghcr.io/ctxpipe-ai/ci-cache that are newer than
  #   one day: an import fails when a blob under a live manifest is missing.
  # - The package is public, so each reader imports it without a login, and a
  #   job that runs dependency code holds no token that can write packages.
  # - All branches share one tag. Thus only main writes it: a push to main
  #   (merged, reviewed code) or a dispatch on main. Other branches only read.
  # - This job runs no repository code on the runner: the checkout has no
  #   credentials, and each action is pinned to a commit. The BuildKit image
  #   that setup-buildx pulls is not pinned. BuildKit runs the Dockerfile
  #   steps in containers that do not see the registry login.
  # - The cache is best effort: an export error or a failed job is a miss on
  #   the next run, not a failure.
  layer-cache:
    timeout-minutes: 45
    name: Layer cache (${{ matrix.name }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    # The caches are for linux/arm64, the platform of the jobs that read them.
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chat-sandbox
            context: scripts/chat-sandbox
            dockerfile: scripts/chat-sandbox/Dockerfile
            cache: ghcr.io/ctxpipe-ai/ci-cache:chat-sandbox-arm64
          - name: codesearch
            context: .
            dockerfile: apps/codesearch/Dockerfile
            cache: ghcr.io/ctxpipe-ai/ci-cache:production-codesearch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=registry,ref=${{ matrix.cache }}
          cache-to: type=registry,ref=${{ matrix.cache }},mode=max,ignore-error=true

  packages:
    timeout-minutes: 20
    name: Runnable packages and examples
    # The nightly run (schedule) builds every package: it is the safety net
    # of the gate.
    needs: [merge-gate-plan, nightly-change]
    if: |
      !cancelled() && needs.nightly-change.outputs.run != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.packages != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      # Each package build is one check of the manifest. The record goes to
      # the merge gate.
      - name: Build the packages through the check runner
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: |
          set -o pipefail
          mkdir -p .ci-results/build-packages
          pnpm -s checks:list |
            jq -r '.checks[] | select(.family == "build" and (.lane | startswith("package-"))) | .id' |
            pnpm -s checks:run | tee .ci-results/build-packages/records.ndjson
      - name: Show the build log
        if: failure()
        run: cat .ci-results/checks/*.log
      - run: pnpm --filter @ctxpipe/aws-cdk-self-host typecheck
        if: needs.merge-gate-plan.outputs.mode != 'gate'
      # The plan job gives the check ids of this job in plan.json, by the
      # artifact id of its upload (scripts/checks/README.md, Merge gate).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.merge-gate-plan.outputs.mode == 'gate' && needs.merge-gate-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.merge-gate-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/plan
      - name: Selected builds (merge gate)
        if: needs.merge-gate-plan.outputs.mode == 'gate'
        run: node scripts/checks/selected.mjs .ci-results/build-packages "$RUNNER_TEMP/plan/plan.json" packages
      - name: Preserve the build results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-build-packages
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore

  storybook-build:
    timeout-minutes: 20
    name: Storybook build
    needs: [merge-gate-plan, nightly-change]
    # The nightly run (schedule) also plays the stories, to record the trace.
    # It also renders the stories without a play function, and records each
    # story under the id of its screenshot check (storybook-plays.mjs).
    if: |
      !cancelled() && needs.nightly-change.outputs.run != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.storybook-build != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ctxpipe/ui build-storybook
      - name: Preserve the Storybook build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-static
          path: apps/ui/storybook-static
          if-no-files-found: error

  storybook-required:
    timeout-minutes: 30
    name: Storybook required plays
    # In gate mode the Storybook plays shards run each selected story, the
    # required ones too.
    needs: [merge-gate-plan, storybook-build]
    if: |
      !cancelled() && needs.storybook-build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request') &&
      needs.merge-gate-plan.outputs.mode != 'gate'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Storybook Playwright
        working-directory: apps/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Download the Storybook build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-static
          path: apps/ui/storybook-static
      - name: Required Storybook plays
        env:
          SKIP_STORYBOOK_BUILD: "1"
        run: node scripts/ci/storybook-plays.mjs
      - name: Preserve required play results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-required-results
          path: .ci-results/storybook-required/
          include-hidden-files: true
          if-no-files-found: error

  storybook-plays:
    timeout-minutes: 45
    name: Storybook Playwright all plays (${{ matrix.shard }}/${{ matrix.count }})
    needs: [merge-gate-plan, storybook-build]
    # The nightly run (schedule) also plays the stories, to record the trace.
    # It also renders the stories without a play function, and records each
    # story under the id of its screenshot check (storybook-plays.mjs).
    if: |
      !cancelled() && needs.storybook-build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.storybook-plays != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    # The id of the result artifact of each shard: the job Nightly tickets
    # downloads only these, not an artifact of another job with the same name.
    outputs:
      artifact-1: ${{ steps.artifact.outputs.artifact-1 }}
      artifact-2: ${{ steps.artifact.outputs.artifact-2 }}
      artifact-3: ${{ steps.artifact.outputs.artifact-3 }}
      artifact-4: ${{ steps.artifact.outputs.artifact-4 }}
    strategy:
      fail-fast: false
      matrix:
        # In gate mode the plan job gives the shards of the selected stories.
        include: >-
          ${{ fromJSON(needs.merge-gate-plan.outputs.storybook-plays || '[
          {"shard": 1, "count": 4}, {"shard": 2, "count": 4},
          {"shard": 3, "count": 4}, {"shard": 4, "count": 4}
          ]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Storybook Playwright
        working-directory: apps/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Download the Storybook build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-static
          path: apps/ui/storybook-static
      - name: Every Storybook story with a play function
        if: matrix.lane != 'selected'
        env:
          SKIP_STORYBOOK_BUILD: "1"
          STORYBOOK_PLAYS: all
          STORYBOOK_SHARD: ${{ matrix.shard }}/${{ matrix.count }}
          EVENT: ${{ github.event_name }}
        # The trace (scripts/checks/README.md) is data only; PR runs skip it.
        run: |
          node scripts/ci/storybook-plays.mjs \
            $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      # The plan job gives the check ids of this job in plan.json, by the
      # artifact id of its upload (scripts/checks/README.md, Merge gate).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.lane == 'selected' && needs.merge-gate-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.merge-gate-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/plan
      - name: Selected stories (merge gate)
        if: matrix.lane == 'selected' && github.event_name == 'pull_request'
        env:
          SKIP_STORYBOOK_BUILD: "1"
          SHARD: ${{ matrix.shard }}
        run: node scripts/checks/selected.mjs .ci-results/storybook-plays "$RUNNER_TEMP/plan/plan.json" storybook-plays "$SHARD"
      # The nightly run of main renders the stories of its plan as the full
      # run does, with the trace: each story records its play and screenshot
      # check ids (scripts/checks/plan.mjs, nightlyPlan).
      - name: Planned stories (nightly)
        if: matrix.lane == 'selected' && github.event_name != 'pull_request'
        env:
          SKIP_STORYBOOK_BUILD: "1"
          STORYBOOK_PLAYS: all
          SHARD: ${{ matrix.shard }}
        run: |
          jq -r --arg shard "$SHARD" '.jobs["storybook-plays"][] | select((.shard | tostring) == $shard) | .plan.ids[]' \
            "$RUNNER_TEMP/plan/plan.json" > "$RUNNER_TEMP/story-ids.txt"
          STORYBOOK_IDS="$RUNNER_TEMP/story-ids.txt" node scripts/ci/storybook-plays.mjs --trace
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      - name: Run the failed checks again
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 20
        env:
          SKIP_STORYBOOK_BUILD: "1"
        run: node scripts/checks/rerun-failed.mjs .ci-results/storybook-plays
      - name: Preserve play results
        id: preserve
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-plays-results-${{ matrix.shard }}
          path: .ci-results/storybook-plays/
          include-hidden-files: true
          if-no-files-found: error
      - name: The artifact id of the shard
        id: artifact
        if: always() && github.event_name == 'schedule'
        env:
          SHARD: ${{ matrix.shard }}
          ID: ${{ steps.preserve.outputs.artifact-id }}
        run: echo "artifact-${SHARD}=${ID}" >> "$GITHUB_OUTPUT"
      - name: Preserve the Storybook trace
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-trace-storybook-${{ matrix.shard }}
          path: .ci-results/storybook-plays/trace.json.gz
          if-no-files-found: ignore

  # The visual checks (scripts/checks/README.md, Families): each story's
  # screenshots, captured in the pinned Playwright image and compared with
  # the committed baselines. A full run checks every story in 4 shards, and
  # its shard 1 also checks the orphan baselines and the total size
  # (pnpm visual:check --shard); a gated run checks the selected stories in
  # the shards of the plan. The nightly run is the full run of main: a push
  # to main runs no test job. A full run in one job took 30 minutes for
  # about 900 stories.
  storybook-visual:
    timeout-minutes: 45
    name: Storybook screenshots (${{ matrix.shard }}/${{ matrix.count }})
    needs: [merge-gate-plan, storybook-build]
    if: |
      !cancelled() && needs.storybook-build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.storybook-visual != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    # The id of the result artifact of each shard: the job Nightly tickets
    # downloads only these, not an artifact of another job with the same name.
    outputs:
      artifact-1: ${{ steps.artifact.outputs.artifact-1 }}
      artifact-2: ${{ steps.artifact.outputs.artifact-2 }}
      artifact-3: ${{ steps.artifact.outputs.artifact-3 }}
      artifact-4: ${{ steps.artifact.outputs.artifact-4 }}
    strategy:
      fail-fast: false
      matrix:
        # In gate mode the plan job gives the shards of the selected stories.
        include: >-
          ${{ fromJSON(needs.merge-gate-plan.outputs.storybook-visual || '[
          {"shard": 1, "count": 4}, {"shard": 2, "count": 4},
          {"shard": 3, "count": 4}, {"shard": 4, "count": 4}
          ]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download the Storybook build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-static
          path: apps/ui/storybook-static
      - name: Every story screenshot of the shard
        if: matrix.lane != 'selected'
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.count }}
        run: node scripts/ci/visual.mjs check --shard "$SHARD" --records .ci-results/storybook-visual
      # The plan job gives the check ids of this job in plan.json, by the
      # artifact id of its upload (scripts/checks/README.md, Merge gate).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.lane == 'selected' && needs.merge-gate-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.merge-gate-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/plan
      - name: Selected story screenshots (merge gate)
        if: matrix.lane == 'selected'
        env:
          SKIP_STORYBOOK_BUILD: "1"
          SHARD: ${{ matrix.shard }}
        run: node scripts/checks/selected.mjs .ci-results/storybook-visual "$RUNNER_TEMP/plan/plan.json" storybook-visual "$SHARD"
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      - name: Run the failed checks again
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 20
        env:
          SKIP_STORYBOOK_BUILD: "1"
        # The rerun writes .ci-results/visual again. The copy keeps the
        # manifest and the images of the first run: the nightly tickets link
        # the diff images of a flaky story, and the manifest names its
        # baselines.
        run: |
          if [ -d .ci-results/visual ]; then cp -R .ci-results/visual .ci-results/visual-first-run; fi
          node scripts/checks/rerun-failed.mjs .ci-results/storybook-visual
      # The records, the manifest and the images of each story that is not
      # unchanged (.ci-results/visual/<story id>/), one artifact for each
      # shard.
      - name: Preserve screenshot results
        id: preserve
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-storybook-visual-${{ matrix.shard }}
          path: |
            .ci-results/storybook-visual/
            .ci-results/visual/
            .ci-results/visual-first-run/
            .ci-results/checks/
          include-hidden-files: true
          if-no-files-found: error
      - name: The artifact id of the shard
        id: artifact
        if: always() && github.event_name == 'schedule'
        env:
          SHARD: ${{ matrix.shard }}
          ID: ${{ steps.preserve.outputs.artifact-id }}
        run: echo "artifact-${SHARD}=${ID}" >> "$GITHUB_OUTPUT"

  codesearch:
    timeout-minutes: 30
    name: Codesearch real toolchain contracts
    # The nightly run (schedule) also runs the tests, to record the trace of main.
    # In gate mode the whole job runs when the plan selects one of its checks:
    # one image build serves all of them.
    needs: [merge-gate-plan, nightly-change]
    if: |
      !cancelled() && needs.nightly-change.outputs.run != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.codesearch != '')
    # The test image builds for the platform of the runner. This job, the
    # contracts jobs and the Merge gate manifest job (which records the
    # container platform in the toolchain record) all run on arm64, so the
    # keys of the container lanes name the platform the tests ran on.
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      # The download script must fail fast when its source stalls.
      - name: Download script timeout proof
        run: node --test apps/codesearch/scripts/fetch-releases.test.mjs
      - name: Restore pinned release files
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .release-cache
          key: codesearch-releases-${{ runner.arch }}-${{ hashFiles('apps/codesearch/release-assets.txt') }}
      # Fills the cache with checksum-verified files. When GitHub stays down,
      # this step fails in minutes with "Outside service unavailable".
      - name: Download pinned release files
        timeout-minutes: 10
        env:
          TARGETARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        run: bash apps/codesearch/scripts/fetch-releases.sh apps/codesearch/release-assets.txt "$RUNNER_TEMP/releases" .release-cache
      # The plan job gives the check ids of this job in plan.json, by the
      # artifact id of its upload (scripts/checks/README.md, Merge gate).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name != 'pull_request' && needs.merge-gate-plan.outputs.mode == 'gate' && needs.merge-gate-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.merge-gate-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/plan
      # The trace (scripts/checks/README.md) is data only; PR runs skip it.
      # The result records go to the merge gate and the Results writer. A
      # gated PR run runs both whole lanes (one image build serves all of
      # them); an incremental nightly run runs only the files of its plan.
      - name: Required codesearch tests
        env:
          EVENT: ${{ github.event_name }}
        run: |
          files=()
          if [ -f "$RUNNER_TEMP/plan/plan.json" ]; then
            while IFS= read -r id; do
              case "$id" in
                vitest:codesearch:apps/codesearch/*) files+=(--node "${id#vitest:codesearch:apps/codesearch/}") ;;
                vitest:codesearch-bun:apps/codesearch/*) files+=(--bun "${id#vitest:codesearch-bun:apps/codesearch/}") ;;
              esac
            done < <(jq -r '.jobs.codesearch.ids[]?' "$RUNNER_TEMP/plan/plan.json")
          fi
          bash apps/codesearch/scripts/run-vitest-docker.sh --records .ci-results/codesearch \
            $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace "$RUNNER_TEMP/codesearch-trace") \
            "${files[@]}"
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      # The runner lists the checks on the host, so it needs the packages.
      - name: Packages of the check runner
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: pnpm install --frozen-lockfile
      - name: Run the failed checks again
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/checks/rerun-failed.mjs .ci-results
      - name: Preserve the codesearch results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-codesearch
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Preserve the codesearch trace
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-trace-codesearch
          path: ${{ runner.temp }}/codesearch-trace/trace.json.gz
          if-no-files-found: ignore

  migrate:
    timeout-minutes: 20
    name: Migrations (fresh schema)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    services:
      postgres:
        # Matches local Compose (pgvector); plain postgres:16 lacks the vector extension.
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/postgres
        run: bash scripts/ci-migrate.sh
      - name: Isolation tests as ctxpipe_app
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/ctxpipe_migrate_fresh
          DATABASE_APP_PASSWORD: ctxpipe
        working-directory: apps/backend
        run: |
          # The one migrate entry point on a database that drizzle-kit migrated.
          pnpm exec tsx src/db/migrate.ts
          DATABASE_URL=postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe_migrate_fresh \
            pnpm exec vitest run src/db/rls-isolation.test.ts

  upgrade-from-previous-release:
    # The minor upgrade promise (CTX-748): a database of the previous release,
    # migrated and seeded by that release, upgrades with the one migrate entry
    # point; its Workspace upgrade waits for an admin and lands in one pull
    # request; and the code of the previous release still reads the database
    # after the upgrade (rollback).
    name: Upgrade from the previous release
    timeout-minutes: 15
    # The nightly run (schedule) also runs it, to record its time and trace.
    # In gate mode the whole job runs when the plan selects one of its checks.
    needs: [merge-gate-plan, nightly-change]
    if: |
      !cancelled() && needs.nightly-change.outputs.run != 'false' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request') &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.upgrade-from-previous-release != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/falkordb
      - run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Checkout of the previous release with its dependencies
        run: |
          # The release that operators run now, not main. Main holds the new
          # code. Move previousRelease.ref in scripts/ci/service-pins.json to
          # the newest release tag when the next release changes the upgrade
          # path.
          PREVIOUS_RELEASE_REF=$(jq -r .previousRelease.ref scripts/ci/service-pins.json)
          git worktree add --detach "$RUNNER_TEMP/previous-release" "$PREVIOUS_RELEASE_REF"
          cd "$RUNNER_TEMP/previous-release"
          pnpm install --frozen-lockfile --filter "@ctxpipe/backend..."
      - name: Restore native revision index tools
        id: zoekt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ctxpipe-zoekt
          key: zoekt-both-${{ runner.os }}-${{ runner.arch }}-go1.25.12-596c362fcf1388fe0082acfcfc80c4d172efb7c1-v2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.zoekt.outputs.cache-hit != 'true'
        with:
          go-version: 1.25.12
          cache: false
      - name: Required native revision index tools
        run: |
          npm install --global @ast-grep/cli@0.45.0
          if [ ! -x "$RUNNER_TEMP/ctxpipe-zoekt/zoekt-webserver" ] || [ ! -x "$RUNNER_TEMP/ctxpipe-zoekt/zoekt-index" ]; then
            mkdir -p "$RUNNER_TEMP/ctxpipe-zoekt"
            for tool in zoekt-index zoekt-webserver; do
              n=0
              until GOBIN="$RUNNER_TEMP/ctxpipe-zoekt" go install \
                "github.com/sourcegraph/zoekt/cmd/${tool}@596c362fcf1388fe0082acfcfc80c4d172efb7c1"
              do
                n=$((n + 1))
                [ "$n" -lt 4 ] || exit 1
                sleep $((n * 4))
              done
            done
          fi
          echo "$RUNNER_TEMP/ctxpipe-zoekt" >> "$GITHUB_PATH"
      - name: Upgrade a database of the previous release and Workspace, then read it with the previous release
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/postgres
          DATABASE_APP_PASSWORD: ctxpipe
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          EVENT: ${{ github.event_name }}
        # The check runner verifies the prerequisites, and writes the Vitest
        # output to .ci-results/checks/upgrade.log (the next step prints it).
        # The result records go to the merge gate and the Results writer.
        run: |
          set -o pipefail
          ids="$(node scripts/checks/list.mjs |
            jq -r '.checks[] | select(.family == "vitest" and .lane == "upgrade") | .id')"
          if [ -z "$ids" ]; then
            echo "::error::The check list has no check in the upgrade lane"
            exit 1
          fi
          mkdir -p .ci-results/upgrade
          printf '%s\n' "$ids" |
            RELEASE_TREE="$RUNNER_TEMP/previous-release" node scripts/checks/run.mjs \
              $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace "$RUNNER_TEMP/upgrade-trace") |
            tee .ci-results/upgrade/records.ndjson
      - name: Upgrade test output
        if: always()
        run: cat .ci-results/checks/upgrade.log || true
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      - name: Run the failed checks again
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 20
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/postgres
          DATABASE_APP_PASSWORD: ctxpipe
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          RELEASE_TREE: ${{ runner.temp }}/previous-release
        run: node scripts/checks/rerun-failed.mjs .ci-results
      - name: Preserve the upgrade results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-upgrade
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Preserve the upgrade trace
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-trace-upgrade
          path: ${{ runner.temp }}/upgrade-trace/trace.json.gz
          if-no-files-found: ignore
      - name: FalkorDB diagnostics
        if: failure()
        continue-on-error: true
        run: |
          # Record the thread stacks only when the server does not answer.
          # The action already did this if FalkorDB never became healthy.
          if timeout 5 docker exec falkordb redis-cli PING; then
            echo "FalkorDB answers"
          else
            bash .github/actions/falkordb/diagnose.sh
          fi

  # The merge gate (scripts/checks/README.md, Merge gate) in shadow mode: the
  # full run gates, and these jobs publish beside it what a gated run would
  # decide. They never fail or hold up a gating job: each one continues on
  # error, and no gating job needs them. .github/merge-gate.json pins the
  # selector and the mode.
  #
  # The manifest job holds no credential. It decides the mode with the public
  # rules (gate.mjs mode), and records the manifest and the toolchain for the
  # select job and for the nightly Results writer. It has the setup of the
  # test jobs (Node, pnpm, Bun) and sets none of the lane variables, so its
  # toolchain record is theirs.
  merge-gate-manifest:
    timeout-minutes: 10
    name: Merge gate manifest
    needs: nightly-change
    if: |
      !cancelled() && needs.nightly-change.outputs.run != 'false' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request')
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/merge-gate"
          : > "$RUNNER_TEMP/changed.txt"
          # A pull_request run checks out the merge revision; its first
          # parent is main.
          if [ "$EVENT" = pull_request ]; then
            git diff-tree -r --no-commit-id --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          fi
          node scripts/checks/gate.mjs mode --config .github/merge-gate.json \
            --event "$EVENT" --fork "$FORK" --changed "$RUNNER_TEMP/changed.txt" \
            > "$RUNNER_TEMP/merge-gate/mode.json"
          cat "$RUNNER_TEMP/merge-gate/mode.json"
          echo "mode=$(jq -r .mode "$RUNNER_TEMP/merge-gate/mode.json")" >> "$GITHUB_OUTPUT"
      - run: corepack enable
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
        with:
          bun-version: 1.4.4
      # The manifest needs only the root scripts and the packages that
      # scripts/checks/list.mjs loads: the root, and apps/ui for Storybook
      # (apps/ui/.storybook/check-modules.mjs). The listing is the same as
      # with the full install.
      - run: pnpm install --frozen-lockfile --filter @ctxpipe-dev/root --filter @ctxpipe/ui
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
      # The toolchain record holds the versions of the host programs that a
      # check declares (scripts/checks/toolchain.mjs), so this job installs the
      # same pinned zoekt and ast-grep as the upgrade job. Go reads the zoekt
      # module version. Go and ast-grep come from a pinned download that the
      # SHA-256 checks: setup-go takes about 5 s because it copies Go into the
      # tool cache, and `npm install` takes 1 s to 20 s. When the Go version
      # changes, change the URL, the hash, and the zoekt cache key. When the
      # runner architecture changes, change both URLs and both hashes.
      - name: Restore native revision index tools
        id: zoekt
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ctxpipe-zoekt
          key: zoekt-both-${{ runner.os }}-${{ runner.arch }}-go1.25.12-596c362fcf1388fe0082acfcfc80c4d172efb7c1-v2
      - name: Host programs of the checks
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/host-programs/go" "$RUNNER_TEMP/host-programs/bin"
          curl -fsSL -o "$RUNNER_TEMP/host-programs/go.tar.gz" https://go.dev/dl/go1.25.12.linux-arm64.tar.gz
          echo "8b5884aef89600aef5b0b051fb971f11f49bb996521e911f30f02a66884f7bd2  $RUNNER_TEMP/host-programs/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/host-programs/go.tar.gz" -C "$RUNNER_TEMP/host-programs/go"
          curl -fsSL -o "$RUNNER_TEMP/host-programs/ast-grep.zip" https://github.com/ast-grep/ast-grep/releases/download/0.45.0/app-aarch64-unknown-linux-gnu.zip
          echo "62b60892dafacfa76d6de87157659f880bbf85ff38bdab52db12f1f14ec60f94  $RUNNER_TEMP/host-programs/ast-grep.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/host-programs/ast-grep.zip" ast-grep -d "$RUNNER_TEMP/host-programs/bin"
          echo "$RUNNER_TEMP/host-programs/go/go/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/host-programs/bin" >> "$GITHUB_PATH"
          # GITHUB_PATH reaches the next steps only; `go install` below needs it now.
          export PATH="$RUNNER_TEMP/host-programs/go/go/bin:$PATH"
          # Install both binaries: the cache that this job saves is the one
          # the test jobs restore, and they need zoekt-index too.
          if [ ! -x "$RUNNER_TEMP/ctxpipe-zoekt/zoekt-webserver" ] || [ ! -x "$RUNNER_TEMP/ctxpipe-zoekt/zoekt-index" ]; then
            mkdir -p "$RUNNER_TEMP/ctxpipe-zoekt"
            for tool in zoekt-index zoekt-webserver; do
              n=0
              until GOBIN="$RUNNER_TEMP/ctxpipe-zoekt" go install \
                "github.com/sourcegraph/zoekt/cmd/${tool}@596c362fcf1388fe0082acfcfc80c4d172efb7c1"
              do
                n=$((n + 1))
                [ "$n" -lt 4 ] || exit 1
                sleep $((n * 4))
              done
            done
          fi
          echo "$RUNNER_TEMP/ctxpipe-zoekt" >> "$GITHUB_PATH"
      - name: Manifest and toolchain
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
        run: |
          pnpm -s checks:list > "$RUNNER_TEMP/merge-gate/manifest.json"
          node scripts/checks/toolchain.mjs "$RUNNER_TEMP/merge-gate/manifest.json" \
            > "$RUNNER_TEMP/merge-gate/toolchain.json"
      - name: Preserve the merge gate inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/merge-gate/
          if-no-files-found: ignore

  # Selects the checks of a same-repo PR and looks up their stored results.
  # It holds a read-only OIDC role of the factory account, which trusts only
  # the pull_request subject; a fork PR gets no OIDC token. It runs no package
  # manager, no local action and no repository script, and each action is
  # pinned by commit. It reads the manifest and the toolchain only as data.
  # It downloads the release that .github/merge-gate.json pins, and stops when
  # the SHA-256 differs.
  merge-gate-select:
    timeout-minutes: 5
    name: Merge gate selection
    needs: merge-gate-manifest
    # The Nightly change job before the manifest job is skipped on a PR. A job
    # whose condition has no status function then is skipped too, so the
    # condition starts with !cancelled().
    if: |
      !cancelled() &&
      needs.merge-gate-manifest.outputs.mode == 'select'
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      actions: read
      id-token: write
    # The id of the artifact that this job uploaded. Each reader downloads
    # the selection by this id, not by its name: a job that runs PR code can
    # upload an artifact with the same name.
    outputs:
      artifact-id: ${{ steps.preserve.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Each step writes out/select-cause.txt before a part that can fail, so
      # a failed job tells the decision why: the inputs, the role, the
      # download, the hash, the exit code of the selector, or a timeout.
      - name: Start the cause record
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "the inputs of the manifest job did not download" > "$RUNNER_TEMP/out/select-cause.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/inputs
      - name: Next cause
        run: echo "the read-only role of the result store was not assumed" > "$RUNNER_TEMP/out/select-cause.txt"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::134416647419:role/check-results-gate-reader
          aws-region: us-west-2
      - name: Selector release, checked against the pin
        run: |
          cause="$RUNNER_TEMP/out/select-cause.txt"
          version="$(jq -er .factory.version .github/merge-gate.json)"
          sha256="$(jq -er .factory.sha256 .github/merge-gate.json)"
          echo "the download of the selector release $version failed" > "$cause"
          aws s3api get-object --bucket ctxpipe-factory-check-results-134416647419 \
            --expected-bucket-owner 134416647419 \
            --key "releases/factory/$version/factory-linux-arm64.tar.gz" \
            "$RUNNER_TEMP/factory.tar.gz" > /dev/null
          echo "the selector release does not match the pinned SHA-256" > "$cause"
          echo "$sha256  $RUNNER_TEMP/factory.tar.gz" | sha256sum --check --strict
          echo "the selector release did not unpack" > "$cause"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/factory.tar.gz" -C "$RUNNER_TEMP/bin" factory
      # The LLM job runs the same release with the model key; it gets the
      # release from this job, because only this job holds the role.
      - name: Keep the selector release for the LLM job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-release
          path: ${{ runner.temp }}/factory.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Select and look up the cache (variant B, k = 3, no model step)
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          out="$RUNNER_TEMP/out"
          echo "the selector did not finish in 3 minutes" > "$out/select-cause.txt"
          # The newest nightly trace of main. Without one, the selector uses
          # variant A and says so in a note.
          "$RUNNER_TEMP/bin/factory" trace fetch --repo . || echo "No trace: variant A"
          code=0
          "$RUNNER_TEMP/bin/factory" check --repo . --base HEAD^1 --k 3 \
            --manifest "$RUNNER_TEMP/inputs/manifest.json" \
            --toolchain "$RUNNER_TEMP/inputs/toolchain.json" \
            --include-stochastic --cache-only --llm-provider none --json > "$RUNNER_TEMP/raw.json" || code=$?
          # 0: every selected check is a hit. 1: a check must run. 2: the
          # selection failed.
          if [ "$code" -gt 1 ]; then
            echo "the selector failed with exit code $code" > "$out/select-cause.txt"
            exit 1
          fi
          # The record is public: it keeps no self-reported writer of a hit.
          # The raw output stays outside the uploaded directory.
          echo "the selection record did not parse" > "$out/select-cause.txt"
          head -n 1 "$RUNNER_TEMP/raw.json" | jq -c 'del(.cache.hits[]?.provenance.who)' > "$RUNNER_TEMP/selection.json"
          mv "$RUNNER_TEMP/selection.json" "$out/selection.json"
          rm "$out/select-cause.txt"
          find "$XDG_CACHE_HOME/factory/traces" -name '*.json.gz' -exec cp {} "$out/trace.json.gz" \; -quit || true
      - name: Preserve the selection
        id: preserve
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-selection
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

  # The review critics (`factory review gate`, .agents/skills/code-review):
  # for the PR diff and the critics of the merge base, the stored verdict of
  # each critic. An agent stores them when it runs `factory check`. It runs on
  # each same-repo PR in every mode, apart from the selection, so a full run
  # checks the critics too. It holds the read-only role of the select job and
  # runs no package manager and no repository script. The Merge gate job
  # downloads critics.json only by the artifact id that this job gives as an
  # output: a job that runs PR code can upload an artifact with the same name,
  # but not with this id. Each step writes out/critics-cause.txt before a part
  # that can fail. A same-repo PR without a critics record fails the gate: no
  # id (the upload failed, or the job did not run), or no critics.json in the
  # artifact. The job has no continue-on-error, so a failed upload shows as a
  # failed job. The job runs beside the test jobs, so it adds no time to the
  # run. A lookup of 16 hunks and 4 critics took 5 s. The timeout is large, because a large diff (a
  # lockfile) has many hunks and so many store keys.
  merge-gate-critics:
    timeout-minutes: 25
    name: Merge gate critics
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-id: ${{ steps.preserve.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start the cause record
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "the read-only role of the result store was not assumed" > "$RUNNER_TEMP/out/critics-cause.txt"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::134416647419:role/check-results-gate-reader
          aws-region: us-west-2
      - name: Factory release, checked against the pin
        run: |
          cause="$RUNNER_TEMP/out/critics-cause.txt"
          version="$(jq -er .factory.version .github/merge-gate.json)"
          sha256="$(jq -er .factory.sha256 .github/merge-gate.json)"
          echo "the download of the factory release $version failed" > "$cause"
          aws s3api get-object --bucket ctxpipe-factory-check-results-134416647419 \
            --expected-bucket-owner 134416647419 \
            --key "releases/factory/$version/factory-linux-arm64.tar.gz" \
            "$RUNNER_TEMP/factory.tar.gz" > /dev/null
          echo "the factory release does not match the pinned SHA-256" > "$cause"
          echo "$sha256  $RUNNER_TEMP/factory.tar.gz" | sha256sum --check --strict
          echo "the factory release did not unpack" > "$cause"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/factory.tar.gz" -C "$RUNNER_TEMP/bin" factory
      # The step never fails the job: the Merge gate job decides, and a
      # lookup that could not run is a cause, not a missing critic.
      - name: Look up the review critics
        timeout-minutes: 20
        env:
          REPO: ${{ github.repository }}
          # The verdicts are scoped to the head branch, so that an agent can
          # store them before it opens the pull request (factory check).
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          out="$RUNNER_TEMP/out"
          # No URL or credential-like text of the stderr reaches the log or
          # the PR comment (a test checks the rules). gate.mjs shows the cause
          # as it is. The job runs no repository script, so it uses sed.
          redact() {
            local name='["'\'']?[A-Za-z_]*([Kk][Ee][Yy]|[Tt][Oo][Kk][Ee][Nn]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Cc][Rr][Ee][Dd][Ee][Nn][Tt][Ii][Aa][Ll]|[Aa][Uu][Tt][Hh][Oo][Rr][Ii][Zz][Aa][Tt][Ii][Oo][Nn])[A-Za-z_]*["'\'']?[[:space:]]*[=:][[:space:]]*'
            sed -E \
              -e "s#(${name})(\"([^\"\\\\]|\\\\.)*\\\\?(\"|\$)|'([^'\\\\]|\\\\.)*\\\\?('|\$))#\\1[REDACTED]#g" \
              -e 's#[A-Za-z][A-Za-z0-9+.-]*://[^[:space:]]+#[REDACTED-URL]#g' \
              -e 's#(^|[^A-Za-z0-9_])(Basic|basic|Bearer|bearer|token|Token)[[:space:]]+[^[:space:]]+#\1\2 [REDACTED]#g' \
              -e 's#(AKIA|ASIA|ghp_|gho_|ghu_|ghs_|ghr_|github_pat_|sk-|xox[abpr]-|AIza|eyJ)[A-Za-z0-9._/+=-]*#[REDACTED]#g' \
              -e "s#(${name})[^[:space:]\"',}]+#\\1[REDACTED]#g" \
              -e 's#[A-Za-z0-9/+_=-]{32,}#[REDACTED]#g'
          }
          echo "the critics lookup did not finish in 20 minutes" > "$out/critics-cause.txt"
          code=0
          "$RUNNER_TEMP/bin/factory" review gate --repo . --branch "$REPO@$HEAD_REF" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --json \
            > "$RUNNER_TEMP/critics.json" 2> "$RUNNER_TEMP/critics.err" || code=$?
          if [ "$code" -le 1 ] && jq -e '.critics | type == "array"' "$RUNNER_TEMP/critics.json" > /dev/null; then
            # The artifact keeps only the fields that gate.mjs reads: the
            # status of each critic, the commits of its verdicts, and each
            # override, dismissal and raised spend limit with its writer and
            # commit, so that none is silent in the PR comment, and the
            # section of a command critic (its changed screenshots, which the
            # factory makes). It drops the rest (for example the disputes and
            # the store details). A test runs this filter on the factory
            # output.
            echo "the critics record did not parse" > "$out/critics-cause.txt"
            jq -c '{critics: [.critics[] | {critic, status, reason, verdicts: [(.verdicts // [])[] | {commit}], overrides: [(.overrides // [])[] | {finding, path, reason, commit, writer}], dismissals: [(.dismissals // [])[] | {finding, reason, commit, writer}], limitRaises: [(.limitRaises // [])[] | {limitUsd, writer, commit}]} + (if (.section | type) == "string" then {section} else {} end)]}' \
              "$RUNNER_TEMP/critics.json" > "$RUNNER_TEMP/critics.min.json"
            mv "$RUNNER_TEMP/critics.min.json" "$out/critics.json"
            rm "$out/critics-cause.txt"
          else
            echo "factory review gate failed with exit code $code: $(tail -n 1 "$RUNNER_TEMP/critics.err" | redact | cut -c1-300)" > "$out/critics-cause.txt"
            redact < "$RUNNER_TEMP/critics.err" >&2
          fi
      - name: Preserve the critics
        id: preserve
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-critics
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

  # The LLM stage of the selection (`factory check` with a model, Claude
  # Haiku 5.5 through OpenRouter) for the select job's run. It holds the
  # model key of the workbench environment and no cloud role. It runs only
  # the selector release of the select job, after it checks the pinned
  # SHA-256 again, on a checkout without credentials. It runs no package
  # manager and no repository script. It makes no cache lookup (the select
  # job did that), so a check that only it selects runs. When it fails, the
  # deterministic selection of the select job stays, and the plan says why.
  merge-gate-llm:
    timeout-minutes: 5
    name: Merge gate LLM selection
    needs: merge-gate-select
    # !cancelled(): the Nightly change job is skipped on a PR (see the select job).
    if: |
      !cancelled() &&
      needs.merge-gate-select.result == 'success'
    continue-on-error: true
    environment: workbench
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.preserve.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start the cause record
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "the inputs of the select job did not download" > "$RUNNER_TEMP/out/llm-cause.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/inputs
      - if: needs.merge-gate-select.outputs.artifact-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.merge-gate-select.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-release
          path: ${{ runner.temp }}/release
      - name: Selector release, checked against the pin
        run: |
          echo "the selector release does not match the pinned SHA-256" > "$RUNNER_TEMP/out/llm-cause.txt"
          sha256="$(jq -er .factory.sha256 .github/merge-gate.json)"
          echo "$sha256  $RUNNER_TEMP/release/factory.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/release/factory.tar.gz" -C "$RUNNER_TEMP/bin" factory
      # A slow model call delays every check job, so the selector has 170
      # seconds (150 for the model). The plan keeps the deterministic selection when this step
      # fails or times out.
      - name: Select with the LLM stage
        timeout-minutes: 3
        env:
          OPENROUTER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          out="$RUNNER_TEMP/out"
          echo "the selector did not finish in 3 minutes" > "$out/llm-cause.txt"
          trace=()
          [ ! -f "$RUNNER_TEMP/selection/trace.json.gz" ] || trace=(--trace "$RUNNER_TEMP/selection/trace.json.gz")
          code=0
          timeout 170 "$RUNNER_TEMP/bin/factory" check --repo . --base HEAD^1 --k 3 \
            --manifest "$RUNNER_TEMP/inputs/manifest.json" "${trace[@]}" \
            --include-stochastic --llm-provider openrouter \
            --dry-run --json > "$RUNNER_TEMP/raw.json" || code=$?
          if [ "$code" = 124 ]; then
            echo "the selector did not finish in 170 seconds" > "$out/llm-cause.txt"
            exit 1
          fi
          if [ "$code" -gt 1 ]; then
            echo "the selector failed with exit code $code" > "$out/llm-cause.txt"
            exit 1
          fi
          # The audit field is a path on this runner.
          echo "the selection record did not parse" > "$out/llm-cause.txt"
          head -n 1 "$RUNNER_TEMP/raw.json" | jq -c 'del(.llm.audit)' > "$RUNNER_TEMP/llm-selection.json"
          mv "$RUNNER_TEMP/llm-selection.json" "$out/llm-selection.json"
          rm "$out/llm-cause.txt"
          jq -c '.llm | {fallback, cached, latencyMs, usage, kept: (.kept | length), dropped: (.dropped | length), added: (.added | length)}' "$out/llm-selection.json"
      - name: Preserve the LLM selection
        id: preserve
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-llm
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

  # What the nightly run of main runs (CTX-1246, scripts/checks/README.md,
  # Traces): `factory nightly plan` gives the checks whose inputs changed
  # since the previous trace of main, or every check (a run by hand, no
  # previous trace, or a full trace 7 days old), and a random sample of the
  # checks whose key has only agent passes, for the audit. The Merge gate plan
  # job puts these checks into the jobs of the run. The artifact `nightly-plan`
  # holds the plan, the previous trace and the selector release, for the
  # Trace job and the Results writer. It runs only on main: the role of the
  # result store trusts only main. It runs no repository script.
  nightly-plan:
    timeout-minutes: 10
    name: Nightly plan
    needs: [nightly-change, merge-gate-manifest]
    if: |
      !cancelled() && needs.nightly-change.outputs.run != 'false' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.merge-gate-manifest.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      artifact-id: ${{ steps.preserve.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/inputs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::134416647419:role/check-results-ci-writer
          aws-region: us-west-2
      - name: Selector release, checked against the pin
        run: |
          version="$(jq -er '.factory.version | select(test("^[0-9a-f]{40}$"))' .github/merge-gate.json)"
          sha256="$(jq -er .factory.sha256 .github/merge-gate.json)"
          mkdir -p "$RUNNER_TEMP/nightly" "$RUNNER_TEMP/bin"
          aws s3api get-object --bucket ctxpipe-factory-check-results-134416647419 \
            --expected-bucket-owner 134416647419 \
            --key "releases/factory/$version/factory-linux-arm64.tar.gz" \
            "$RUNNER_TEMP/nightly/factory.tar.gz" > /dev/null
          echo "$sha256  $RUNNER_TEMP/nightly/factory.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nightly/factory.tar.gz" -C "$RUNNER_TEMP/bin" factory
      # The newest trace of a nightly run or a run by hand on main. Without
      # one, the plan is full.
      - name: The previous trace of main
        env:
          GH_TOKEN: ${{ github.token }}
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          if "$RUNNER_TEMP/bin/factory" trace fetch --repo .; then
            find "$XDG_CACHE_HOME/factory/traces" -name '*.json.gz' -exec cp {} "$RUNNER_TEMP/nightly/previous.json.gz" \;
          else
            echo "::warning::No previous trace of main: this nightly run traces every check."
          fi
      - name: Plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          args=(--repo . --manifest "$RUNNER_TEMP/inputs/manifest.json"
            --toolchain "$RUNNER_TEMP/inputs/toolchain.json"
            --out "$RUNNER_TEMP/nightly/plan.json")
          if [ -f "$RUNNER_TEMP/nightly/previous.json.gz" ]; then
            args+=(--trace "$RUNNER_TEMP/nightly/previous.json.gz")
          fi
          # A run by hand is full.
          if [ "$EVENT" = workflow_dispatch ]; then args+=(--full); fi
          "$RUNNER_TEMP/bin/factory" nightly plan "${args[@]}" | tee "$RUNNER_TEMP/nightly/plan.txt"
          {
            echo "## Nightly plan"
            echo
            echo '```'
            grep -v '^  TRACE ' "$RUNNER_TEMP/nightly/plan.txt"
            echo '```'
            echo
            echo "<details><summary>Checks to trace again</summary>"
            echo
            echo '```'
            grep '^  TRACE ' "$RUNNER_TEMP/nightly/plan.txt" || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the plan
        id: preserve
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-plan
          path: ${{ runner.temp }}/nightly/
          if-no-files-found: error
          # The jobs of this run read it. It holds the factory release.
          retention-days: 1
      # A marker of the kind of the plan, kept as long as the trace: the job
      # Nightly tickets compares the runner minutes of a run with the last
      # full nightly run (scripts/ci/nightly.mjs).
      - name: The kind of the plan
        id: kind
        run: |
          kind="$(jq -r 'if .full then "full" else "incremental" end' "$RUNNER_TEMP/nightly/plan.json")"
          echo "$kind" > "$RUNNER_TEMP/kind.txt"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ steps.kind.outputs.kind }}
          path: ${{ runner.temp }}/kind.txt

  # The plan of a PR run (gate.mjs plan): in gate mode, the checks that each
  # job runs, and the stored passes that the other selected checks reuse (the
  # `ci` and `agent` classes from the select job, the `pr` class from the PR
  # store). A job of the plan output starts; another check job does not. In
  # shadow mode, on a fork PR, or when the selector failed, the plan says
  # full and every job runs. It runs only the public gate.mjs, with no
  # package and no credential. The PR store is in the GitHub Actions cache of
  # the PR: only a run of this PR writes there (the merge gate job).
  # On a nightly run of main, it puts the checks of the nightly plan into the
  # jobs of the run (gate.mjs nightly) in the same way.
  merge-gate-plan:
    timeout-minutes: 5
    name: Merge gate plan
    needs: [merge-gate-manifest, merge-gate-select, merge-gate-llm, nightly-plan]
    if: |
      !cancelled() &&
      (github.event_name == 'pull_request' || needs.nightly-plan.result == 'success')
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.preserve.outputs.artifact-id }}
      mode: ${{ steps.plan.outputs.mode }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      test-shards: ${{ steps.plan.outputs.test-shards }}
      package-tests: ${{ steps.plan.outputs.package-tests }}
      production-builds: ${{ steps.plan.outputs.production-builds }}
      packages: ${{ steps.plan.outputs.packages }}
      storybook-build: ${{ steps.plan.outputs.storybook-build }}
      storybook-plays: ${{ steps.plan.outputs.storybook-plays }}
      storybook-visual: ${{ steps.plan.outputs.storybook-visual }}
      codesearch: ${{ steps.plan.outputs.codesearch }}
      upgrade-from-previous-release: ${{ steps.plan.outputs.upgrade-from-previous-release }}
      project-checks: ${{ steps.plan.outputs.project-checks }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      # The manifest job runs PR code, so only its mode.json is read. The
      # selection and the LLM selection download by the artifact id that the
      # job that wrote them gives: a job that runs PR code can upload an
      # artifact with the same name. Without an id, the record is missing and
      # the plan is full.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'pull_request'
        continue-on-error: true
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/manifest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'pull_request' && needs.merge-gate-select.outputs.artifact-id != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.merge-gate-select.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'pull_request' && needs.merge-gate-llm.outputs.artifact-id != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.merge-gate-llm.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/inputs
      - name: The mode of the manifest job
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/inputs"
          if [ -f "$RUNNER_TEMP/manifest/mode.json" ]; then
            cp "$RUNNER_TEMP/manifest/mode.json" "$RUNNER_TEMP/inputs/mode.json"
          fi
      - name: Restore the PR store
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .merge-gate-store
          key: merge-gate-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            merge-gate-pr-${{ github.event.pull_request.number }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name != 'pull_request' && needs.nightly-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.nightly-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/nightly
      # A nightly run takes the plan of the Nightly plan job; the check times
      # of its previous trace pack the shards.
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            node scripts/checks/gate.mjs nightly --config .github/merge-gate.json \
              --plan "$RUNNER_TEMP/nightly/plan.json" --trace "$RUNNER_TEMP/nightly/previous.json.gz" \
              --out "$RUNNER_TEMP/plan" --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          node scripts/checks/gate.mjs plan --config .github/merge-gate.json \
            --inputs "$RUNNER_TEMP/inputs" --needs "$RUNNER_TEMP/needs.json" \
            --store .merge-gate-store/store.json \
            --out "$RUNNER_TEMP/plan" --github-output "$GITHUB_OUTPUT"
      - name: Preserve the plan
        id: preserve
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-plan
          path: ${{ runner.temp }}/plan/plan.json
          if-no-files-found: ignore

  # Publishes the decision of each PR run: the job summary, the artifact
  # merge-gate-decision, and one PR comment that it updates. In gate mode
  # this job is the verdict: it fails when the gated run fails (or, on a
  # full run, when the full run fails), and it writes the passes of this run
  # to the PR store. In shadow mode the full run gates; this job computes
  # what a gated run would decide from the same results, and the agreement
  # record (scripts/checks/README.md). It runs only the public gate.mjs,
  # with no package.
  merge-gate:
    timeout-minutes: 10
    # A fixed name: this job is the required status, also when the plan job
    # failed and gave no outputs (then the run is full). It has no
    # continue-on-error: a failed verdict fails it only in gate mode, but an
    # error in gate.mjs decide or a failed PR comment step fails it in each
    # mode.
    name: Merge gate
    needs:
      [
        merge-gate-manifest,
        merge-gate-select,
        merge-gate-llm,
        merge-gate-plan,
        merge-gate-critics,
        lint,
        typecheck,
        test-shards,
        package-tests,
        test,
        production-builds,
        packages,
        storybook-build,
        storybook-required,
        storybook-plays,
        storybook-visual,
        codesearch,
        migrate,
        upgrade-from-previous-release,
      ]
    if: |
      always() && github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      # The manifest job runs PR code, so only its mode.json is read. The
      # selection, the LLM selection, the plan and the critics download by the
      # artifact id that the job that wrote them gives: a job that runs PR
      # code can upload an artifact with the same name. Without an id, the
      # record is missing: the run is full, and a same-repo PR fails on its
      # critics (gate.mjs decide).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/manifest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.merge-gate-select.outputs.artifact-id != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.merge-gate-select.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.merge-gate-llm.outputs.artifact-id != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.merge-gate-llm.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.merge-gate-plan.outputs.artifact-id != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.merge-gate-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.merge-gate-critics.outputs.artifact-id != ''
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.merge-gate-critics.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/inputs
      - name: The mode of the manifest job
        run: |
          mkdir -p "$RUNNER_TEMP/inputs"
          if [ -f "$RUNNER_TEMP/manifest/mode.json" ]; then
            cp "$RUNNER_TEMP/manifest/mode.json" "$RUNNER_TEMP/inputs/mode.json"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: test-results-*
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: storybook-*-results*
          path: ${{ runner.temp }}/results
      - name: The jobs of this run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        # The jobs of the earlier attempts show the flakes: a job that failed
        # in an earlier attempt and passed in this one.
        run: |
          gh api "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" --paginate \
            --jq '.jobs[]' | jq -s '{jobs: .}' > "$RUNNER_TEMP/jobs.json"
          for ((attempt = 1; attempt < ATTEMPT; attempt++)); do
            gh api "repos/$REPO/actions/runs/$RUN/attempts/$attempt/jobs?per_page=100" --paginate \
              --jq '.jobs[]'
          done | jq -s '{jobs: .}' > "$RUNNER_TEMP/earlier.json"
      - name: Restore the PR store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .merge-gate-store
          key: merge-gate-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            merge-gate-pr-${{ github.event.pull_request.number }}-
      # In gate mode a failed verdict fails this step; the next steps still
      # publish the decision and keep the PR store.
      - name: Decision
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          code=0
          node scripts/checks/gate.mjs decide --config .github/merge-gate.json \
            --inputs "$RUNNER_TEMP/inputs" --results "$RUNNER_TEMP/results" \
            --needs "$RUNNER_TEMP/needs.json" --jobs "$RUNNER_TEMP/jobs.json" \
            --earlier "$RUNNER_TEMP/earlier.json" \
            --store .merge-gate-store/store.json --out "$RUNNER_TEMP/decision" || code=$?
          cat "$RUNNER_TEMP/decision/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$code"
      - name: Keep the PR store
        id: store
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/decision/store.json" ] || exit 0
          mkdir -p .merge-gate-store
          cp "$RUNNER_TEMP/decision/store.json" .merge-gate-store/store.json
          echo "kept=true" >> "$GITHUB_OUTPUT"
      - name: Save the PR store
        if: always() && steps.store.outputs.kept == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .merge-gate-store
          key: merge-gate-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve the decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-decision
          path: |
            ${{ runner.temp }}/decision/decision.json
            ${{ runner.temp }}/inputs/selection.json
          if-no-files-found: warn
      # The evals call paid models: only the label starts them. The reminder
      # reads the PR files and labels, so it shows in every mode.
      - name: Remind the author of the MCP evals
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash scripts/ci/mcp-evals-reminder.sh "$RUNNER_TEMP/decision/comment.md"
      # A fork PR has a read-only token, so it gets only the summary.
      - name: Post or update the PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$(cat "$RUNNER_TEMP/decision/comment.md")"
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- merge-gate -->"))) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # The trusted writer of the result store, after a full run on main (the
  # nightly schedule, or a run by hand on main). It stores each pass as the CI
  # class, and audits each failed check against the passes that the store
  # holds for its key. A contradiction (a stored pass for a key that failed
  # tonight) fails this job: a key misses an input, the check is flaky, or a
  # writer stored a false pass. The test jobs run each failed check once more
  # (rerun.ndjson); only a check that fails again quarantines its key, and
  # each agent writer of a pass when the key has complete inputs, so that no
  # reader accepts them. A flake is reported, not quarantined. The output
  # names the check and the key, and a writer only by a hash. An S3 error in
  # the audit is an error annotation. The job never fails the run.
  # Its role trusts only repo:ctxpipe-ai/ctxpipe:ref:refs/heads/main: a job on
  # main without a GitHub environment. The npm publish jobs of deploy.yaml
  # (release, prerelease) get the same subject, so they can also get this
  # role. This is an accepted risk: each builds only code on main, and the
  # risk is that code and its dependencies (scripts/ci/check-secret-jobs.mjs).
  # This job runs no package manager and no repository script: the selector
  # computes each key itself from the clean checkout of the traced commit,
  # with the manifest, the toolchain and the trace of this run.
  results-writer:
    timeout-minutes: 15
    name: Results writer
    needs: [merge-gate-manifest, trace, nightly-plan]
    if: |
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.merge-gate-manifest.result == 'success' && needs.trace.result == 'success'
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      id-token: write
    outputs:
      non_portable: ${{ steps.store.outputs.non_portable }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pinned selector release
        id: pin
        run: |
          if jq -e '.factory.version | test("^[0-9a-f]{40}$")' .github/merge-gate.json > /dev/null; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::.github/merge-gate.json pins no factory release, so the Results writer stores nothing."
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true'
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true'
        with:
          name: trace-${{ github.sha }}
          path: ${{ runner.temp }}/trace
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true'
        with:
          pattern: test-results-*
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true'
        with:
          pattern: storybook-plays-results-*
          path: ${{ runner.temp }}/results
      # A pattern: an incremental run without a project check has no such
      # artifact, and the writer still audits the other checks.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true'
        with:
          pattern: lane-trace-projects
          path: ${{ runner.temp }}/results/projects
      # The audit sample of the nightly plan. Without the plan, the writer
      # cannot check the sample, so it fails (never a silent skip).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true' && needs.nightly-plan.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ needs.nightly-plan.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/nightly
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.pin.outputs.pinned == 'true'
        with:
          role-to-assume: arn:aws:iam::134416647419:role/check-results-ci-writer
          aws-region: us-west-2
      - name: Selector release, checked against the pin
        if: steps.pin.outputs.pinned == 'true'
        run: |
          version="$(jq -er .factory.version .github/merge-gate.json)"
          sha256="$(jq -er .factory.sha256 .github/merge-gate.json)"
          aws s3api get-object --bucket ctxpipe-factory-check-results-134416647419 \
            --expected-bucket-owner 134416647419 \
            --key "releases/factory/$version/factory-linux-arm64.tar.gz" \
            "$RUNNER_TEMP/factory.tar.gz" > /dev/null
          echo "$sha256  $RUNNER_TEMP/factory.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/factory.tar.gz" -C "$RUNNER_TEMP/bin" factory
      - name: Store the passes and audit the failures
        id: store
        if: steps.pin.outputs.pinned == 'true'
        env:
          NIGHTLY_PLAN: ${{ needs.nightly-plan.result }}
        run: |
          if [ ! -f "$RUNNER_TEMP/nightly/plan.json" ]; then
            echo "::error::The nightly plan is missing (job Nightly plan: ${NIGHTLY_PLAN}), so the Results writer cannot audit its sample of agent passes. Nothing is stored."
            exit 1
          fi
          mapfile -d '' records < <(find "$RUNNER_TEMP/results" -name records.ndjson -print0 | sort -z)
          mapfile -d '' reruns < <(find "$RUNNER_TEMP/results" -name rerun.ndjson -print0 | sort -z)
          rerun_args=()
          if [ "${#reruns[@]}" -gt 0 ]; then rerun_args=(--reruns "${reruns[@]}"); fi
          code=0
          "$RUNNER_TEMP/bin/factory" store --repo . \
            --manifest "$RUNNER_TEMP/inputs/manifest.json" \
            --toolchain "$RUNNER_TEMP/inputs/toolchain.json" \
            --trace "$RUNNER_TEMP/trace/trace.json.gz" \
            --records "${records[@]}" \
            --json-file "$RUNNER_TEMP/store.json" \
            --plan "$RUNNER_TEMP/nightly/plan.json" \
            "${rerun_args[@]}" > "$RUNNER_TEMP/store.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/store.txt"
          find "$RUNNER_TEMP/results" -name not-rerun.txt -print0 | sort -z |
            while IFS= read -r -d '' list; do
              {
                echo
                echo "Failed checks that the rerun skipped (limit of 50), so their keys are not confirmed:"
                cat -v "$list"
              } >> "$RUNNER_TEMP/store.txt"
            done
          # Suspect agent writers (sha256 of the writer), by cause. A person or
          # the nightly agent reviews the markers under quarantine/suspect/.
          held="$(jq -r '.writersHeld // empty' "$RUNNER_TEMP/store.json" 2> /dev/null || true)"
          if [ -n "$held" ]; then
            hashes="$(jq -r '[.contradictions[] | select(.rerun == "failed" and (.crossPlatform | not)) | .writers[]] | unique | join(" ")' "$RUNNER_TEMP/store.json")"
            echo "::error::Suspect agent writers: ${hashes}. No writer was quarantined, because ${held}."
          fi
          cross="$(jq -r '[.contradictions[]? | select(.rerun == "failed" and .crossPlatform) | .writers[]] | unique | join(" ")' "$RUNNER_TEMP/store.json" 2> /dev/null || true)"
          if [ -n "$cross" ]; then
            echo "::error::Suspect agent writers: ${cross}. Their pass of a portable check came from another platform, so either the check is not portable or the pass is false. The Non-portable checks job marks the check not portable."
          fi
          # The portable checks that failed here and in the rerun, while every
          # stored pass of their key came from another platform: their result
          # depends on the platform. The Non-portable checks job lists them.
          ids="$(jq -c '.nonPortable // []' "$RUNNER_TEMP/store.json" 2> /dev/null || echo '[]')"
          echo "non_portable=${ids}" >> "$GITHUB_OUTPUT"
          if [ "$ids" != "[]" ]; then
            echo "::error::Checks whose result depends on the platform: ${ids}. The Non-portable checks job opens a pull request that adds them to the denylist of the manifest."
          fi
          if grep -qE '^(NOT AUDITED|AUDIT SAMPLE FAILED)' "$RUNNER_TEMP/store.txt"; then
            echo "::error::Part of the audit sample of agent passes was not audited. See the Results writer summary."
          fi
          if grep -q '^AUDIT FAILED' "$RUNNER_TEMP/store.txt"; then
            echo "::error::The audit of the result store failed, so no key was quarantined. See the Results writer summary."
          fi
          {
            echo "## Results writer"
            echo
            echo '```'
            cat "$RUNNER_TEMP/store.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  # Adds the checks that the Results writer found not portable to the
  # committed denylist, in a draft pull request: the manifest then marks them
  # not portable, so a laptop pass no longer counts in CI for them. It runs no
  # repository script and has no AWS role. When GitHub refuses the pull
  # request, the error annotation names the checks to add by hand.
  non-portable-checks:
    timeout-minutes: 10
    name: Non-portable checks
    needs: [results-writer]
    if: always() && needs.results-writer.outputs.non_portable != '' && needs.results-writer.outputs.non_portable != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Open or update the pull request that marks the checks not portable
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ needs.results-writer.outputs.non_portable }}
        run: |
          # One fixed branch and one pull request: each night adds its checks
          # to the same list, so an unmerged pull request never doubles.
          branch=ci/non-portable-checks
          list=scripts/checks/non-portable.json
          open="$(gh pr list --head "$branch" --state open --json number --jq '.[].number')"
          # Without an open pull request, start again from main.
          if [ -n "$open" ] && git fetch -q origin "$branch"; then
            git switch -q -c "$branch" FETCH_HEAD
          else
            git switch -q -c "$branch"
          fi
          jq --argjson ids "$IDS" '. + $ids | unique' "$list" > "$RUNNER_TEMP/list.json"
          mv "$RUNNER_TEMP/list.json" "$list"
          if git diff --quiet; then
            echo "The denylist already holds ${IDS}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Mark checks not portable from the nightly audit"
          git push -q --force origin "$branch"
          [ -z "$open" ] || exit 0
          body="The nightly Results writer found portable checks that failed in CI and in the rerun, while every stored pass of the same key came from another platform. The manifest now marks them not portable. Find and fix the platform dependency, then remove them from the list. Each night adds its checks to this branch."
          if ! gh pr create --draft --base main --head "$branch" \
            --title "Mark checks not portable from the nightly audit" --body "$body"; then
            echo "::error::No pull request opened. Add ${IDS} to ${list} by hand (branch ${branch})."
            exit 1
          fi

  # The Linear tickets of the nightly run (scripts/ci/nightly.mjs, ADR-062).
  # A screenshot or play check that failed and then passed in its rerun is a
  # flake: its story gets one fix ticket (Todo, ready-for-agent, parent
  # CTX-1178). A second flake of the story comments on that ticket and gives
  # the entry of the unstable list to the Unstable screenshots job. A failed
  # or timed-out job of the run opens one ticket in Triage. It also runs when
  # Nightly change failed, so that failure gets its ticket. The Linear key is
  # a secret of the workbench environment; without it the job fails with an
  # error annotation. The job reads the downloaded records only as data.
  nightly-tickets:
    timeout-minutes: 10
    name: Nightly tickets
    needs:
      [
        nightly-change,
        test-shards,
        package-tests,
        test,
        trace,
        project-checks,
        production-builds,
        packages,
        storybook-build,
        storybook-plays,
        storybook-visual,
        codesearch,
        upgrade-from-previous-release,
        merge-gate-manifest,
        nightly-plan,
        results-writer,
        non-portable-checks,
      ]
    if: always() && github.event_name == 'schedule' && needs.nightly-change.outputs.run != 'false'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    environment: workbench
    permissions:
      contents: read
      actions: read
    outputs:
      unstable: ${{ steps.tickets.outputs.unstable }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      # Only the artifacts that the Storybook shards name by id: another job
      # of the run can upload an artifact with the same name.
      - name: The artifact ids of the Storybook shards
        id: ids
        env:
          VISUAL: ${{ join(needs.storybook-visual.outputs.*, ',') }}
          PLAYS: ${{ join(needs.storybook-plays.outputs.*, ',') }}
        run: |
          ids="$(printf '%s,%s' "$VISUAL" "$PLAYS" | tr ',' '\n' | grep -E '^[0-9]+$' | paste -sd, - || true)"
          echo "ids=${ids}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.ids.outputs.ids != ''
        with:
          artifact-ids: ${{ steps.ids.outputs.ids }}
          path: ${{ runner.temp }}/results
      # The runner minutes of this run and of the last full nightly run of
      # main: an incremental run traces only the checks whose inputs changed.
      - name: Runner minutes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/nightly.mjs minutes
      - name: Open the tickets of the flakes and the failed jobs
        id: tickets
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/ci/nightly.mjs tickets "$RUNNER_TEMP/results"

  # Puts each story that flaked in two nightly runs on the unstable list
  # (scripts/ci/visual-unstable-stories.json), with its ticket and the date,
  # and removes its baselines (an unstable screenshot has none, so a kept one
  # would be an orphan), in a draft pull request. It runs only on main, runs
  # no repository script and has no secret. When GitHub refuses the pull
  # request, the error annotation names the stories.
  unstable-screenshots:
    timeout-minutes: 10
    name: Unstable screenshots
    needs: [nightly-tickets]
    if: always() && github.ref == 'refs/heads/main' && needs.nightly-tickets.outputs.unstable != '' && needs.nightly-tickets.outputs.unstable != '[]'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Open or update the pull request that puts the stories on the unstable list
        env:
          GH_TOKEN: ${{ github.token }}
          UNSTABLE: ${{ needs.nightly-tickets.outputs.unstable }}
        run: |
          printf '%s' "$UNSTABLE" > "$RUNNER_TEMP/unstable.json"
          ids="$(jq -c 'map(.id)' "$RUNNER_TEMP/unstable.json")"
          # One fixed branch and one pull request: each night adds its
          # stories to the same list, so an unmerged pull request never
          # doubles.
          branch=ci/unstable-screenshots
          list=scripts/ci/visual-unstable-stories.json
          # Only the pull request of this job: a fork can open one from a
          # branch with the same name.
          open="$(gh pr list --head "$branch" --state open --json number,isCrossRepository,author \
            --jq '.[] | select((.isCrossRepository | not) and .author.login == "app/github-actions") | .number')"
          # Without an open pull request, start again from main.
          if [ -n "$open" ] && git fetch -q origin "$branch"; then
            git switch -q -c "$branch" FETCH_HEAD
          else
            git switch -q -c "$branch"
          fi
          jq -r '.[].baselines[]' "$RUNNER_TEMP/unstable.json" |
            while IFS= read -r baseline; do git rm -q --ignore-unmatch -- "$baseline"; done
          # An entry without a viewport: the story is unstable at each one.
          jq --slurpfile new "$RUNNER_TEMP/unstable.json" '
            ([.stories[].id]) as $known
            | .stories += [$new[0][] | select(.id as $id | $known | index($id) | not) | {id, reason, ticket, since}]
          ' "$list" > "$RUNNER_TEMP/list.json"
          mv "$RUNNER_TEMP/list.json" "$list"
          if git diff --quiet HEAD; then
            echo "The unstable list already holds ${ids}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$list"
          git commit -qm "Put the stories that flaked in two nightly runs on the unstable list"
          git push -q --force origin "$branch"
          [ -z "$open" ] || exit 0
          body="These stories flaked in two nightly runs: a screenshot or play check failed and then passed in its rerun. This pull request puts them on the unstable list and removes their baselines, so they get no screenshot check. Each entry names the ticket that fixes the story. An entry older than 7 days fails CI. Each night adds its stories to this branch."
          if ! gh pr create --draft --base main --head "$branch" \
            --title "Put the stories that flaked in two nightly runs on the unstable list" --body "$body"; then
            echo "::error::No pull request opened. Add ${ids} to ${list} by hand (branch ${branch})."
            exit 1
          fi
