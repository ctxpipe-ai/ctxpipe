name: CI

on:
  workflow_dispatch:
  # A nightly run of the tests on main records the trace of main with
  # `--trace`. Only the test, Storybook, upgrade and Project check times jobs
  # and the Trace job run on it.
  schedule:
    - cron: "23 2 * * *"
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Cloud Agent pushes sometimes skip pull_request synchronize. Keep push so
  # those commits still get CI. Jobs XOR: agents run on push only; everyone
  # else on pull_request only. Do not rely on concurrency to hide the twin.
  # branches must be listed (not only tags-ignore) or GitHub skips branch pushes.
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Cloud Agent (`cursor[bot]` / `cursoragent`): push only.
# Humans: pull_request only.
jobs:
  lint:
    timeout-minutes: 15
    name: Lint and format
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The trace tests start a Bun child process.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm lint
      - run: pnpm format:check
      - name: Reject unused files, exports and dependencies
        run: pnpm knip
      - run: node scripts/ci/check-workflow-credentials.mjs
      - run: node scripts/ci/check-secret-jobs.mjs
      - run: node scripts/ci/check-agent-harness.mjs
      - name: Fetch Gate 0 classification pin
        run: git fetch origin 7dfa6b93a5baedc3eb2c86dd1056662e89cace00 --no-tags
      - name: Reject skipped proof and owned mocks
        run: node scripts/ci/check-test-policy.mjs
      - name: Reject slow UI motion
        run: node scripts/ci/check-ui-motion.mjs
      - name: Reject racy Storybook play checks
        run: node scripts/ci/check-story-play-timing.mjs
      - name: Reject non-Blacksmith runners
        run: node scripts/ci/check-runners.mjs
      - name: Reject outside values in run scripts and workflows without permissions
        run: node scripts/ci/check-workflow-inputs.mjs
      - name: Validate and install the Claude plugin
        run: node scripts/ci/check-claude-plugin.mjs
      - name: CI command regression tests
        run: |
          node --test scripts/tests/ci-*.test.mjs
          bash scripts/tests/preview-otel-vars.test.sh
          bash scripts/tests/preview-sandbox-vars.test.sh
          bash scripts/tests/preview-github-app-vars.test.sh
          bash scripts/tests/preview-own-secrets.test.sh
          node --test scripts/tests/railway-sync-variables.test.mjs
          bash scripts/tests/preview-app-db-password.test.sh
          bash scripts/tests/preview-neon-branch.test.sh
          bash scripts/tests/railway-environment-id.test.sh
          bash scripts/tests/railway-set-images.test.sh
          bash scripts/tests/preview-ui-private.test.sh

  typecheck:
    timeout-minutes: 30
    name: Typecheck
    # A push to main also runs this job, so that the cache has the build info
    # of main for each pull request. In gate mode it runs only when the plan
    # selects a typecheck check (scripts/checks/README.md, Merge gate).
    needs: merge-gate-plan
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.typecheck != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build info of the last typecheck (scripts/ci/typecheck.mjs). The
      # newest one with the same lockfile and tsconfig files comes first. A
      # pull request without its own entry gets the entry of main. A build
      # info from a different TypeScript version is not used. A push to main
      # does not restore it: that run is cold, so a bad merge fails on main.
      - name: Compute the typecheck cache key
        id: typecheck-cache
        run: echo "prefix=${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json', 'apps/*/tsconfig.json', 'packages/*/tsconfig.json', 'examples/*/tsconfig.json') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore the typecheck build info
        if: github.event_name != 'push'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/typecheck
          key: typecheck-${{ steps.typecheck-cache.outputs.prefix }}${{ github.sha }}
          restore-keys: |
            typecheck-${{ steps.typecheck-cache.outputs.prefix }}
      # The check runner runs each project with its diagnostic allowance and
      # writes one result record for each, for the merge gate. The output of
      # each project is in .ci-results/checks (the next step prints it).
      - name: Full projects with shrinking diagnostic allowances
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: |
          set -o pipefail
          mkdir -p .ci-results/typecheck
          pnpm -s checks:list |
            jq -r '.checks[] | select(.family == "typecheck") | .id' > "$RUNNER_TEMP/typecheck.txt"
          node scripts/checks/run.mjs "$RUNNER_TEMP/typecheck.txt" |
            tee .ci-results/typecheck/records.ndjson
      - name: Selected projects (merge gate)
        if: needs.merge-gate-plan.outputs.mode == 'gate'
        env:
          PLAN: ${{ needs.merge-gate-plan.outputs.typecheck }}
        run: node scripts/checks/selected.mjs .ci-results/typecheck
      # A failed typecheck also writes the build info: it holds the result of
      # each file, and the next run checks only the changed files again.
      - name: Save the typecheck build info
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/typecheck
          key: typecheck-${{ steps.typecheck-cache.outputs.prefix }}${{ github.sha }}
      - name: Typecheck output
        if: always()
        run: cat .ci-results/checks/*.log || true
      - name: Preserve the typecheck results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-typecheck
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore

  test-shards:
    # The runner's own limit (scripts/ci/test-suite.mjs) is 30 min for backend
    # and 45 min for contracts. The job limit adds 15 min for setup, so the
    # named runner timeout fires before the job is cancelled.
    timeout-minutes: ${{ matrix.lane != 'backend' && 60 || 45 }}
    # One shard runs its files in series in its own database, so a worker in
    # one shard cannot claim a run that a file in another shard opened.
    name: ${{ matrix.lane }} tests (shard ${{ matrix.shard }}/${{ matrix.count }})
    # The nightly run (schedule) also runs the tests, to record the trace of main.
    needs: merge-gate-plan
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.test-shards != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # The full run: shard counts come from the measured file times in
        # scripts/ci/test-weights.json, about 200 s of backend test time and
        # 240 s of contract test time per shard. In gate mode the plan job
        # gives the shards of the selected checks (lane `selected`).
        include: >-
          ${{ fromJSON(needs.merge-gate-plan.outputs.test-shards || '[
          {"lane": "backend", "shard": 1, "count": 4},
          {"lane": "backend", "shard": 2, "count": 4},
          {"lane": "backend", "shard": 3, "count": 4},
          {"lane": "backend", "shard": 4, "count": 4},
          {"lane": "contracts", "shard": 1, "count": 5},
          {"lane": "contracts", "shard": 2, "count": 5},
          {"lane": "contracts", "shard": 3, "count": 5},
          {"lane": "contracts", "shard": 4, "count": 5},
          {"lane": "contracts", "shard": 5, "count": 5}
          ]') }}
    services:
      postgres:
        # Same pgvector image as the migrate job so default-suite persist tests
        # hit the live unique index instead of a dummy DATABASE_URL.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: ctxpipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d ctxpipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/falkordb
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Required chat engine binary
        run: npm install --global opencode-ai@1.18.34
      # Test files start these images in parallel. A Docker Hub token request
      # can time out, so pull each image once here, with retries, before the
      # tests start.
      - name: Required test container images
        if: matrix.lane != 'backend'
        run: |
          for image in infisical/agent-vault:latest alpine:3.22 node:24 curlimages/curl:8.17.0; do
            n=0
            until docker pull --quiet "$image"; do
              n=$((n + 1))
              if [ "$n" -ge 4 ]; then
                echo "::error::Outside service unavailable: Docker Hub did not serve $image after 4 attempts"
                exit 1
              fi
              sleep $((n * 10))
            done
          done
      - name: Restore native revision index tools
        id: zoekt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ctxpipe-zoekt
          key: zoekt-${{ runner.os }}-${{ runner.arch }}-go1.25.12-596c362fcf1388fe0082acfcfc80c4d172efb7c1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.zoekt.outputs.cache-hit != 'true'
        with:
          go-version: 1.25.12
          cache: false
      - name: Required native revision index tools
        run: |
          npm install --global @ast-grep/cli@0.45.0
          if [ ! -x "$RUNNER_TEMP/ctxpipe-zoekt/zoekt-webserver" ]; then
            mkdir -p "$RUNNER_TEMP/ctxpipe-zoekt"
            # proxy.golang.org occasionally resets the zoekt zip mid-download.
            for tool in zoekt-index zoekt-webserver; do
              n=0
              until GOBIN="$RUNNER_TEMP/ctxpipe-zoekt" go install \
                "github.com/sourcegraph/zoekt/cmd/${tool}@596c362fcf1388fe0082acfcfc80c4d172efb7c1"
              do
                n=$((n + 1))
                [ "$n" -lt 4 ] || exit 1
                sleep $((n * 4))
              done
            done
          fi
          echo "$RUNNER_TEMP/ctxpipe-zoekt" >> "$GITHUB_PATH"
      - name: Migrate backend schema
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/ctxpipe
          DATABASE_APP_PASSWORD: ctxpipe
        working-directory: apps/backend
        run: |
          pnpm exec tsx src/db/migrate.ts
      - uses: ./.github/actions/setup-buildx
      # This job reads the layer cache without a login. The layer-cache job
      # writes it (see the comment there).
      - name: Required chat sandbox image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: scripts/chat-sandbox
          tags: ctxpipe-chat-sandbox:opencode-1.18.34-r4
          load: true
          cache-from: type=registry,ref=ghcr.io/ctxpipe-ai/ci-cache:chat-sandbox
      - name: Required ${{ matrix.lane }} tests
        if: matrix.lane != 'selected'
        env:
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
          EVENT: ${{ github.event_name }}
        # The trace (scripts/checks/README.md) is data only; PR runs skip it.
        run: |
          node scripts/ci/test-suite.mjs ${{ matrix.lane }} --shard=${{ matrix.shard }}/${{ matrix.count }} \
            $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      - name: Selected tests (merge gate)
        if: matrix.lane == 'selected'
        env:
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
          PLAN: ${{ toJSON(matrix.plan) }}
        run: node scripts/checks/selected.mjs .ci-results/selected
      - name: FalkorDB diagnostics
        if: failure()
        continue-on-error: true
        run: |
          # Record the thread stacks only when the server does not answer.
          # The action already did this if FalkorDB never became healthy.
          if timeout 5 docker exec falkordb redis-cli PING; then
            echo "FalkorDB answers"
          else
            bash .github/actions/falkordb/diagnose.sh
          fi
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      - name: Run the failed checks again
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 20
        env:
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
        run: node scripts/checks/rerun-failed.mjs .ci-results
      - name: Preserve shard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.lane }}-${{ matrix.shard }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error

  package-tests:
    timeout-minutes: 30
    name: UI, CLI and CDK tests
    # The nightly run (schedule) also runs the tests, to record the trace of main.
    needs: merge-gate-plan
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.package-tests != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: UI tests
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: node scripts/ci/test-suite.mjs ui $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      - name: CLI tests
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: node scripts/ci/test-suite.mjs cli $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      - name: CDK tests
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: node scripts/ci/test-suite.mjs aws-cdk $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      - name: Selected UI, CLI and CDK tests (merge gate)
        if: needs.merge-gate-plan.outputs.mode == 'gate'
        env:
          PLAN: ${{ needs.merge-gate-plan.outputs.package-tests }}
        run: node scripts/checks/selected.mjs .ci-results/selected
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      - name: Run the failed checks again
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/checks/rerun-failed.mjs .ci-results
      - name: Preserve package test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-packages
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error

  test:
    timeout-minutes: 10
    # Keeps the single "Tests" check: it passes only when every shard and
    # package job passed and the shard union matches each full inventory.
    name: Tests
    # A gated run has no full inventory: the merge gate is its check.
    needs: [merge-gate-plan, test-shards, package-tests]
    if: |
      always() && (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      needs.merge-gate-plan.outputs.mode != 'gate'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Require every test job
        env:
          SHARDS: ${{ needs.test-shards.result }}
          PACKAGES: ${{ needs.package-tests.result }}
        run: |
          [ "$SHARDS" = success ] && [ "$PACKAGES" = success ] || {
            echo "Test shards: $SHARDS; package tests: $PACKAGES"
            exit 1
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-results-*
          path: .ci-results/
          merge-multiple: true
      - name: Check the union of the backend shards
        run: node scripts/ci/test-suite.mjs backend --merge
      - name: Check the union of the contract shards
        run: node scripts/ci/test-suite.mjs contracts --merge
      - name: Preserve executed test inventories and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: required-test-results
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: error

  # One trace of a traced run, named by its commit, for `factory check`
  # (scripts/checks/README.md). It is data only, so this job is not required
  # and a failure here fails no check.
  trace:
    timeout-minutes: 10
    name: Trace
    needs:
      [
        test-shards,
        package-tests,
        codesearch,
        vercel-sandbox,
        storybook-plays,
        upgrade-from-previous-release,
        project-checks,
      ]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-results-*
          path: .ci-results/
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: lane-trace-*
          path: .ci-results/trace-parts/
      - name: Merge the traces
        run: |
          find .ci-results -name trace.json.gz -print0 | sort -z |
            xargs -0 node scripts/checks/trace.mjs merge "$RUNNER_TEMP/trace.json.gz"
      - name: Preserve the trace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trace-${{ github.sha }}
          path: ${{ runner.temp }}/trace.json.gz
          if-no-files-found: error

  # The time of each project check (typecheck, lint, policy) for the trace
  # (scripts/checks/README.md). The lint and typecheck jobs gate the change;
  # this job is data only and runs only on a traced run.
  project-checks:
    timeout-minutes: 45
    name: Project check times
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Project checks through the check runner
        run: |
          set -o pipefail
          # A check with cacheable false reads outside state (Terraform, Docker, a
          # PR deploy) that this job lacks, and its time is not the job's purpose.
          pnpm -s checks:list |
            jq -r '.checks[] | select((.family == "typecheck" or .family == "lint" or .family == "policy") and .cacheable != false) | .id' \
            > "$RUNNER_TEMP/project-checks.txt"
          mkdir -p "$RUNNER_TEMP/project-trace"
          # The result records also go to the Results writer.
          node scripts/checks/run.mjs --trace "$RUNNER_TEMP/project-trace" "$RUNNER_TEMP/project-checks.txt" |
            tee "$RUNNER_TEMP/project-trace/records.ndjson"
      - name: Preserve the project check trace and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-trace-projects
          path: |
            ${{ runner.temp }}/project-trace/trace.json.gz
            ${{ runner.temp }}/project-trace/records.ndjson
          if-no-files-found: ignore

  production-builds:
    timeout-minutes: 45
    name: Production build (${{ matrix.name }})
    # In gate mode it builds only the selected images. A person asks for
    # every build with Run workflow (workflow_dispatch) on the PR branch.
    needs: merge-gate-plan
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.production-builds != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # Each entry is the check `build:image-<name>:` of the manifest
        # (scripts/checks/projects.mjs). The merge gate takes the result of
        # the job `Production build (<name>)` as the check result, so this
        # job needs no workspace install. deploy.yaml publishes the
        # chat-sandbox image for arm64 (the AWS sandbox host is Graviton). No
        # other job builds it for arm64 before release. In gate mode the plan
        # job gives the entries of the selected images (plan.mjs keeps the
        # same options).
        include: >-
          ${{ fromJSON(needs.merge-gate-plan.outputs.production-builds || '[
          {"name": "backend", "dockerfile": "apps/backend/Dockerfile"},
          {"name": "worker", "dockerfile": "apps/backend/Dockerfile.worker"},
          {"name": "ui", "dockerfile": "apps/ui/Dockerfile"},
          {"name": "codesearch", "dockerfile": "apps/codesearch/Dockerfile"},
          {"name": "docs", "dockerfile": "apps/docs/Dockerfile"},
          {"name": "chat-sandbox", "dockerfile": "scripts/chat-sandbox/Dockerfile",
          "context": "scripts/chat-sandbox", "platforms": "linux/arm64"}
          ]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: matrix.platforms == 'linux/arm64'
        with:
          platforms: arm64
      - uses: ./.github/actions/setup-buildx
      # Only codesearch reads a layer cache: its toolchain stages are the slow
      # part. This job reads it without a login. The layer-cache job writes it
      # (see the comment there).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          cache-from: ${{ matrix.name == 'codesearch' && 'type=registry,ref=ghcr.io/ctxpipe-ai/ci-cache:production-codesearch' || '' }}

  # Writes the Docker layer caches that test-shards (chat sandbox) and
  # production-builds (codesearch) read.
  # - The cache is in GHCR, not in the GHA cache. The GHA cache evicts layer
  #   blobs while their manifest stays, and BuildKit then fails the build with
  #   "BlobNotFound". GHCR keeps each blob until someone deletes its version.
  # - Do not delete versions of ghcr.io/ctxpipe-ai/ci-cache that are newer than
  #   one day: an import fails when a blob under a live manifest is missing.
  # - The package is public, so each reader imports it without a login, and a
  #   job that runs dependency code holds no token that can write packages.
  # - All branches share one tag. Thus only main writes it: a push to main
  #   (merged, reviewed code) or a dispatch on main. Other branches only read.
  # - This job runs no repository code on the runner: the checkout has no
  #   credentials, and each action is pinned to a commit. The BuildKit image
  #   that setup-buildx pulls is not pinned. BuildKit runs the Dockerfile
  #   steps in containers that do not see the registry login.
  # - The cache is best effort: an export error or a failed job is a miss on
  #   the next run, not a failure.
  layer-cache:
    timeout-minutes: 45
    name: Layer cache (${{ matrix.name }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chat-sandbox
            context: scripts/chat-sandbox
            dockerfile: scripts/chat-sandbox/Dockerfile
            cache: ghcr.io/ctxpipe-ai/ci-cache:chat-sandbox
          - name: codesearch
            context: .
            dockerfile: apps/codesearch/Dockerfile
            cache: ghcr.io/ctxpipe-ai/ci-cache:production-codesearch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=registry,ref=${{ matrix.cache }}
          cache-to: type=registry,ref=${{ matrix.cache }},mode=max,ignore-error=true

  packages:
    timeout-minutes: 20
    name: Runnable packages and examples
    needs: merge-gate-plan
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.packages != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      # Each package build is one check of the manifest. The record goes to
      # the merge gate.
      - name: Build the packages through the check runner
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        run: |
          set -o pipefail
          mkdir -p .ci-results/build-packages
          pnpm -s checks:list |
            jq -r '.checks[] | select(.family == "build" and (.lane | startswith("package-"))) | .id' |
            pnpm -s checks:run | tee .ci-results/build-packages/records.ndjson
      - name: Show the build log
        if: failure()
        run: cat .ci-results/checks/*.log
      - run: pnpm --filter @ctxpipe/aws-cdk-self-host typecheck
        if: needs.merge-gate-plan.outputs.mode != 'gate'
      - name: Selected builds (merge gate)
        if: needs.merge-gate-plan.outputs.mode == 'gate'
        env:
          PLAN: ${{ needs.merge-gate-plan.outputs.packages }}
        run: node scripts/checks/selected.mjs .ci-results/build-packages
      - name: Preserve the build results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-build-packages
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore

  storybook-build:
    timeout-minutes: 20
    name: Storybook build
    needs: merge-gate-plan
    # The nightly run (schedule) also plays the stories, to record the trace.
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.storybook-build != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ctxpipe/ui build-storybook
      - name: Preserve the Storybook build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-static
          path: apps/ui/storybook-static
          if-no-files-found: error

  storybook-golden:
    timeout-minutes: 30
    name: Storybook Playwright golden journey
    # In gate mode the Storybook plays shards run each selected story, the
    # golden ones too.
    needs: [merge-gate-plan, storybook-build]
    if: |
      !cancelled() && needs.storybook-build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      needs.merge-gate-plan.outputs.mode != 'gate'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Storybook Playwright
        working-directory: apps/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Download the Storybook build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-static
          path: apps/ui/storybook-static
      - name: Required Storybook golden plays
        env:
          SKIP_STORYBOOK_BUILD: "1"
        run: node scripts/ci/storybook-golden.mjs
      - name: Preserve golden play results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-golden-results
          path: .ci-results/storybook-golden/
          include-hidden-files: true
          if-no-files-found: error

  storybook-plays:
    timeout-minutes: 45
    name: Storybook Playwright all plays (${{ matrix.shard }}/${{ matrix.count }})
    needs: [merge-gate-plan, storybook-build]
    # The nightly run (schedule) also plays the stories, to record the trace.
    if: |
      !cancelled() && needs.storybook-build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.storybook-plays != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # In gate mode the plan job gives the shards of the selected stories.
        include: >-
          ${{ fromJSON(needs.merge-gate-plan.outputs.storybook-plays || '[
          {"shard": 1, "count": 4}, {"shard": 2, "count": 4},
          {"shard": 3, "count": 4}, {"shard": 4, "count": 4}
          ]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Storybook Playwright
        working-directory: apps/ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Download the Storybook build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-static
          path: apps/ui/storybook-static
      - name: Every Storybook story with a play function
        if: matrix.lane != 'selected'
        env:
          SKIP_STORYBOOK_BUILD: "1"
          STORYBOOK_PLAYS: all
          STORYBOOK_SHARD: ${{ matrix.shard }}/${{ matrix.count }}
          EVENT: ${{ github.event_name }}
        # The trace (scripts/checks/README.md) is data only; PR runs skip it.
        run: |
          node scripts/ci/storybook-golden.mjs \
            $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace)
      - name: Selected stories (merge gate)
        if: matrix.lane == 'selected'
        env:
          SKIP_STORYBOOK_BUILD: "1"
          PLAN: ${{ toJSON(matrix.plan) }}
        run: node scripts/checks/selected.mjs .ci-results/storybook-plays
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      - name: Run the failed checks again
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 20
        env:
          SKIP_STORYBOOK_BUILD: "1"
        run: node scripts/checks/rerun-failed.mjs .ci-results/storybook-plays
      - name: Preserve play results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-plays-results-${{ matrix.shard }}
          path: .ci-results/storybook-plays/
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve the Storybook trace
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-trace-storybook-${{ matrix.shard }}
          path: .ci-results/storybook-plays/trace.json.gz
          if-no-files-found: ignore

  codesearch:
    timeout-minutes: 30
    name: Codesearch real toolchain contracts
    # The nightly run (schedule) also runs the tests, to record the trace of main.
    # In gate mode the whole job runs when the plan selects one of its checks:
    # one image build serves all of them.
    needs: merge-gate-plan
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.codesearch != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      # The download script must fail fast when its source stalls.
      - name: Download script timeout proof
        run: node --test apps/codesearch/scripts/fetch-releases.test.mjs
      - name: Restore pinned release files
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .release-cache
          key: codesearch-releases-${{ hashFiles('apps/codesearch/release-assets.txt') }}
      # Fills the cache with checksum-verified files. When GitHub stays down,
      # this step fails in minutes with "Outside service unavailable".
      - name: Download pinned release files
        timeout-minutes: 10
        run: bash apps/codesearch/scripts/fetch-releases.sh apps/codesearch/release-assets.txt "$RUNNER_TEMP/releases" .release-cache
      # The trace (scripts/checks/README.md) is data only; PR runs skip it.
      # The result records go to the merge gate and the Results writer.
      - name: Required codesearch tests
        env:
          EVENT: ${{ github.event_name }}
        run: |
          bash apps/codesearch/scripts/run-vitest-docker.sh --records .ci-results/codesearch \
            $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace "$RUNNER_TEMP/codesearch-trace")
      - name: Preserve the codesearch results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-codesearch
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Preserve the codesearch trace
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-trace-codesearch
          path: ${{ runner.temp }}/codesearch-trace/trace.json.gz
          if-no-files-found: ignore

  vercel-sandbox:
    timeout-minutes: 30
    name: Hosted sandbox (Vercel) contracts
    needs: merge-gate-plan
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.vercel-sandbox != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The workbench VERCEL_ACCESS_TOKEN is a test-scoped value for the
    # preview Vercel project, never production.
    environment: workbench
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: ctxpipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d ctxpipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
      # Stands in for a minted Workspace read token in the firewall contract.
      GITHUB_TOKEN: ${{ github.token }}
      VERCEL_TEAM: ctxpipe
      VERCEL_PROJECT: ctxpipe-previews
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate backend schema
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/ctxpipe
          DATABASE_APP_PASSWORD: ctxpipe
        working-directory: apps/backend
        run: |
          pnpm exec tsx src/db/migrate.ts
      # The nightly run does not start this job (it needs the workbench
      # environment), so only a workflow_dispatch run traces it.
      - name: Required real Vercel sandbox contracts
        if: needs.merge-gate-plan.outputs.mode != 'gate'
        env:
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
          VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: node scripts/ci/test-suite.mjs vercel $([ "$EVENT" = workflow_dispatch ] && echo --trace)
      - name: Selected Vercel sandbox contracts (merge gate)
        if: needs.merge-gate-plan.outputs.mode == 'gate'
        env:
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
          VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          PLAN: ${{ needs.merge-gate-plan.outputs.vercel-sandbox }}
        run: node scripts/checks/selected.mjs .ci-results/vercel
      - name: Preserve the Vercel results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-vercel
          # The Trace job reads the Vercel trace from lane-trace-vercel.
          path: |
            .ci-results/
            !.ci-results/**/trace.json.gz
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Preserve the Vercel trace
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-trace-vercel
          path: .ci-results/vercel/trace.json.gz
          if-no-files-found: ignore

  terraform-validate:
    timeout-minutes: 10
    name: Terraform configuration
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.7
      # Providers download from GitHub releases, which can answer 500. The
      # cache keeps the locked providers, so most runs do not download.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: terraform-providers-${{ hashFiles('infra/.terraform.lock.hcl') }}
      - name: Validate without remote state or account credentials
        working-directory: infra
        env:
          TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for delay in 0 15 60; do
            sleep "$delay"
            terraform init -backend=false -input=false && break
            [ "$delay" = 60 ] && {
              echo "::error::Outside service unavailable: the Terraform provider download failed 3 times"
              exit 1
            }
          done
          terraform validate -no-color

  migrate:
    timeout-minutes: 20
    name: Migrations (fresh schema)
    if: |
      github.event_name == 'workflow_dispatch' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        # Matches local Compose (pgvector); plain postgres:16 lacks the vector extension.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/postgres
        run: bash scripts/ci-migrate.sh
      - name: Isolation tests as ctxpipe_app
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/ctxpipe_migrate_fresh
          DATABASE_APP_PASSWORD: ctxpipe
        working-directory: apps/backend
        run: |
          # The one migrate entry point on a database that drizzle-kit migrated.
          pnpm exec tsx src/db/migrate.ts
          DATABASE_URL=postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe_migrate_fresh \
            pnpm exec vitest run src/db/rls-isolation.test.ts

  upgrade-from-previous-release:
    # The minor upgrade promise (CTX-748): a database of the previous release,
    # migrated and seeded by that release, upgrades with the one migrate entry
    # point; its Workspace upgrade waits for an admin and lands in one pull
    # request; and the code of the previous release still reads the database
    # after the upgrade (rollback).
    name: Upgrade from the previous release
    timeout-minutes: 15
    # The nightly run (schedule) also runs it, to record its time and trace.
    # In gate mode the whole job runs when the plan selects one of its checks.
    needs: merge-gate-plan
    if: |
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      ((github.event_name == 'pull_request') !=
      (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))) &&
      (needs.merge-gate-plan.outputs.mode != 'gate' || needs.merge-gate-plan.outputs.upgrade-from-previous-release != '')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/falkordb
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Checkout of the previous release with its dependencies
        env:
          # The release that operators run now, not main. Main holds the new
          # code. Move this to the newest release tag when the next release
          # changes the upgrade path.
          PREVIOUS_RELEASE_REF: "@ctxpipe/aws-cdk@3.2.0"
        run: |
          git worktree add --detach "$RUNNER_TEMP/previous-release" "$PREVIOUS_RELEASE_REF"
          cd "$RUNNER_TEMP/previous-release"
          pnpm install --frozen-lockfile --filter "@ctxpipe/backend..."
      - name: Restore native revision index tools
        id: zoekt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ctxpipe-zoekt
          key: zoekt-${{ runner.os }}-${{ runner.arch }}-go1.25.12-596c362fcf1388fe0082acfcfc80c4d172efb7c1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.zoekt.outputs.cache-hit != 'true'
        with:
          go-version: 1.25.12
          cache: false
      - name: Required native revision index tools
        run: |
          npm install --global @ast-grep/cli@0.45.0
          if [ ! -x "$RUNNER_TEMP/ctxpipe-zoekt/zoekt-webserver" ]; then
            mkdir -p "$RUNNER_TEMP/ctxpipe-zoekt"
            for tool in zoekt-index zoekt-webserver; do
              n=0
              until GOBIN="$RUNNER_TEMP/ctxpipe-zoekt" go install \
                "github.com/sourcegraph/zoekt/cmd/${tool}@596c362fcf1388fe0082acfcfc80c4d172efb7c1"
              do
                n=$((n + 1))
                [ "$n" -lt 4 ] || exit 1
                sleep $((n * 4))
              done
            done
          fi
          echo "$RUNNER_TEMP/ctxpipe-zoekt" >> "$GITHUB_PATH"
      - name: Upgrade a database of the previous release and Workspace, then read it with the previous release
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/postgres
          DATABASE_APP_PASSWORD: ctxpipe
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          EVENT: ${{ github.event_name }}
        # The check runner verifies the prerequisites, and writes the Vitest
        # output to .ci-results/checks/upgrade.log (the next step prints it).
        # The result records go to the merge gate and the Results writer.
        run: |
          set -o pipefail
          ids="$(node scripts/checks/list.mjs |
            jq -r '.checks[] | select(.family == "vitest" and .lane == "upgrade") | .id')"
          if [ -z "$ids" ]; then
            echo "::error::The check list has no check in the upgrade lane"
            exit 1
          fi
          mkdir -p .ci-results/upgrade
          printf '%s\n' "$ids" |
            RELEASE_TREE="$RUNNER_TEMP/previous-release" node scripts/checks/run.mjs \
              $([ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] && echo --trace "$RUNNER_TEMP/upgrade-trace") |
            tee .ci-results/upgrade/records.ndjson
      - name: Upgrade test output
        if: always()
        run: cat .ci-results/checks/upgrade.log || true
      # The Results writer quarantines a key only when its check fails again
      # in this one rerun through the public runner (scripts/checks/README.md).
      - name: Run the failed checks again
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        timeout-minutes: 20
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/postgres
          DATABASE_APP_PASSWORD: ctxpipe
          GRAPH_DB_URI: redis://127.0.0.1:6379
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          RELEASE_TREE: ${{ runner.temp }}/previous-release
        run: node scripts/checks/rerun-failed.mjs .ci-results
      - name: Preserve the upgrade results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-upgrade
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Preserve the upgrade trace
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lane-trace-upgrade
          path: ${{ runner.temp }}/upgrade-trace/trace.json.gz
          if-no-files-found: ignore
      - name: FalkorDB diagnostics
        if: failure()
        continue-on-error: true
        run: |
          # Record the thread stacks only when the server does not answer.
          # The action already did this if FalkorDB never became healthy.
          if timeout 5 docker exec falkordb redis-cli PING; then
            echo "FalkorDB answers"
          else
            bash .github/actions/falkordb/diagnose.sh
          fi

  # The merge gate (scripts/checks/README.md, Merge gate) in shadow mode: the
  # full run gates, and these jobs publish beside it what a gated run would
  # decide. They never fail or hold up a gating job: each one continues on
  # error, and no gating job needs them. .github/merge-gate.json pins the
  # selector and the mode.
  #
  # The manifest job holds no credential. It decides the mode with the public
  # rules (gate.mjs mode), and records the manifest and the toolchain for the
  # select job and for the nightly Results writer. It has the setup of the
  # test jobs (Node, pnpm, Bun) and sets none of the lane variables, so its
  # toolchain record is theirs.
  merge-gate-manifest:
    timeout-minutes: 10
    name: Merge gate manifest
    if: |
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.actor != 'cursor[bot]' && github.actor != 'cursoragent')
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/merge-gate"
          : > "$RUNNER_TEMP/changed.txt"
          # A pull_request run checks out the merge revision; its first
          # parent is main.
          if [ "$EVENT" = pull_request ]; then
            git diff-tree -r --no-commit-id --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          fi
          node scripts/checks/gate.mjs mode --config .github/merge-gate.json \
            --event "$EVENT" --fork "$FORK" --changed "$RUNNER_TEMP/changed.txt" \
            > "$RUNNER_TEMP/merge-gate/mode.json"
          cat "$RUNNER_TEMP/merge-gate/mode.json"
          echo "mode=$(jq -r .mode "$RUNNER_TEMP/merge-gate/mode.json")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
      - name: Manifest and toolchain
        if: steps.mode.outputs.mode == 'select' || github.event_name != 'pull_request'
        run: |
          pnpm -s checks:list > "$RUNNER_TEMP/merge-gate/manifest.json"
          node scripts/checks/toolchain.mjs "$RUNNER_TEMP/merge-gate/manifest.json" \
            > "$RUNNER_TEMP/merge-gate/toolchain.json"
      - name: Preserve the merge gate inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/merge-gate/
          if-no-files-found: ignore

  # Selects the checks of a same-repo PR and looks up their stored results.
  # It holds a read-only OIDC role of the factory account, which trusts only
  # the pull_request subject; a fork PR gets no OIDC token. It runs no package
  # manager, no local action and no repository script, and each action is
  # pinned by commit. It reads the manifest and the toolchain only as data.
  # It downloads the release that .github/merge-gate.json pins, and stops when
  # the SHA-256 differs.
  merge-gate-select:
    timeout-minutes: 5
    name: Merge gate selection
    needs: merge-gate-manifest
    if: needs.merge-gate-manifest.outputs.mode == 'select'
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Each step writes out/select-cause.txt before a part that can fail, so
      # a failed job tells the decision why: the inputs, the role, the
      # download, the hash, the exit code of the selector, or a timeout.
      - name: Start the cause record
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "the inputs of the manifest job did not download" > "$RUNNER_TEMP/out/select-cause.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/inputs
      - name: Next cause
        run: echo "the read-only role of the result store was not assumed" > "$RUNNER_TEMP/out/select-cause.txt"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::134416647419:role/check-results-gate-reader
          aws-region: us-west-2
      - name: Selector release, checked against the pin
        run: |
          cause="$RUNNER_TEMP/out/select-cause.txt"
          version="$(jq -er .factory.version .github/merge-gate.json)"
          sha256="$(jq -er .factory.sha256 .github/merge-gate.json)"
          echo "the download of the selector release $version failed" > "$cause"
          aws s3api get-object --bucket ctxpipe-factory-check-results-134416647419 \
            --expected-bucket-owner 134416647419 \
            --key "releases/factory/$version/factory-linux-x64.tar.gz" \
            "$RUNNER_TEMP/factory.tar.gz" > /dev/null
          echo "the selector release does not match the pinned SHA-256" > "$cause"
          echo "$sha256  $RUNNER_TEMP/factory.tar.gz" | sha256sum --check --strict
          echo "the selector release did not unpack" > "$cause"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/factory.tar.gz" -C "$RUNNER_TEMP/bin" factory
      # The LLM job runs the same release with the model key; it gets the
      # release from this job, because only this job holds the role.
      - name: Keep the selector release for the LLM job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-release
          path: ${{ runner.temp }}/factory.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Select and look up the cache (variant B, k = 3, no model step)
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          out="$RUNNER_TEMP/out"
          echo "the selector did not finish in 3 minutes" > "$out/select-cause.txt"
          # The newest nightly trace of main. Without one, the selector uses
          # variant A and says so in a note.
          "$RUNNER_TEMP/bin/factory" trace fetch --repo . || echo "No trace: variant A"
          code=0
          "$RUNNER_TEMP/bin/factory" check --repo . --base HEAD^1 --k 3 \
            --manifest "$RUNNER_TEMP/inputs/manifest.json" \
            --toolchain "$RUNNER_TEMP/inputs/toolchain.json" \
            --include-stochastic --cache-only --json > "$RUNNER_TEMP/raw.json" || code=$?
          # 0: every selected check is a hit. 1: a check must run. 2: the
          # selection failed.
          if [ "$code" -gt 1 ]; then
            echo "the selector failed with exit code $code" > "$out/select-cause.txt"
            exit 1
          fi
          # The record is public: it keeps no self-reported writer of a hit.
          # The raw output stays outside the uploaded directory.
          echo "the selection record did not parse" > "$out/select-cause.txt"
          head -n 1 "$RUNNER_TEMP/raw.json" | jq -c 'del(.cache.hits[]?.provenance.who)' > "$RUNNER_TEMP/selection.json"
          mv "$RUNNER_TEMP/selection.json" "$out/selection.json"
          rm "$out/select-cause.txt"
          find "$XDG_CACHE_HOME/factory/traces" -name '*.json.gz' -exec cp {} "$out/trace.json.gz" \; -quit || true
      - name: Preserve the selection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-selection
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

  # The LLM stage of the selection (`factory check --llm-select`, Claude
  # Haiku 5.5 through OpenRouter) for the select job's run. It holds the
  # model key of the workbench environment and no cloud role. It runs only
  # the selector release of the select job, after it checks the pinned
  # SHA-256 again, on a checkout without credentials. It runs no package
  # manager and no repository script. It makes no cache lookup (the select
  # job did that), so a check that only it selects runs. When it fails, the
  # deterministic selection of the select job stays, and the plan says why.
  merge-gate-llm:
    timeout-minutes: 5
    name: Merge gate LLM selection
    needs: merge-gate-select
    if: needs.merge-gate-select.result == 'success'
    continue-on-error: true
    environment: workbench
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start the cause record
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          echo "the inputs of the select job did not download" > "$RUNNER_TEMP/out/llm-cause.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: merge-gate-selection
          path: ${{ runner.temp }}/selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: factory-release
          path: ${{ runner.temp }}/release
      - name: Selector release, checked against the pin
        run: |
          echo "the selector release does not match the pinned SHA-256" > "$RUNNER_TEMP/out/llm-cause.txt"
          sha256="$(jq -er .factory.sha256 .github/merge-gate.json)"
          echo "$sha256  $RUNNER_TEMP/release/factory.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/release/factory.tar.gz" -C "$RUNNER_TEMP/bin" factory
      - name: Select with the LLM stage
        timeout-minutes: 3
        env:
          OPENROUTER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          out="$RUNNER_TEMP/out"
          echo "the selector did not finish in 3 minutes" > "$out/llm-cause.txt"
          trace=()
          [ ! -f "$RUNNER_TEMP/selection/trace.json.gz" ] || trace=(--trace "$RUNNER_TEMP/selection/trace.json.gz")
          code=0
          "$RUNNER_TEMP/bin/factory" check --repo . --base HEAD^1 --k 3 \
            --manifest "$RUNNER_TEMP/inputs/manifest.json" "${trace[@]}" \
            --include-stochastic --llm-select --llm-provider openrouter \
            --dry-run --json > "$RUNNER_TEMP/raw.json" || code=$?
          if [ "$code" -gt 1 ]; then
            echo "the selector failed with exit code $code" > "$out/llm-cause.txt"
            exit 1
          fi
          # The audit field is a path on this runner.
          echo "the selection record did not parse" > "$out/llm-cause.txt"
          head -n 1 "$RUNNER_TEMP/raw.json" | jq -c 'del(.llm.audit)' > "$RUNNER_TEMP/llm-selection.json"
          mv "$RUNNER_TEMP/llm-selection.json" "$out/llm-selection.json"
          rm "$out/llm-cause.txt"
          jq -c '.llm | {fallback, cached, latencyMs, usage, kept: (.kept | length), dropped: (.dropped | length), added: (.added | length)}' "$out/llm-selection.json"
      - name: Preserve the LLM selection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-llm
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore

  # The plan of a PR run (gate.mjs plan): in gate mode, the checks that each
  # job runs, and the stored passes that the other selected checks reuse (the
  # `ci` and `agent` classes from the select job, the `pr` class from the PR
  # store). A job of the plan output starts; another check job does not. In
  # shadow mode, on a fork PR, or when the selector failed, the plan says
  # full and every job runs. It runs only the public gate.mjs, with no
  # package and no credential. The PR store is in the GitHub Actions cache of
  # the PR: only a run of this PR writes there (the merge gate job).
  merge-gate-plan:
    timeout-minutes: 5
    name: Merge gate plan
    needs: [merge-gate-manifest, merge-gate-select, merge-gate-llm]
    if: |
      !cancelled() && github.event_name == 'pull_request' &&
      github.actor != 'cursor[bot]' && github.actor != 'cursoragent'
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      config: ${{ steps.plan.outputs.config }}
      deploy: ${{ steps.plan.outputs.deploy }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      test-shards: ${{ steps.plan.outputs.test-shards }}
      package-tests: ${{ steps.plan.outputs.package-tests }}
      production-builds: ${{ steps.plan.outputs.production-builds }}
      packages: ${{ steps.plan.outputs.packages }}
      storybook-build: ${{ steps.plan.outputs.storybook-build }}
      storybook-plays: ${{ steps.plan.outputs.storybook-plays }}
      codesearch: ${{ steps.plan.outputs.codesearch }}
      vercel-sandbox: ${{ steps.plan.outputs.vercel-sandbox }}
      upgrade-from-previous-release: ${{ steps.plan.outputs.upgrade-from-previous-release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: merge-gate-*
          path: ${{ runner.temp }}/inputs
          merge-multiple: true
      - name: Restore the PR store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .merge-gate-store
          key: merge-gate-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            merge-gate-pr-${{ github.event.pull_request.number }}-
      - name: Plan
        id: plan
        env:
          NEEDS: ${{ toJSON(needs) }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          node scripts/checks/gate.mjs plan --config .github/merge-gate.json \
            --inputs "$RUNNER_TEMP/inputs" --needs "$RUNNER_TEMP/needs.json" \
            --store .merge-gate-store/store.json --fork "$FORK" \
            --out "$RUNNER_TEMP/plan" --github-output "$GITHUB_OUTPUT"
      - name: Preserve the plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-plan
          path: ${{ runner.temp }}/plan/plan.json
          if-no-files-found: ignore

  # In gate mode PR Deploy does not start on a push: this job starts it when
  # the plan selects a deploy check, or when the run is full. A person can
  # start it with Run workflow on the PR branch. It runs no repository code.
  merge-gate-deploy:
    timeout-minutes: 5
    name: Merge gate starts PR Deploy
    needs: merge-gate-plan
    if: |
      !cancelled() && needs.merge-gate-plan.outputs.deploy == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: write
    steps:
      - name: Start PR Deploy on the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: gh workflow run pr-deploy.yaml --repo "$REPO" --ref "$BRANCH" -f pr_number="$PR"

  # Publishes the decision of each PR run: the job summary, the artifact
  # merge-gate-decision, and one PR comment that it updates. In gate mode
  # this job is the verdict: it fails when the gated run fails (or, on a
  # full run, when the full run fails), and it writes the passes of this run
  # to the PR store. In shadow mode the full run gates; this job computes
  # what a gated run would decide from the same results, and the agreement
  # record (scripts/checks/README.md). It runs only the public gate.mjs,
  # with no package.
  merge-gate:
    timeout-minutes: 10
    name: ${{ needs.merge-gate-plan.outputs.config == 'gate' && 'Merge gate' || 'Merge gate (shadow)' }}
    needs:
      [
        merge-gate-manifest,
        merge-gate-select,
        merge-gate-llm,
        merge-gate-plan,
        lint,
        typecheck,
        test-shards,
        package-tests,
        test,
        production-builds,
        packages,
        storybook-build,
        storybook-golden,
        storybook-plays,
        codesearch,
        vercel-sandbox,
        terraform-validate,
        migrate,
        upgrade-from-previous-release,
      ]
    if: |
      always() && github.event_name == 'pull_request' &&
      github.actor != 'cursor[bot]' && github.actor != 'cursoragent'
    continue-on-error: ${{ needs.merge-gate-plan.outputs.config != 'gate' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: merge-gate-*
          path: ${{ runner.temp }}/inputs
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: test-results-*
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          pattern: storybook-*-results*
          path: ${{ runner.temp }}/results
      - name: The jobs of this run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The jobs of the earlier attempts show the flakes: a job that failed
        # in an earlier attempt and passed in this one. The jobs of the newest
        # PR Deploy run of the PR head give the deploy checks their results.
        run: |
          gh api "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" --paginate \
            --jq '.jobs[]' | jq -s '{jobs: .}' > "$RUNNER_TEMP/jobs.json"
          for ((attempt = 1; attempt < ATTEMPT; attempt++)); do
            gh api "repos/$REPO/actions/runs/$RUN/attempts/$attempt/jobs?per_page=100" --paginate \
              --jq '.jobs[]'
          done | jq -s '{jobs: .}' > "$RUNNER_TEMP/earlier.json"
          # The newest PR Deploy run of the head whose deploy job did not
          # skip. A run that a newer push cancelled early has no deploy job.
          gh api "repos/$REPO/actions/workflows/pr-deploy.yaml/runs?head_sha=$HEAD_SHA&per_page=20" \
            --jq '.workflow_runs[] | [.id, .status] | @tsv' > "$RUNNER_TEMP/deploy-runs.tsv"
          echo '{"jobs": []}' > "$RUNNER_TEMP/deploy.json"
          while read -r id status; do
            gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --paginate \
              --jq '.jobs[]' | jq -s --arg status "$status" '{status: $status, jobs: .}' > "$RUNNER_TEMP/candidate.json"
            if [[ -z "$(jq -r '.jobs[] | select(.name == "Deploy PR environment (Railway + Neon)" and .conclusion != "skipped") | .name' "$RUNNER_TEMP/candidate.json")" ]]; then
              # Keep the first run as the answer if no run has a deploy job.
              [[ "$(jq '.jobs | length' "$RUNNER_TEMP/deploy.json")" == 0 ]] && cp "$RUNNER_TEMP/candidate.json" "$RUNNER_TEMP/deploy.json"
              continue
            fi
            cp "$RUNNER_TEMP/candidate.json" "$RUNNER_TEMP/deploy.json"
            break
          done < "$RUNNER_TEMP/deploy-runs.tsv"
      - name: Restore the PR store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .merge-gate-store
          key: merge-gate-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            merge-gate-pr-${{ github.event.pull_request.number }}-
      # In gate mode a failed verdict fails this step; the next steps still
      # publish the decision and keep the PR store.
      - name: Decision
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          code=0
          node scripts/checks/gate.mjs decide --config .github/merge-gate.json \
            --inputs "$RUNNER_TEMP/inputs" --results "$RUNNER_TEMP/results" \
            --needs "$RUNNER_TEMP/needs.json" --jobs "$RUNNER_TEMP/jobs.json" \
            --earlier "$RUNNER_TEMP/earlier.json" --deploy "$RUNNER_TEMP/deploy.json" \
            --store .merge-gate-store/store.json --out "$RUNNER_TEMP/decision" || code=$?
          cat "$RUNNER_TEMP/decision/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$code"
      - name: Keep the PR store
        id: store
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/decision/store.json" ] || exit 0
          mkdir -p .merge-gate-store
          cp "$RUNNER_TEMP/decision/store.json" .merge-gate-store/store.json
          echo "kept=true" >> "$GITHUB_OUTPUT"
      - name: Save the PR store
        if: always() && steps.store.outputs.kept == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .merge-gate-store
          key: merge-gate-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve the decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-gate-decision
          path: |
            ${{ runner.temp }}/decision/decision.json
            ${{ runner.temp }}/inputs/selection.json
          if-no-files-found: warn
      # A fork PR has a read-only token, so it gets only the summary.
      - name: Post or update the PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$(cat "$RUNNER_TEMP/decision/comment.md")"
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- merge-gate -->"))) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # The trusted writer of the result store, after a full run on main (the
  # nightly schedule, or a run by hand on main). It stores each pass as the CI
  # class, and audits each failed check against the passes that the store
  # holds for its key. A contradiction (a stored pass for a key that failed
  # tonight) fails this job: a key misses an input, the check is flaky, or a
  # writer stored a false pass. The test jobs run each failed check once more
  # (rerun.ndjson); only a check that fails again quarantines its key, and
  # each agent writer of a pass when the key has complete inputs, so that no
  # reader accepts them. A flake is reported, not quarantined. The output
  # names the check and the key, and a writer only by a hash. An S3 error in
  # the audit is an error annotation. The job never fails the run.
  # Its role trusts only repo:ctxpipe-ai/ctxpipe:ref:refs/heads/main: a job on
  # main without a GitHub environment. The npm publish jobs of deploy.yaml
  # (release, prerelease) get the same subject, so they can also get this
  # role. This is an accepted risk: each builds only code on main, and the
  # risk is that code and its dependencies (scripts/ci/check-secret-jobs.mjs).
  # This job runs no package manager and no repository script: the selector
  # computes each key itself from the clean checkout of the traced commit,
  # with the manifest, the toolchain and the trace of this run.
  results-writer:
    timeout-minutes: 15
    name: Results writer
    needs: [merge-gate-manifest, trace]
    if: |
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.merge-gate-manifest.result == 'success' && needs.trace.result == 'success'
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pinned selector release
        id: pin
        run: |
          if jq -e '.factory.version | test("^[0-9a-f]{40}$")' .github/merge-gate.json > /dev/null; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::.github/merge-gate.json pins no factory release, so the Results writer stores nothing."
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true'
        with:
          name: merge-gate-inputs
          path: ${{ runner.temp }}/inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true'
        with:
          name: trace-${{ github.sha }}
          path: ${{ runner.temp }}/trace
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true'
        with:
          pattern: test-results-*
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true'
        with:
          pattern: storybook-plays-results-*
          path: ${{ runner.temp }}/results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.pin.outputs.pinned == 'true'
        with:
          name: lane-trace-projects
          path: ${{ runner.temp }}/results/projects
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.pin.outputs.pinned == 'true'
        with:
          role-to-assume: arn:aws:iam::134416647419:role/check-results-ci-writer
          aws-region: us-west-2
      - name: Selector release, checked against the pin
        if: steps.pin.outputs.pinned == 'true'
        run: |
          version="$(jq -er .factory.version .github/merge-gate.json)"
          sha256="$(jq -er .factory.sha256 .github/merge-gate.json)"
          aws s3api get-object --bucket ctxpipe-factory-check-results-134416647419 \
            --expected-bucket-owner 134416647419 \
            --key "releases/factory/$version/factory-linux-x64.tar.gz" \
            "$RUNNER_TEMP/factory.tar.gz" > /dev/null
          echo "$sha256  $RUNNER_TEMP/factory.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/factory.tar.gz" -C "$RUNNER_TEMP/bin" factory
      - name: Store the passes and audit the failures
        if: steps.pin.outputs.pinned == 'true'
        run: |
          mapfile -d '' records < <(find "$RUNNER_TEMP/results" -name records.ndjson -print0 | sort -z)
          mapfile -d '' reruns < <(find "$RUNNER_TEMP/results" -name rerun.ndjson -print0 | sort -z)
          rerun_args=()
          if [ "${#reruns[@]}" -gt 0 ]; then rerun_args=(--reruns "${reruns[@]}"); fi
          code=0
          "$RUNNER_TEMP/bin/factory" store --repo . \
            --manifest "$RUNNER_TEMP/inputs/manifest.json" \
            --toolchain "$RUNNER_TEMP/inputs/toolchain.json" \
            --trace "$RUNNER_TEMP/trace/trace.json.gz" \
            --records "${records[@]}" \
            "${rerun_args[@]}" > "$RUNNER_TEMP/store.txt" 2>&1 || code=$?
          cat "$RUNNER_TEMP/store.txt"
          find "$RUNNER_TEMP/results" -name not-rerun.txt -print0 | sort -z |
            while IFS= read -r -d '' list; do
              {
                echo
                echo "Failed checks that the rerun skipped (limit of 50), so their keys are not confirmed:"
                cat -v "$list"
              } >> "$RUNNER_TEMP/store.txt"
            done
          if grep -q '^SUSPECT WRITER' "$RUNNER_TEMP/store.txt"; then
            hashes="$(grep -o '^SUSPECT WRITER sha256 [0-9a-f]*' "$RUNNER_TEMP/store.txt" | awk '{print $4}' | tr '\n' ' ')"
            echo "::error::Suspect agent writers (sha256 of the writer): ${hashes}. The run had an infrastructure fault or many confirmed failures, so no writer was quarantined. A person or the nightly agent reviews the markers under quarantine/suspect/."
          fi
          if grep -q '^AUDIT FAILED' "$RUNNER_TEMP/store.txt"; then
            echo "::error::The audit of the result store failed, so no key was quarantined. See the Results writer summary."
          fi
          {
            echo "## Results writer"
            echo
            echo '```'
            cat "$RUNNER_TEMP/store.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
