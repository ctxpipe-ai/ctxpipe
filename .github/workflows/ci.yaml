name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  # Cursor Cloud Agent pushes often skip pull_request synchronize. Push still
  # runs CI on every branch; concurrency cancels the duplicate when both fire.
  # branches must be listed (not only tags-ignore) or GitHub skips branch pushes.
  push:
    branches:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Backend Workspace typecheck
        run: bash scripts/typecheck-workspaces.sh
      - name: UI Workspace typecheck
        run: bash scripts/typecheck-ui-workspaces.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Backend tests
        env:
          AUTH_SECRET: ci-auth-secret-must-be-at-least-32-chars
          # Unit tests that call parseEnv(process.env) need a syntactically valid URL;
          # integration / MCP conformance suites are excluded from the default vitest run.
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@127.0.0.1:5432/ctxpipe
        run: pnpm --filter @ctxpipe/backend test
      - name: UI tests
        run: pnpm --filter @ctxpipe/ui test

  migrate:
    name: Migrations (fresh and previous schema)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches local Compose (pgvector); plain postgres:16 lacks the vector extension.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations from empty and from main
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/postgres
          MIGRATE_BASE_REF: origin/main
        run: bash scripts/ci-migrate.sh

  rls:
    name: RLS isolation (ctxpipe_app)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: ctxpipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d ctxpipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate as owner and provision ctxpipe_app
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/ctxpipe
          DATABASE_APP_PASSWORD: ctxpipe
        working-directory: apps/backend
        run: |
          pnpm exec drizzle-kit migrate
          pnpm exec tsx src/db/provision-app-role-cli.ts
      - name: Isolation tests as ctxpipe_app
        env:
          DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
        run: pnpm --filter @ctxpipe/backend test:rls
