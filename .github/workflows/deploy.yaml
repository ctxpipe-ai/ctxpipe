name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from (snapshot prerelease only)
        default: main
        type: string
      dist_tag:
        description: npm dist-tag for snapshot prerelease
        default: next
        type: choice
        options:
          - next
          - canary
          - beta
      # Off: the run publishes the snapshot prerelease only. On, from main:
      # the run builds every image and deploys production as a push to main
      # does, without the release job and the prerelease. On, from another
      # branch: no job runs.
      deploy:
        description: Build every image and deploy production (run from main)
        default: false
        type: boolean

concurrency:
  group: deploy-main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # The deploy runs on a push to main, and on a dispatch from main with the
  # input `deploy`. The jobs that hold production secrets (terraform,
  # forge_deploy) state this condition in their own `if:`
  # (scripts/ci/check-secret-jobs.mjs); each other job runs only after the
  # job before it succeeded.
  #
  # Decides which images this run builds (scripts/ci/deploy-images.mjs). On a
  # push, an image builds when one of its inputs changed since the commit of
  # the last successful deploy run on main. Each other image keeps the
  # multi-platform image that the base run published: publish_images gives
  # that digest the new tags. Every image builds on a dispatch, when no base
  # is found, when the base commit is not in the history of this commit, or
  # when this file or the plan changed. The job reads the base run only
  # through the GitHub API, as data.
  image_plan:
    timeout-minutes: 5
    name: Plan the image builds
    if: (github.event_name == 'push' || inputs.deploy && github.ref == 'refs/heads/main')
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      reuse: ${{ steps.plan.outputs.reuse }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      # The full history: the plan compares this commit with the base commit.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/deploy-images.mjs

  # Each image that the plan selects builds natively on an amd64 runner and on
  # an arm64 runner. QEMU is too slow for the codesearch toolchain. Each build
  # pushes its image by digest only. The publish_images job then joins the two
  # digests in one manifest list with the tags <sha> and latest. Railway pulls
  # the linux/amd64 image, and the AWS hosts (Graviton) pull the linux/arm64
  # image. Self-hosters can run either.
  build_images_amd64:
    timeout-minutes: 45
    name: Build image (${{ matrix.image }}, amd64)
    needs: image_plan
    if: needs.image_plan.outputs.build != '[]'
    # amd64: it builds the linux/amd64 image of each service natively.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    env:
      ARCH: amd64
    strategy:
      fail-fast: false
      matrix: &build_images
        include: ${{ fromJSON(needs.image_plan.outputs.build) }}
    steps: &build_image_steps
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@e4c1c000c95f9cc255f72940e9c56bcbd1239436 # v1

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ env.ARCH }}
          outputs: type=image,name=ghcr.io/ctxpipe-ai/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          echo "$DIGEST" > "$RUNNER_TEMP/digest/$ARCH"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.image }}-${{ env.ARCH }}
          path: ${{ runner.temp }}/digest/${{ env.ARCH }}
          if-no-files-found: error

  build_images_arm64:
    timeout-minutes: 45
    name: Build image (${{ matrix.image }}, arm64)
    needs: image_plan
    if: needs.image_plan.outputs.build != '[]'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    environment: production
    env:
      ARCH: arm64
    strategy:
      fail-fast: false
      matrix: *build_images
    steps: *build_image_steps

  # Tags each image of the plan with <sha> and latest: a built image as the
  # list of its two digests, and a reused image by the digest of the base run.
  # A copy of one list keeps its digest. Each job reports the digest that it
  # pushed as one `deploy-image` notice on its own check run: the plan of a
  # later run reads only that notice. The build jobs are skipped when the plan
  # builds no image, and a job after a skipped job runs only with a status
  # function. Thus this job and each job after it check the result of the job
  # before them, and do not run when a job before them failed or the run was
  # cancelled.
  publish_images:
    timeout-minutes: 10
    name: Publish image (${{ matrix.image }})
    if: ${{ !cancelled() && !failure() && needs.image_plan.result == 'success' }}
    needs:
      - image_plan
      - build_images_amd64
      - build_images_arm64
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # It only reads the digest artifacts of this run and writes manifests.
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image_plan.outputs.images) }}
    env:
      REUSE: ${{ fromJSON(needs.image_plan.outputs.reuse)[matrix.image] }}
    steps:
      # Each architecture by its exact name: a pattern such as
      # `digest-chat-sandbox-*` also matches `digest-chat-sandbox-agentcore-*`.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.REUSE == ''
        with:
          name: digest-${{ matrix.image }}-amd64
          path: ${{ runner.temp }}/digest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.REUSE == ''
        with:
          name: digest-${{ matrix.image }}-arm64
          path: ${{ runner.temp }}/digest

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform image
        env:
          NAME: ${{ matrix.image }}
          IMAGE: ghcr.io/ctxpipe-ai/${{ matrix.image }}
          INDEX: ${{ runner.temp }}/index/${{ matrix.image }}
        run: |
          set -o pipefail
          if [ -n "$REUSE" ]; then
            sources=("$IMAGE@$REUSE")
          else
            sources=("$IMAGE@$(cat "$RUNNER_TEMP/digest/amd64")" "$IMAGE@$(cat "$RUNNER_TEMP/digest/arm64")")
          fi
          docker buildx imagetools create --progress plain \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            "${sources[@]}" 2>&1 | tee "$RUNNER_TEMP/create.log"
          # The digest of the list that this job pushed, from the push and not
          # from a later read of the tag. copy_images_to_ecr copies it.
          mkdir -p "$(dirname "$INDEX")"
          grep -oE 'pushing sha256:[0-9a-f]{64} to ' "$RUNNER_TEMP/create.log" | sort -u | cut -d' ' -f2 > "$INDEX"
          [ "$(wc -l < "$INDEX")" -eq 1 ]
          if [ -n "$REUSE" ] && [ "$(cat "$INDEX")" != "$REUSE" ]; then
            echo "::error::The copy of $IMAGE@$REUSE pushed $(cat "$INDEX")" >&2
            exit 1
          fi
          docker buildx imagetools inspect "$IMAGE@$(cat "$INDEX")"
          echo "::notice title=deploy-image::$NAME $(cat "$INDEX")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: index-${{ matrix.image }}
          path: ${{ runner.temp }}/index/${{ matrix.image }}
          if-no-files-found: error

  # Gives copy_images_to_ecr the manifest-list digests that publish_images
  # pushed in this run. The copy job holds an AWS token, so it downloads no
  # artifact (check-secret-jobs). This job holds no token: it reads the
  # artifacts as data and lets only sha256 digests through. release and
  # terraform run pnpm install, so they wait for this job: while it reads the
  # artifacts, no job of the run that runs dependency code can upload one.
  ecr_digests:
    timeout-minutes: 5
    name: Digests for the production ECR
    if: ${{ !cancelled() && !failure() && needs.publish_images.result == 'success' }}
    needs:
      - publish_images
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.run_attempt == 1
        with:
          pattern: index-*
          path: ${{ runner.temp }}/index
          merge-multiple: true
      - id: digests
        run: |
          set -o pipefail
          # Only the first attempt reads the artifacts: in a later attempt,
          # dependency code of release or terraform from an earlier attempt
          # could have uploaded one. A rerun of only copy_images_to_ecr keeps
          # the outputs of the first attempt.
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::warning::attempt $GITHUB_RUN_ATTEMPT gives no digests, so this build is not copied to the ECR; the next main build copies its images"
            echo "digests={}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP/index"
          # The ECR repositories that exist (factory #99, ctxpipe/*). An image
          # without one is skipped with a notice: release and terraform wait
          # for this job, so a failure here would stop the Railway deploy.
          for image in *; do
            digest="$(cat "$image")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$image holds no image digest" >&2; exit 1; }
            if [[ ! "$image" =~ ^(backend|worker|ui|codesearch|chat-sandbox|chat-sandbox-agentcore)$ ]]; then
              echo "::notice::$image is not on the ECR list of this job; it is not copied" >&2
              continue
            fi
            echo "$image $digest"
          done | jq -Rcs 'split("\n") | map(select(. != "") | split(" ") | {(.[0]): .[1]}) | add // {}' | sed 's/^/digests=/' >> "$GITHUB_OUTPUT"

  # Copies each production image, and the upstream images that the hosted,
  # observability and preview stacks pin, to the ECR of their account
  # (CTX-1215 X2). crane copies the manifest list by digest, so the ECR
  # digest equals the source digest. It writes the per-platform images first
  # and the tagged list last, so the newest tagged image is always complete.
  # Each production push starts the factory digest workflow through
  # EventBridge; this repo holds no factory credential. Railway deploys from
  # GHCR (the terraform job) until the cutover, so no job waits for this one.
  copy_images_to_ecr:
    timeout-minutes: 15
    name: Copy images to the ECR
    if: ${{ !cancelled() && !failure() && needs.ecr_digests.result == 'success' }}
    needs:
      - ecr_digests
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # Only this job names the environment, and the environment admits only
    # main. The push roles trust only the OIDC subject of this environment,
    # so no other job of this repo can push to the ECR.
    environment: ecr-push
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      PRODUCTION_ECR: 213102790567.dkr.ecr.us-west-2.amazonaws.com
      PREVIEW_ECR: 573018602187.dkr.ecr.us-west-2.amazonaws.com
    steps:
      - name: Install crane
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/crane.tar.gz" \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_arm64.tar.gz
          echo "898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane

      # Each target has its own repository variable. A person sets it to
      # `enabled` after the push role of that account exists: aws-core makes
      # the production role, and factory previews/base makes the preview role.
      # Until then, the copy step only checks the sources of that target (a
      # dry run) and warns. With the variable set, a failed login or copy
      # fails the job: an ECR push starts deploys, so a failure must show.
      # The crane login keeps the registry token for the later steps, so the
      # next AWS login can replace the session.
      - if: vars.ECR_MIRROR == 'enabled'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::213102790567:role/ctxpipe/ctxpipe-ecr-push
          aws-region: us-west-2
      - if: vars.ECR_MIRROR == 'enabled'
        run: |
          set -o pipefail
          aws ecr get-login-password | "$RUNNER_TEMP/crane" auth login "$PRODUCTION_ECR" -u AWS --password-stdin

      - if: vars.ECR_MIRROR_PREVIEW == 'enabled'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::573018602187:role/ctxpipe/preview-mirror-push
          aws-region: us-west-2
      - if: vars.ECR_MIRROR_PREVIEW == 'enabled'
        run: |
          set -o pipefail
          aws ecr get-login-password | "$RUNNER_TEMP/crane" auth login "$PREVIEW_ECR" -u AWS --password-stdin

      - name: Copy the images by digest
        env:
          DIGESTS: ${{ needs.ecr_digests.outputs.digests }}
          GH_TOKEN: ${{ github.token }}
          PUSH_PRODUCTION: ${{ vars.ECR_MIRROR == 'enabled' }}
          PUSH_PREVIEW: ${{ vars.ECR_MIRROR_PREVIEW == 'enabled' }}
        run: |
          set -o pipefail
          # A late rerun of an older run must not make an older build the
          # newest tagged image, so each attempt checks the head of main.
          main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$main" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $main, not at $GITHUB_SHA: the run of that commit copies its images"
            exit 0
          fi
          crane="$RUNNER_TEMP/crane"
          echo "$GH_TOKEN" | "$crane" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          [ "$PUSH_PRODUCTION" = true ] || echo "::warning::The repository variable ECR_MIRROR is not enabled: a dry run checks the production sources and copies nothing."
          [ "$PUSH_PREVIEW" = true ] || echo "::warning::The repository variable ECR_MIRROR_PREVIEW is not enabled: a dry run checks the preview sources and copies nothing."
          # The tags are immutable. A rerun skips a tag that already holds
          # the same digest, and fails on a tag that holds another digest.
          # With <missing> = skip, a repository that does not exist yet
          # (registry error NAME_UNKNOWN) is skipped with a warning.
          copy() { # <push> <missing> <source>@<digest> <target repository>:<tag>
            source="$3"
            target="$4"
            digest="${source#*@}"
            if [ "$1" != true ]; then
              [ "$("$crane" digest "$source")" = "$digest" ]
              echo "dry run: $source -> $target" | tee -a "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            if existing="$("$crane" digest "$target" 2> "$RUNNER_TEMP/lookup")"; then
              [ "$existing" = "$digest" ] || { echo "::error::$target holds $existing, not $digest"; return 1; }
              echo "$target already holds $existing"
              return 0
            fi
            if [ "$2" = skip ] && grep -q NAME_UNKNOWN "$RUNNER_TEMP/lookup"; then
              echo "::warning::${target%:*} does not exist yet: $source is not copied" | tee -a "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            "$crane" copy "$source" "$target"
            echo "$target $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          [ "$DIGESTS" != "{}" ] || echo "::warning::ecr_digests gave no image digests, so this build is not copied to the ECR" | tee -a "$GITHUB_STEP_SUMMARY"
          while read -r image digest; do
            copy "$PUSH_PRODUCTION" fail "ghcr.io/ctxpipe-ai/$image@$digest" "$PRODUCTION_ECR/ctxpipe/$image:$GITHUB_SHA"
          done < <(jq -r 'to_entries[] | "\(.key) \(.value)"' <<< "$DIGESTS")
          # The hosted, observability and preview stacks run these upstream
          # images. Each pin is a multi-platform index digest, and the copy
          # keeps that digest. A pin goes to production (ctxpipe/<name>), to
          # the preview account (mirror/<name>), or to both. Change a pin
          # here and in the stack that uses it in one reviewed edit. The tag
          # is the exact upstream version, not a moving tag such as mongo:7,
          # so a new pin always gets a new tag. A stack makes a repository
          # with the service that uses it, so a pin skips a repository that
          # does not exist yet.
          while read -r targets name tag source; do
            [[ ",$targets," != *,production,* ]] || copy "$PUSH_PRODUCTION" skip "$source" "$PRODUCTION_ECR/ctxpipe/$name:$tag"
            [[ ",$targets," != *,preview,* ]] || copy "$PUSH_PREVIEW" skip "$source" "$PREVIEW_ECR/mirror/$name:$tag"
          done <<'PINS'
          production,preview cloudflared 2026.10.7 docker.io/cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          production,preview falkordb v4.20.7 docker.io/falkordb/falkordb@sha256:13996aa523f0dd283f6bd6df6620b094dcea525452417c4d6ef9bef15dc9998d
          production,preview aws-cli 2.38.5 docker.io/amazon/aws-cli@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
          production otel-collector-contrib 0.155.0 docker.io/otel/opentelemetry-collector-contrib@sha256:4935caa35e9a4cb387e35732e8fb22b2b5759af8d12e7043357f03837f6e8df5
          production busybox 1.37.0 docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          production clickhouse-server 26.8.36.3-alpine docker.io/clickhouse/clickhouse-server@sha256:f5443f9ffa48f0154cdd50cab39fed732201762574a27f04f1f564bbba81832d
          production clickstack-otel-collector 2.39.1 docker.io/clickhouse/clickstack-otel-collector@sha256:fb71cb46bfc11413e9b96b056118f66293262579cec42927d7f1ca38d3732146
          production hyperdx 2.39.1 docker.io/hyperdx/hyperdx@sha256:619783ca66d6c81f72a0106f4013d65865ac42e064491b19c0019ffec268f316
          production mongo 7.0.45 docker.io/library/mongo@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
          preview nginx 1.31.8-alpine docker.io/library/nginx@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
          PINS

  release:
    timeout-minutes: 20
    name: Release
    if: ${{ !cancelled() && !failure() && needs.ecr_digests.result == 'success' && github.event_name == 'push' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    needs:
      - publish_images
      - ecr_digests
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # A self-hosted stack pulls the chat sandbox image with no credentials.
      # A new GHCR package is private until an organization owner makes it
      # public, so stop the release before it ships a stack that cannot chat.
      - name: Check that the chat sandbox image pulls without credentials
        run: bash scripts/ci/check-image-public.sh ctxpipe-ai/chat-sandbox "$GITHUB_SHA"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm ci:version
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}

  # A reviewed exception in scripts/ci/check-secret-jobs.mjs (productionJobs):
  # this job runs `pnpm install` with the production secrets. Migrate
  # (tsx src/db/migrate.ts) and the cleanup of preview sandboxes (Vercel SDK)
  # need the packages. The job runs only on a push to main, with merged code
  # and a frozen lockfile, and the production runtime trusts the same
  # packages. The pin rule and the cache rule of the check still apply.
  terraform:
    timeout-minutes: 90
    name: Terraform Init/Plan/Apply
    if: ${{ !cancelled() && !failure() && needs.ecr_digests.result == 'success' && (github.event_name == 'push' || inputs.deploy && github.ref == 'refs/heads/main') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    environment: production
    needs:
      - publish_images
      - ecr_digests
    outputs:
      roll_prs: ${{ steps.otel_previews.outputs.prs }}
    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_model_provider: ${{ vars.MODEL_PROVIDER || 'openrouter' }}
      TF_VAR_linear_redirect_uri: ${{ vars.LINEAR_REDIRECT_URI }}
      TF_VAR_pagerduty_redirect_uri: ${{ vars.PAGERDUTY_REDIRECT_URI }}
      # The collector of the new stack on the tunnel (CTX-1216, factory
      # machines/observability), with the Access token headers that the sync
      # sets. Set here, not as the module's default: the Railway Terraform goes
      # away in phase 7.
      TF_VAR_otel_otlp_endpoint: https://otel.ctxpipe.dev
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_WORKSPACE_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="access_key=$R2_ACCESS_KEY_ID" -backend-config="secret_key=$R2_SECRET_ACCESS_KEY" -backend-config="key=production/terraform.tfstate"

      # Provider Update() never sends multiRegionConfig (issue #77). Pin via
      # GraphQL and redeploy before plan so Read() sees the live region.
      # Codesearch + FalkorDB 50GB volume copy happens here when the region
      # actually changes.
      - name: Pin Railway production region
        working-directory: ${{ github.workspace }}
        run: bash scripts/railway-set-regions.sh

      # Only the password goes into state here. Migrate creates the role in
      # SQL with it (ADR-042 mode a), before the full apply gives the services
      # the app URL.
      - name: Ensure the ctxpipe_app password exists
        run: terraform apply -auto-approve -target=module.ctxpipe.random_password.app_database

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Mount pnpm store (sticky disk)
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          # Production only: no PR job mounts this key.
          key: ${{ github.repository }}-pnpm-store-production
          path: ~/.pnpm-store

      - uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5
        with:
          node-version-file: .node-version

      - name: Ensure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      # The one migrate entry point (the same as Compose and CDK): app role,
      # Drizzle, OpenWorkflow, every backfill, then grants. The step reads the
      # password from Terraform state and masks it before use. No `env:` entry
      # and no step output holds it, so GitHub never prints it. Migrate runs
      # before the new images deploy.
      - name: Migrate production database
        timeout-minutes: 20
        working-directory: ${{ github.workspace }}/apps/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          DATABASE_APP_PASSWORD="$(terraform -chdir="$GITHUB_WORKSPACE/infra" output -raw ctxpipe_app_password)"
          [[ -n "$DATABASE_APP_PASSWORD" ]] || { echo "Terraform state has no ctxpipe_app password"; exit 1; }
          echo "::add-mask::$DATABASE_APP_PASSWORD"
          export DATABASE_APP_PASSWORD
          pnpm exec tsx src/db/migrate.ts

      # Secret values go from this environment straight to Railway, never into
      # Terraform inputs or state (scripts/railway-sync-variables.mjs). The app
      # services do not redeploy here: the next step deploys them on the new
      # image, and when a value changed it deploys them even when they already
      # run that image, so a re-run applies a rotated secret. A re-run of a
      # failed attempt forces it too: that attempt may have changed values
      # that this one finds equal. FalkorDB is not in that step, so it
      # redeploys here, last: a failure in the sync of an app service changes
      # nothing on FalkorDB. If the image step fails after this, the re-run
      # forces the deploy of every app service.
      - name: Sync production secrets to Railway
        id: sync
        working-directory: ${{ github.workspace }}
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CONNECTION_SECRETS_ENCRYPTION_KEY: ${{ secrets.CONNECTION_SECRETS_ENCRYPTION_KEY }}
          MODEL_PROVIDER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
          SMTP_CONNECTION_URL: ${{ secrets.SMTP_CONNECTION_URL }}
          GH_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          ATLASSIAN_CLIENT_ID: ${{ secrets.ATLASSIAN_CLIENT_ID }}
          ATLASSIAN_CLIENT_SECRET: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          NOTION_WEBHOOK_SECRET: ${{ secrets.NOTION_WEBHOOK_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          PAGERDUTY_CLIENT_ID: ${{ secrets.PAGERDUTY_CLIENT_ID }}
          PAGERDUTY_CLIENT_SECRET: ${{ secrets.PAGERDUTY_CLIENT_SECRET }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          OBSERVABILITY_OTLP_HEADERS: ${{ secrets.OBSERVABILITY_OTLP_HEADERS }}
          FALKORDB_PASSWORD: ${{ secrets.FALKORDB_PASSWORD }}
          BETTER_AUTH_API_KEY: ${{ secrets.BETTER_AUTH_API_KEY }}
          CONFLUENCE_FORGE_INSTALL_URL: ${{ secrets.CONFLUENCE_FORGE_INSTALL_URL }}
        run: |
          set -euo pipefail
          export PROJECT_ID="$RAILWAY_PROJECT_ID"
          ENVIRONMENT_ID="$(terraform -chdir=infra output -raw railway_environment_id)"
          export ENVIRONMENT_ID
          ids="$(terraform -chdir=infra output -json railway_service_ids)"
          changed="$RUNNER_TEMP/railway-sync-changed"
          : > "$changed"
          sync() {
            SERVICE_ID="$(jq -er --arg key "$2" '.[$key]' <<<"$ids")"
            export SERVICE_ID
            node scripts/railway-sync-variables.mjs --service "$1" --changed-file "$changed" "${@:3}"
          }
          sync backend backend
          sync openworkflow open_workflow
          sync codesearch code_search
          sync ui ui
          # A re-run redeploys FalkorDB in any case: the failed attempt may
          # have written its password and then failed to redeploy it.
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then redeploy=--redeploy; else redeploy=--redeploy-on-change; fi
          sync falkordb falkordb "$redeploy"
          if [[ -s "$changed" || "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "force_deploy=1" >> "$GITHUB_OUTPUT"
          fi

      # Provider Update() serviceConnects the image for every environment and
      # redeploys previews. App image tags are ignore_changes; this step
      # deploys production only (ADR-039).
      # The switch to the new collector (CTX-1216): the previews whose backend
      # has no Access token in its OTEL headers roll after this job (job
      # roll_previews_onto_collector). Their OTEL sync skipped while
      # production had no token to compare with (scripts/preview-otel-vars.sh).
      # It reads the state after the sync, so a re-run of a failed attempt
      # finds the same previews. A failure here does not stop the deploy.
      - name: Find the previews that need the new collector
        id: otel_previews
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          OBSERVABILITY_OTLP_HEADERS: ${{ secrets.OBSERVABILITY_OTLP_HEADERS }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source scripts/railway-graphql.sh
          # shellcheck disable=SC1091
          source scripts/preview-otel-vars.sh
          # Until production sends with its Access token, previews keep skipping.
          [[ -n "$(otlp_header_values "$OBSERVABILITY_OTLP_HEADERS" CF-Access-Client-Id)" ]] || exit 0
          BACKEND_SERVICE_ID="$(terraform -chdir=infra output -json railway_service_ids | jq -er '.backend')"
          export BACKEND_SERVICE_ID
          prs="$(previews_without_access_otel | tr '\n' ' ')"
          echo "prs=${prs% }" >> "$GITHUB_OUTPUT"
          echo "Previews without the Access token: ${prs:-none}"

      # Each production deploy scans again (it reads the state), so the next
      # one retries what this one could not read; this says so where people look.
      - name: Say that the preview scan failed
        if: steps.otel_previews.outcome == 'failure'
        run: |
          echo "::warning title=Previews not rolled::The scan for previews without the Access token failed; the next production deploy scans again." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy production images
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ github.sha }}
          FORCE_DEPLOY: ${{ steps.sync.outputs.force_deploy }}
        run: bash scripts/railway-set-images.sh

      - name: Terraform Plan
        run: terraform plan --out=terraform.plan

      - name: Refuse plans that delete resources
        run: |
          umask 077
          terraform show -json terraform.plan > plan.json
          jq -e '[.resource_changes[] | select(.change.actions | index("delete"))] | length == 0' plan.json

      - name: Terraform Apply
        run: terraform apply -auto-approve terraform.plan

      # PR previews ran in the production Vercel project before they got a
      # project of their own, and the PR-close cleanup cannot reach it now.
      # Delete what they left: only sandboxes tagged `pr-<number>`. The deploy
      # is applied at this point and the next deploy tries again, so a failed
      # cleanup does not fail the deploy (forge_deploy needs this job).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Delete sandboxes that PR previews left in production
        continue-on-error: true
        working-directory: ${{ github.workspace }}/apps/backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_TEAM_ID: ctxpipe
          VERCEL_PROJECT_ID: ctxpipe
        run: bun src/scripts/deletePreviewSandboxes.ts 'pr-*'

  # The switch to the new collector (CTX-1216): roll each preview that the
  # terraform job found without the Access token, on the images of its PR's
  # last deployed commit, so its OTEL sync compares its token with
  # production's and sets its variables. Each roll is
  # pr-preview-roll-existing.yaml run from main: main's reviewed workflow and
  # scripts hold the Preview secrets, and the PR's commit selects only the
  # images. A branch's own older scripts could copy production's new OTEL
  # token into its preview. The job holds no secret: the GitHub token
  # dispatches the rolls.
  roll_previews_onto_collector:
    timeout-minutes: 10
    name: Roll the previews onto the new collector
    # A truthy output: GitHub gives '' and the deploy tests' model gives null
    # when the terraform job set none.
    if: needs.terraform.outputs.roll_prs
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    needs: terraform
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Roll each preview on its last deployed commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRS: ${{ needs.terraform.outputs.roll_prs }}
        run: |
          set -euo pipefail
          for number in $PRS; do
            [[ "$number" =~ ^[0-9]+$ ]] || continue
            pr="$(gh pr view "$number" --repo "$REPO" --json state,headRefName,isCrossRepository)"
            ref="$(jq -r .headRefName <<<"$pr")"
            if [[ "$(jq -r .state <<<"$pr")" != OPEN || "$(jq -r .isCrossRepository <<<"$pr")" == true ]]; then
              echo "PR #$number: not an open PR of this repository; skipped"
              continue
            fi
            # The images of the last commit that PR Deploy deployed, not only of the head.
            sha="$(gh run list --repo "$REPO" --workflow pr-deploy.yaml --branch "$ref" --limit 50 \
              --json headSha,conclusion | jq -r '[.[] | select(.conclusion == "success")][0].headSha // ""')"
            if [[ -z "$sha" ]]; then
              echo "PR #$number: no successful PR Deploy; skipped"
              continue
            fi
            gh workflow run pr-preview-roll-existing.yaml --repo "$REPO" --ref "$GITHUB_REF_NAME" \
              -f pr_number="$number" -f head_sha="$sha" -f pr_branch="$ref"
            echo "PR #$number: roll dispatched"
          done

  # A reviewed exception in scripts/ci/check-secret-jobs.mjs (productionJobs):
  # the Forge CLI is a package, and it runs with the Forge token. The job runs
  # only on a push to main, with merged code and a frozen lockfile.
  forge_deploy:
    timeout-minutes: 20
    name: Deploy Forge app (production)
    if: ${{ !cancelled() && !failure() && needs.terraform.result == 'success' && (github.event_name == 'push' || inputs.deploy && github.ref == 'refs/heads/main') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    environment: production
    needs: terraform

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Mount pnpm store (sticky disk)
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          # Production only: no PR job mounts this key.
          key: ${{ github.repository }}-pnpm-store-production
          path: ~/.pnpm-store

      - uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5
        with:
          node-version-file: .node-version

      - name: Ensure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `forge deploy` runs pre-deployment lint and is the command that accepts
      # MAJOR_VERSION_RULE approvals for scope changes. The package script also
      # configures the CLI for non-interactive use.
      - name: Validate and deploy Forge production
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_DISABLE_ANALYTICS: "1"
        run: pnpm --filter @ctxpipe/forge-ctxpipe-agent run deploy:prod

  prerelease:
    timeout-minutes: 20
    name: Prerelease
    if: github.event_name == 'workflow_dispatch' && !inputs.deploy
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # A run on main gets an OIDC token with the subject of main, which a
      # cloud role can trust (scripts/ci/check-secret-jobs.mjs). Thus build
      # only a commit that is on main. If this step fails, merge the ref first,
      # or publish from a commit of main.
      - name: Refuse a commit that is not on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish snapshot prerelease
        run: IMAGE_TAG="$(git rev-parse HEAD)" pnpm ci:prerelease
        env:
          SNAPSHOT_TAG: ${{ inputs.dist_tag }}
