name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from
        default: main
        type: string
      dist_tag:
        description: npm dist-tag for snapshot prerelease
        default: next
        type: choice
        options:
          - next
          - canary
          - beta

concurrency:
  group: deploy-main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build_images:
    name: Build and Publish GHCR Images
    if: github.event_name != 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: apps/backend/Dockerfile
          - image: worker
            dockerfile: apps/backend/Dockerfile.worker
          - image: ui
            dockerfile: apps/ui/Dockerfile
          - image: codesearch
            dockerfile: apps/codesearch/Dockerfile
          - image: otel-collector
            dockerfile: apps/otel-collector/Dockerfile
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/ctxpipe-ai/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/ctxpipe-ai/${{ matrix.image }}:latest

  release:
    name: Release
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - build_images
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}

  migrate_production_db:
    name: Migrate Production Database
    if: github.event_name != 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1

      - uses: pnpm/action-setup@v4

      - name: Mount pnpm store (sticky disk)
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-pnpm-store
          path: ~/.pnpm-store

      - uses: useblacksmith/setup-node@v5
        with:
          node-version: "22"

      - name: Ensure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Drizzle migrations
        working-directory: apps/backend
        run: pnpm exec drizzle-kit migrate

  terraform:
    name: Terraform Init/Plan/Apply
    if: github.event_name != 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    needs:
      - build_images
      - migrate_production_db
    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_better_auth_secret: ${{ secrets.BETTER_AUTH_SECRET }}
      TF_VAR_langsmith_api_key: ${{ secrets.LANGSMITH_API_KEY }}
      TF_VAR_model_provider_api_key: ${{ secrets.MODEL_PROVIDER_API_KEY }}
      TF_VAR_model_provider: ${{ vars.MODEL_PROVIDER || 'openrouter' }}
      TF_VAR_smtp_connection_url: ${{ secrets.SMTP_CONNECTION_URL }}
      TF_VAR_github_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      TF_VAR_github_client_secret: ${{ secrets.GH_CLIENT_SECRET }}
      TF_VAR_github_webhook_secret: ${{ secrets.GH_WEBHOOK_SECRET }}
      TF_VAR_atlassian_client_id: ${{ secrets.ATLASSIAN_CLIENT_ID }}
      TF_VAR_atlassian_client_secret: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
      TF_VAR_slack_client_id: ${{ secrets.SLACK_CLIENT_ID }}
      TF_VAR_slack_client_secret: ${{ secrets.SLACK_CLIENT_SECRET }}
      TF_VAR_slack_signing_secret: ${{ secrets.SLACK_SIGNING_SECRET }}
      TF_VAR_linear_client_id: ${{ secrets.LINEAR_CLIENT_ID }}
      TF_VAR_linear_client_secret: ${{ secrets.LINEAR_CLIENT_SECRET }}
      TF_VAR_linear_redirect_uri: ${{ vars.LINEAR_REDIRECT_URI }}
      TF_VAR_linear_webhook_secret: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
      TF_VAR_notion_client_id: ${{ secrets.NOTION_CLIENT_ID }}
      TF_VAR_notion_client_secret: ${{ secrets.NOTION_CLIENT_SECRET }}
      TF_VAR_notion_webhook_secret: ${{ secrets.NOTION_WEBHOOK_SECRET }}
      TF_VAR_falkordb_password: ${{ secrets.FALKORDB_PASSWORD }}
      TF_VAR_better_stack_token: ${{ secrets.BETTER_STACK_TOKEN }}
      TF_VAR_langfuse_auth_string: ${{ secrets.LANGFUSE_AUTH_STRING }}
      TF_VAR_langfuse_otlp_endpoint: ${{ secrets.LANGFUSE_OTLP_ENDPOINT }}
      TF_VAR_amplitude_api_key: ${{ secrets.AMPLITUDE_API_KEY }}
      TF_VAR_amplitude_region: ${{ secrets.AMPLITUDE_REGION || 'us' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7

      - name: Terraform Init
        run: terraform init -backend-config="access_key=$R2_ACCESS_KEY_ID" -backend-config="secret_key=$R2_SECRET_ACCESS_KEY" -backend-config="key=production/terraform.tfstate"

      - name: Terraform Plan
        run: terraform plan --out=terraform.plan

      - name: Terraform Apply
        run: terraform apply -auto-approve terraform.plan

      # Image rolls must be environment-scoped. Terraform railway_service.source_image
      # is service-global; provider Update() serviceConnect + redeployAllInstances
      # would overwrite pr-* previews. ignore_changes keeps Terraform off the image.
      - name: Roll production Railway images
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          TOKEN="${RAILWAY_API_TOKEN:-${RAILWAY_TOKEN:-}}"
          if [[ -z "$TOKEN" ]]; then
            echo "Missing RAILWAY_API_TOKEN / RAILWAY_TOKEN secret"
            exit 1
          fi
          if [[ -z "${RAILWAY_PROJECT_ID:-}" ]]; then
            echo "Missing RAILWAY_PROJECT_ID variable"
            exit 1
          fi
          if [[ -z "${IMAGE_SHA:-}" ]]; then
            echo "Missing IMAGE_SHA"
            exit 1
          fi

          railway_graphql() {
            local query="$1"
            local variables="$2"
            local raw http_code body
            raw="$(curl -sS -w '\n%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$query" --argjson v "$variables" '{query:$q,variables:$v}')" \
              https://backboard.railway.com/graphql/v2)" || return $?
            http_code="$(printf '%s' "$raw" | tail -n1)"
            body="$(printf '%s' "$raw" | sed '$d')"
            if [[ "$http_code" != "200" ]]; then
              echo "Railway GraphQL HTTP $http_code for query: ${query:0:120}…" >&2
              echo "$body" >&2
              return 22
            fi
            if echo "$body" | jq -e '.errors | type == "array" and length > 0' >/dev/null 2>&1; then
              echo "Railway GraphQL errors for query: ${query:0:120}…" >&2
              echo "$body" | jq -c '.errors' >&2
              return 22
            fi
            printf '%s' "$body"
          }

          project="$(railway_graphql \
            'query Project($id: String!) { project(id: $id) { environments { edges { node { id name } } } services { edges { node { id name } } } } }' \
            "$(jq -nc --arg id "$RAILWAY_PROJECT_ID" '{id:$id}')")"

          env_id="$(echo "$project" | jq -r '
            .data.project.environments.edges[]?.node
            | select(.name == "production")
            | .id
          ' | head -1)"
          if [[ -z "$env_id" ]]; then
            echo "Could not find Railway environment named production"
            echo "$project" | jq -c '{data,errors}' >&2 || true
            exit 1
          fi
          echo "Production environment id: $env_id"

          services_json="$(echo "$project" | jq -c '
            [.data.project.services.edges[]?.node // empty | select(.name and .id) | {key: .name, value: .id}]
            | from_entries
          ')"

          roll_image() {
            local railway_name="$1"
            local image="$2"
            local service_id
            service_id="$(echo "$services_json" | jq -r --arg n "$railway_name" '.[$n] // empty')"
            if [[ -z "$service_id" ]]; then
              echo "Missing Railway service named $railway_name in project $RAILWAY_PROJECT_ID"
              exit 1
            fi
            echo "Updating $railway_name ($service_id) -> $image (production only)"
            railway_graphql \
              'mutation serviceInstanceUpdate($environmentId: String, $serviceId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: $input) }' \
              "$(jq -nc --arg env "$env_id" --arg service "$service_id" --arg img "$image" \
                '{environmentId:$env, serviceId:$service, input:{source:{image:$img}}}')" >/dev/null
            railway_graphql \
              'mutation serviceInstanceDeployV2($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }' \
              "$(jq -nc --arg env "$env_id" --arg service "$service_id" '{environmentId:$env, serviceId:$service}')" >/dev/null
          }

          roll_image backend "ghcr.io/ctxpipe-ai/backend:${IMAGE_SHA}"
          roll_image openworkflow "ghcr.io/ctxpipe-ai/worker:${IMAGE_SHA}"
          roll_image ui "ghcr.io/ctxpipe-ai/ui:${IMAGE_SHA}"
          roll_image codesearch "ghcr.io/ctxpipe-ai/codesearch:${IMAGE_SHA}"
          roll_image otelcollector "ghcr.io/ctxpipe-ai/otel-collector:${IMAGE_SHA}"
          echo "Queued production-only image rolls for ${IMAGE_SHA}"

  forge_deploy:
    name: Deploy Forge app (production)
    if: github.event_name != 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    needs: terraform

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1

      - uses: pnpm/action-setup@v4

      - name: Mount pnpm store (sticky disk)
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-pnpm-store
          path: ~/.pnpm-store

      - uses: useblacksmith/setup-node@v5
        with:
          node-version: "22"

      - name: Ensure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Forge CLI for CI
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_DISABLE_ANALYTICS: "1"
        run: pnpm --filter @ctxpipe/forge-ctxpipe-agent run prepare-forge-cli

      - name: Forge lint
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_DISABLE_ANALYTICS: "1"
          REMOTE_BASE_URL: https://app.ctxpipe.ai/
        run: pnpm --filter @ctxpipe/forge-ctxpipe-agent run lint:forge

      - name: Deploy to Forge production
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_DISABLE_ANALYTICS: "1"
        run: pnpm --filter @ctxpipe/forge-ctxpipe-agent run deploy:prod

  prerelease:
    name: Prerelease
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish snapshot prerelease
        run: IMAGE_TAG="$(git rev-parse HEAD)" pnpm ci:prerelease
        env:
          SNAPSHOT_TAG: ${{ inputs.dist_tag }}
