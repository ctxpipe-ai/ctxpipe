name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish from
        default: main
        type: string
      dist_tag:
        description: npm dist-tag for snapshot prerelease
        default: next
        type: choice
        options:
          - next
          - canary
          - beta

concurrency:
  group: deploy-main

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # Each image builds natively on an amd64 runner and on an arm64 runner. QEMU
  # is too slow for the codesearch toolchain. Each build pushes its image by
  # digest only. The publish_images job then joins the two digests in one
  # manifest list with the tags <sha> and latest. Railway pulls the
  # linux/amd64 image, and the AWS hosts (Graviton) pull the linux/arm64
  # image. Self-hosters can run either.
  build_images_amd64:
    timeout-minutes: 45
    name: Build image (${{ matrix.image }}, amd64)
    if: github.event_name != 'workflow_dispatch'
    # amd64: it builds the linux/amd64 image of each service natively.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    env:
      ARCH: amd64
    strategy:
      fail-fast: false
      matrix: &images
        include:
          - image: backend
            dockerfile: apps/backend/Dockerfile
          - image: worker
            dockerfile: apps/backend/Dockerfile.worker
          - image: ui
            dockerfile: apps/ui/Dockerfile
          - image: codesearch
            dockerfile: apps/codesearch/Dockerfile
          # Workspace chat sandboxes.
          - image: chat-sandbox
            dockerfile: scripts/chat-sandbox/Dockerfile
            context: scripts/chat-sandbox
    steps: &build_image_steps
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@e4c1c000c95f9cc255f72940e9c56bcbd1239436 # v1

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ env.ARCH }}
          outputs: type=image,name=ghcr.io/ctxpipe-ai/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digest"
          echo "$DIGEST" > "$RUNNER_TEMP/digest/$ARCH"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.image }}-${{ env.ARCH }}
          path: ${{ runner.temp }}/digest/${{ env.ARCH }}
          if-no-files-found: error

  build_images_arm64:
    timeout-minutes: 45
    name: Build image (${{ matrix.image }}, arm64)
    if: github.event_name != 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    environment: production
    env:
      ARCH: arm64
    strategy:
      fail-fast: false
      matrix: *images
    steps: *build_image_steps

  publish_images:
    timeout-minutes: 10
    name: Publish image (${{ matrix.image }})
    if: github.event_name != 'workflow_dispatch'
    needs:
      - build_images_amd64
      - build_images_arm64
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # It only reads the digest artifacts of this run and writes manifests.
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix: *images
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digest
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform image
        env:
          IMAGE: ghcr.io/ctxpipe-ai/${{ matrix.image }}
          INDEX: ${{ runner.temp }}/index/${{ matrix.image }}
        run: |
          set -o pipefail
          docker buildx imagetools create --progress plain \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$(cat "$RUNNER_TEMP/digest/amd64")" \
            "$IMAGE@$(cat "$RUNNER_TEMP/digest/arm64")" 2>&1 | tee "$RUNNER_TEMP/create.log"
          # The digest of the list that this job pushed, from the push and not
          # from a later read of the tag. copy_images_to_ecr copies it.
          mkdir -p "$(dirname "$INDEX")"
          grep -oE 'pushing sha256:[0-9a-f]{64} to ' "$RUNNER_TEMP/create.log" | sort -u | cut -d' ' -f2 > "$INDEX"
          [ "$(wc -l < "$INDEX")" -eq 1 ]
          docker buildx imagetools inspect "$IMAGE@$(cat "$INDEX")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: index-${{ matrix.image }}
          path: ${{ runner.temp }}/index/${{ matrix.image }}
          if-no-files-found: error

  # Gives copy_images_to_ecr the manifest-list digests that publish_images
  # pushed in this run. The copy job holds an AWS token, so it downloads no
  # artifact (check-secret-jobs). This job holds no token: it reads the
  # artifacts as data and lets only sha256 digests through. release and
  # terraform run pnpm install, so they wait for this job: while it reads the
  # artifacts, no job of the run that runs dependency code can upload one.
  ecr_digests:
    timeout-minutes: 5
    name: Digests for the production ECR
    if: github.event_name != 'workflow_dispatch'
    needs:
      - publish_images
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.run_attempt == 1
        with:
          pattern: index-*
          path: ${{ runner.temp }}/index
          merge-multiple: true
      - id: digests
        run: |
          set -o pipefail
          # Only the first attempt reads the artifacts: in a later attempt,
          # dependency code of release or terraform from an earlier attempt
          # could have uploaded one. A rerun of only copy_images_to_ecr keeps
          # the outputs of the first attempt.
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::warning::attempt $GITHUB_RUN_ATTEMPT gives no digests, so this build is not copied to the ECR; the next main build copies its images"
            echo "digests={}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd "$RUNNER_TEMP/index"
          # The ECR repositories that exist (factory #99, ctxpipe/*). An image
          # without one is skipped with a notice: release and terraform wait
          # for this job, so a failure here would stop the Railway deploy.
          for image in *; do
            digest="$(cat "$image")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$image holds no image digest" >&2; exit 1; }
            if [[ ! "$image" =~ ^(backend|worker|ui|codesearch|chat-sandbox)$ ]]; then
              echo "::notice::$image is not on the ECR list of this job; it is not copied" >&2
              continue
            fi
            echo "$image $digest"
          done | jq -Rcs 'split("\n") | map(select(. != "") | split(" ") | {(.[0]): .[1]}) | add // {}' | sed 's/^/digests=/' >> "$GITHUB_OUTPUT"

  # Copies each production image, and the cloudflared image that the edge
  # stack pins, to the production ECR (CTX-1215 X2). crane copies the
  # manifest list by digest, so the ECR digest equals the GHCR digest. It
  # writes the per-platform images first and the tagged list last, so the
  # newest tagged image is always complete. Each push starts the factory
  # digest workflow through EventBridge; this repo holds no factory
  # credential. Railway deploys from GHCR (the terraform job) until the
  # cutover, so no job waits for this one.
  copy_images_to_ecr:
    timeout-minutes: 15
    name: Copy images to the production ECR
    if: github.event_name != 'workflow_dispatch'
    needs:
      - ecr_digests
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # Only this job names the environment, and the environment admits only
    # main. The push role trusts only the OIDC subject of this environment,
    # so no other job of this repo can push to the ECR.
    environment: ecr-push
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      AWS_ACCOUNT: "213102790567"
      ECR_REGION: us-west-2
    steps:
      # The repository variable ECR_MIRROR turns the copy on. A person sets
      # it to `enabled` after aws-core deploys the push role. Until then, the
      # copy step only checks the sources (a dry run) and warns. With the
      # variable set, a failed login or copy fails the job: an ECR push
      # starts the production deploys, so a failure must show.
      - if: vars.ECR_MIRROR == 'enabled'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/github-actions-ctxpipe-ecr-push
          aws-region: ${{ env.ECR_REGION }}

      - name: Install crane
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/crane.tar.gz" \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_arm64.tar.gz
          echo "898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane

      - name: Copy the images by digest
        env:
          DIGESTS: ${{ needs.ecr_digests.outputs.digests }}
          GH_TOKEN: ${{ github.token }}
          PUSH: ${{ vars.ECR_MIRROR == 'enabled' }}
        run: |
          set -o pipefail
          # A late rerun of an older run must not make an older build the
          # newest tagged image, so each attempt checks the head of main.
          main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$main" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $main, not at $GITHUB_SHA: the run of that commit copies its images"
            exit 0
          fi
          crane="$RUNNER_TEMP/crane"
          ecr="$AWS_ACCOUNT.dkr.ecr.$ECR_REGION.amazonaws.com"
          echo "$GH_TOKEN" | "$crane" auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [ "$PUSH" = true ]; then
            aws ecr get-login-password | "$crane" auth login "$ecr" -u AWS --password-stdin
          else
            echo "::warning::The repository variable ECR_MIRROR is not enabled: a dry run checks the sources and copies nothing."
          fi
          # The tags are immutable. A rerun skips a tag that already holds
          # the same digest, and fails on a tag that holds another digest.
          copy() { # <source>@<digest> <repository> <tag>
            target="$ecr/$2:$3"
            digest="${1#*@}"
            if [ "$PUSH" != true ]; then
              [ "$("$crane" digest "$1")" = "$digest" ]
              echo "dry run: $1 -> $target" | tee -a "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            if existing="$("$crane" digest "$target" 2> /dev/null)"; then
              [ "$existing" = "$digest" ] || { echo "::error::$target holds $existing, not $digest"; return 1; }
              echo "$target already holds $existing"
              return 0
            fi
            "$crane" copy "$1" "$target"
            echo "$target $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          [ "$DIGESTS" != "{}" ] || echo "::warning::ecr_digests gave no image digests, so this build is not copied to the ECR" | tee -a "$GITHUB_STEP_SUMMARY"
          while read -r image digest; do
            copy "ghcr.io/ctxpipe-ai/$image@$digest" "ctxpipe/$image" "$GITHUB_SHA"
          done < <(jq -r 'to_entries[] | "\(.key) \(.value)"' <<< "$DIGESTS")
          # cloudflared 2026.10.7 (multi-platform index), the version of the
          # edge stack and the backend sidecar. Its tag is its version, so a
          # new tag comes only with a new pin.
          copy docker.io/cloudflare/cloudflared@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba ctxpipe/cloudflared 2026.10.7

  release:
    timeout-minutes: 20
    name: Release
    if: github.event_name != 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    needs:
      - publish_images
      - ecr_digests
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # A self-hosted stack pulls the chat sandbox image with no credentials.
      # A new GHCR package is private until an organization owner makes it
      # public, so stop the release before it ships a stack that cannot chat.
      - name: Check that the chat sandbox image pulls without credentials
        run: bash scripts/ci/check-image-public.sh ctxpipe-ai/chat-sandbox "$GITHUB_SHA"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm ci:version
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}

  # A reviewed exception in scripts/ci/check-secret-jobs.mjs (productionJobs):
  # this job runs `pnpm install` with the production secrets. Migrate
  # (tsx src/db/migrate.ts) and the cleanup of preview sandboxes (Vercel SDK)
  # need the packages. The job runs only on a push to main, with merged code
  # and a frozen lockfile, and the production runtime trusts the same
  # packages. The pin rule and the cache rule of the check still apply.
  terraform:
    timeout-minutes: 90
    name: Terraform Init/Plan/Apply
    if: github.event_name != 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    environment: production
    needs:
      - publish_images
      - ecr_digests
    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_image_tag: ${{ github.sha }}
      TF_VAR_model_provider: ${{ vars.MODEL_PROVIDER || 'openrouter' }}
      TF_VAR_linear_redirect_uri: ${{ vars.LINEAR_REDIRECT_URI }}
      TF_VAR_pagerduty_redirect_uri: ${{ vars.PAGERDUTY_REDIRECT_URI }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_WORKSPACE_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -backend-config="access_key=$R2_ACCESS_KEY_ID" -backend-config="secret_key=$R2_SECRET_ACCESS_KEY" -backend-config="key=production/terraform.tfstate"

      # Provider Update() never sends multiRegionConfig (issue #77). Pin via
      # GraphQL and redeploy before plan so Read() sees the live region.
      # Codesearch + FalkorDB 50GB volume copy happens here when the region
      # actually changes.
      - name: Pin Railway production region
        working-directory: ${{ github.workspace }}
        run: bash scripts/railway-set-regions.sh

      # Only the password goes into state here. Migrate creates the role in
      # SQL with it (ADR-042 mode a), before the full apply gives the services
      # the app URL.
      - name: Ensure the ctxpipe_app password exists
        run: terraform apply -auto-approve -target=module.ctxpipe.random_password.app_database

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Mount pnpm store (sticky disk)
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          # Production only: no PR job mounts this key.
          key: ${{ github.repository }}-pnpm-store-production
          path: ~/.pnpm-store

      - uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5
        with:
          node-version-file: .node-version

      - name: Ensure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      # The one migrate entry point (the same as Compose and CDK): app role,
      # Drizzle, OpenWorkflow, every backfill, then grants. The step reads the
      # password from Terraform state and masks it before use. No `env:` entry
      # and no step output holds it, so GitHub never prints it. Migrate runs
      # before the new images deploy.
      - name: Migrate production database
        timeout-minutes: 20
        working-directory: ${{ github.workspace }}/apps/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          DATABASE_APP_PASSWORD="$(terraform -chdir="$GITHUB_WORKSPACE/infra" output -raw ctxpipe_app_password)"
          [[ -n "$DATABASE_APP_PASSWORD" ]] || { echo "Terraform state has no ctxpipe_app password"; exit 1; }
          echo "::add-mask::$DATABASE_APP_PASSWORD"
          export DATABASE_APP_PASSWORD
          pnpm exec tsx src/db/migrate.ts

      # Secret values go from this environment straight to Railway, never into
      # Terraform inputs or state (scripts/railway-sync-variables.mjs). The app
      # services do not redeploy here: the next step deploys them on the new
      # image, and when a value changed it deploys them even when they already
      # run that image, so a re-run applies a rotated secret. A re-run of a
      # failed attempt forces it too: that attempt may have changed values
      # that this one finds equal. FalkorDB is not in that step, so it
      # redeploys here, last: a failure in the sync of an app service changes
      # nothing on FalkorDB. If the image step fails after this, the re-run
      # forces the deploy of every app service.
      - name: Sync production secrets to Railway
        id: sync
        working-directory: ${{ github.workspace }}
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CONNECTION_SECRETS_ENCRYPTION_KEY: ${{ secrets.CONNECTION_SECRETS_ENCRYPTION_KEY }}
          MODEL_PROVIDER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
          SMTP_CONNECTION_URL: ${{ secrets.SMTP_CONNECTION_URL }}
          GH_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
          ATLASSIAN_CLIENT_ID: ${{ secrets.ATLASSIAN_CLIENT_ID }}
          ATLASSIAN_CLIENT_SECRET: ${{ secrets.ATLASSIAN_CLIENT_SECRET }}
          NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
          NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
          NOTION_WEBHOOK_SECRET: ${{ secrets.NOTION_WEBHOOK_SECRET }}
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
          SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          LINEAR_WEBHOOK_SECRET: ${{ secrets.LINEAR_WEBHOOK_SECRET }}
          PAGERDUTY_CLIENT_ID: ${{ secrets.PAGERDUTY_CLIENT_ID }}
          PAGERDUTY_CLIENT_SECRET: ${{ secrets.PAGERDUTY_CLIENT_SECRET }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          OBSERVABILITY_OTLP_HEADERS: ${{ secrets.OBSERVABILITY_OTLP_HEADERS }}
          FALKORDB_PASSWORD: ${{ secrets.FALKORDB_PASSWORD }}
          BETTER_AUTH_API_KEY: ${{ secrets.BETTER_AUTH_API_KEY }}
          CONFLUENCE_FORGE_INSTALL_URL: ${{ secrets.CONFLUENCE_FORGE_INSTALL_URL }}
        run: |
          set -euo pipefail
          export PROJECT_ID="$RAILWAY_PROJECT_ID"
          ENVIRONMENT_ID="$(terraform -chdir=infra output -raw railway_environment_id)"
          export ENVIRONMENT_ID
          ids="$(terraform -chdir=infra output -json railway_service_ids)"
          changed="$RUNNER_TEMP/railway-sync-changed"
          : > "$changed"
          sync() {
            SERVICE_ID="$(jq -er --arg key "$2" '.[$key]' <<<"$ids")"
            export SERVICE_ID
            node scripts/railway-sync-variables.mjs --service "$1" --changed-file "$changed" "${@:3}"
          }
          sync backend backend
          sync openworkflow open_workflow
          sync codesearch code_search
          sync ui ui
          # A re-run redeploys FalkorDB in any case: the failed attempt may
          # have written its password and then failed to redeploy it.
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then redeploy=--redeploy; else redeploy=--redeploy-on-change; fi
          sync falkordb falkordb "$redeploy"
          if [[ -s "$changed" || "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "force_deploy=1" >> "$GITHUB_OUTPUT"
          fi

      # Provider Update() serviceConnects the image for every environment and
      # redeploys previews. App image tags are ignore_changes; this step
      # deploys production only (ADR-039).
      - name: Deploy production images
        working-directory: ${{ github.workspace }}
        env:
          IMAGE_TAG: ${{ github.sha }}
          FORCE_DEPLOY: ${{ steps.sync.outputs.force_deploy }}
        run: bash scripts/railway-set-images.sh

      - name: Terraform Plan
        run: terraform plan --out=terraform.plan

      - name: Refuse plans that delete resources
        run: |
          umask 077
          terraform show -json terraform.plan > plan.json
          jq -e '[.resource_changes[] | select(.change.actions | index("delete"))] | length == 0' plan.json

      - name: Terraform Apply
        run: terraform apply -auto-approve terraform.plan

      # PR previews ran in the production Vercel project before they got a
      # project of their own, and the PR-close cleanup cannot reach it now.
      # Delete what they left: only sandboxes tagged `pr-<number>`. The deploy
      # is applied at this point and the next deploy tries again, so a failed
      # cleanup does not fail the deploy (forge_deploy needs this job).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Delete sandboxes that PR previews left in production
        continue-on-error: true
        working-directory: ${{ github.workspace }}/apps/backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_TEAM_ID: ctxpipe
          VERCEL_PROJECT_ID: ctxpipe
        run: bun src/scripts/deletePreviewSandboxes.ts 'pr-*'

  # A reviewed exception in scripts/ci/check-secret-jobs.mjs (productionJobs):
  # the Forge CLI is a package, and it runs with the Forge token. The job runs
  # only on a push to main, with merged code and a frozen lockfile.
  forge_deploy:
    timeout-minutes: 20
    name: Deploy Forge app (production)
    if: github.event_name != 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    environment: production
    needs: terraform

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Mount pnpm store (sticky disk)
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          # Production only: no PR job mounts this key.
          key: ${{ github.repository }}-pnpm-store-production
          path: ~/.pnpm-store

      - uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5
        with:
          node-version-file: .node-version

      - name: Ensure pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `forge deploy` runs pre-deployment lint and is the command that accepts
      # MAJOR_VERSION_RULE approvals for scope changes. The package script also
      # configures the CLI for non-interactive use.
      - name: Validate and deploy Forge production
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          FORGE_DISABLE_ANALYTICS: "1"
        run: pnpm --filter @ctxpipe/forge-ctxpipe-agent run deploy:prod

  prerelease:
    timeout-minutes: 20
    name: Prerelease
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # A run on main gets an OIDC token with the subject of main, which a
      # cloud role can trust (scripts/ci/check-secret-jobs.mjs). Thus build
      # only a commit that is on main. If this step fails, merge the ref first,
      # or publish from a commit of main.
      - name: Refuse a commit that is not on main
        run: git merge-base --is-ancestor HEAD origin/main

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish snapshot prerelease
        run: IMAGE_TAG="$(git rev-parse HEAD)" pnpm ci:prerelease
        env:
          SNAPSHOT_TAG: ${{ inputs.dist_tag }}
