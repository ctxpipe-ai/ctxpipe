# The PR page shows an AWS PR preview as a GitHub Deployment in the environment
# `pr-preview` (CTX-1377). `factory preview up` and `factory preview down` write
# it (factory repo, machines/cli README, "Previews"). The factory's hourly
# expire runs delete the preview of a closed PR, and a preview 72 hours after
# its last `up`. They have no token for this repository, so this job sets
# `inactive` on such a deployment each hour. The 72 hours are the TTL of the
# previews (factory machines/previews/pr/src/names.ts): change both together.
name: Preview deployments

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  inactive:
    # github-hosted: a few GitHub API calls, without Docker (ADR-065)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      deployments: write
      pull-requests: read
    steps:
      # A deployment is live when its newest status is success, in_progress,
      # queued or pending: an `up` that stopped half-way stays in_progress.
      # The list goes into a variable first, so a failed call fails the step
      # and is never read as "nothing to do". A failed call for one deployment
      # does not stop the others; the step fails at the end.
      - name: Set inactive on the deployments of closed PRs and expired previews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          deployments=$(gh api --paginate "repos/$REPO/deployments?environment=pr-preview&per_page=100")
          deployment_prs=$(jq -r '.[] | select(.task | test("^preview-pr-[1-9][0-9]*$")) | "\(.id) \(.task | ltrimstr("preview-pr-"))"' <<< "$deployments")
          failed=0
          while read -r id pr; do
            [[ -n $id ]] || continue
            newest_status=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" \
              --jq '.[0] // {} | "\(.state) \(.created_at // "1970-01-01T00:00:00Z" | fromdateiso8601)"') ||
              { echo "::error::No statuses of deployment $id (PR $pr)"; failed=1; continue; }
            read -r state status_at <<< "$newest_status"
            [[ $state =~ ^(success|in_progress|queued|pending)$ ]] || continue
            age=$(( now - status_at ))
            pr_state=$(gh api "repos/$REPO/pulls/$pr" --jq .state) ||
              { echo "::error::No state of PR $pr (deployment $id)"; failed=1; continue; }
            if [[ $pr_state == closed ]] || (( age > 72 * 3600 )); then
              gh api --method POST "repos/$REPO/deployments/$id/statuses" -f state=inactive > /dev/null ||
                { echo "::error::Deployment $id (PR $pr) did not take the status inactive"; failed=1; continue; }
              echo "PR $pr: deployment $id is inactive (PR $pr_state, $state $(( age / 3600 )) hours ago)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$deployment_prs"
          exit "$failed"
