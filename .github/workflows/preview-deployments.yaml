# The PR page shows an AWS PR preview as a GitHub Deployment in the environment
# `pr-preview` (CTX-1377), with a View deployment button, and no comment.
#
# - `factory preview up` and `down` (factory repo, machines/cli README,
#   "Previews") dispatch this workflow on main with the PR, the state, the
#   factory run and the commit. The job writes the deployments with
#   GITHUB_TOKEN: GitHub starts no workflow for the events of that token, so
#   the PR's own copy of a workflow on `deployment` events never runs.
# - Each dispatch is an event, and its run name holds it. The run name stays
#   in the list of runs also when GitHub cancels a pending run of a group.
#   GitHub never cancels the newest dispatch, so the last run of a PR (one
#   group for each PR) sees each event of the last 4 days.
# - Each run of a PR makes the PR's deployments agree with its events and its
#   records. The newest factory run that an event names gets a deployment,
#   also when it is a down (`inactive`). An older run that has no record gets
#   none, because it never shows. Nothing deletes a deployment, so the record
#   of the newest run stays after its events leave the window. Only the
#   newest recorded or seen run shows its last state, if it is an up, its
#   first event is at most 72 hours old, and the PR is open. Every other
#   deployment is `inactive`, and no state replaces `inactive`. So a late
#   event of an old run never shows it again.
# - The 72 hours are the TTL of the previews (factory
#   machines/previews/pr/src/names.ts): change both together. The factory's
#   expire runs delete those previews, but they have no token for this
#   repository.
# - After each push to main, and each hour, the sweep starts a `check` run
#   for each PR whose live deployment can be gone (a closed PR, or a newest
#   status older than 72 hours), so all the changes of a PR go through its
#   group. It reads the deployments with their newest status through
#   GraphQL, 100 in each call. It starts no check run for a PR whose check
#   run failed in the last day, so that a reconcile that fails each time
#   does not start a new run at each sweep.
# - GitHub can start a `schedule` run hours late, or drop it. So the push
#   trigger does the sweep, and the hourly schedule is only a fallback for
#   days without a push.
name: Preview deployments
# Two jq parsers read this run name: the event plan of `reconcile` and the
# failed check runs of `sweep`. Change them together with it.
run-name: >-
  ${{ github.event_name != 'workflow_dispatch' && 'preview deployments sweep'
  || format('preview deployments pr-{0} {1} {2} {3}', inputs.pr, inputs.state, inputs.log_url, inputs.sha) }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the ctxpipe pull request
        type: string
        required: true
      state:
        description: The new state of the PR's preview (check only reads the events again)
        type: choice
        required: true
        options: [in_progress, success, failure, inactive, check]
      log_url:
        description: The factory run of the preview (not for check)
        type: string
        default: ""
      sha:
        description: The commit of the preview (not for inactive and check)
        type: string
        default: ""
  push:
    branches: [main]
  schedule:
    - cron: "41 * * * *"

permissions: {}

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch'
    # github-hosted: a few GitHub API calls, without Docker (ADR-065)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # The runs of one PR one at a time; GitHub keeps the newest pending run.
    concurrency:
      group: preview-deployments-pr-${{ inputs.pr }}
      cancel-in-progress: false
    permissions:
      actions: read
      deployments: write
      pull-requests: read
    steps:
      # Each list goes into a variable first, so a failed call fails the step
      # and is never read as "nothing to do".
      - name: Make the PR's deployments agree with its events
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [[ $PR =~ ^[1-9][0-9]{0,5}$ ]] || { echo "::error::Not a PR number: $PR"; exit 1; }
          factory_runs="https://github.com/ctxpipe-ai/factory/actions/runs/"
          run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          now=$(date +%s)

          # The events of this PR: the run names of the dispatches of the last
          # 4 days, of each conclusion. GitHub gives at most 1,000 runs for a
          # filtered list, so a longer list fails the step.
          since=$(date -u -d "4 days ago" +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh api --paginate \
            "repos/$REPO/actions/workflows/preview-deployments.yaml/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=100")
          jq -se '(map(.workflow_runs | length) | add // 0) >= (.[0].total_count // 0)' <<< "$runs" > /dev/null ||
            { echo "::error::More dispatch runs than GitHub lists: the events are not complete"; exit 1; }
          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          pr_state=$(jq -r .state <<< "$pr_json")
          head_sha=$(jq -r .head.sha <<< "$pr_json")
          deployments=$(gh api --paginate "repos/$REPO/deployments?environment=pr-preview&task=preview-pr-$PR&per_page=100")

          # The plan, from the events and the records (the deployments, which
          # nothing deletes; payload.run is the factory run):
          # - "create <run> <commit>" for the newest run, if it was seen and
          #   has no record, so that the newest run keeps one;
          # - "show <run> <state>" for the run that shows: the newest recorded
          #   or seen run, if it is an up, its first event is at most 72 hours
          #   old, and the PR is open. (The preview expires 72 hours after the
          #   run's end, at most 90 minutes later.) Every other deployment is
          #   inactive.
          plan=$(jq -rn --arg pr "$PR" --arg prefix "$factory_runs" --arg head "$head_sha" --arg open "$pr_state" \
            --argjson now "$now" --argjson deployments "$(jq -s 'add // []' <<< "$deployments")" '
            [inputs.workflow_runs[] | (.created_at | fromdateiso8601) as $at | .display_title
              | capture("^preview deployments pr-(?<pr>[0-9]+) (?<state>[a-z_]+) (?<url>\\S+) ?(?<sha>[0-9a-f]{40})?$")?
              | select(.pr == $pr and (.url | startswith($prefix)) and (.state | IN("in_progress", "success", "failure", "inactive")))
              | select(.state == "inactive" or .sha != null)
              | .run = (.url | ltrimstr($prefix) | tonumber? // empty) | .at = $at]
            | group_by(.run) | map({run: .[0].run, down: any(.[]; .state == "inactive"),
                state: ([.[] | select(.state == "success" or .state == "failure")][0].state // "in_progress"),
                sha: ([.[].sha | select(. != null)][0] // $head), first: (map(.at) | min)}) as $seen
            | ([$deployments[].payload.run | numbers]) as $recorded
            | (([$recorded[], $seen[].run] | max) // 0) as $newest
            | $seen[] | select(.run == $newest)
            | (select($recorded | index($newest) | not) | "create \(.run) \(.sha)"),
              (select((.down | not) and $open == "open" and $now - .first <= 72 * 3600) | "show \(.run) \(.state)")' <<< "$runs")

          # The state of the newest status of deployment $1, or "none".
          newest_state() {
            gh api "repos/$REPO/deployments/$1/statuses?per_page=1" --jq '.[0].state // "none"'
          }
          set_status() {
            local fields=(-f state="$2" -f log_url="$3")
            [[ -z ${4:-} ]] || fields+=(-f environment_url="$4")
            gh api --method POST "repos/$REPO/deployments/$1/statuses" "${fields[@]}" > /dev/null
            echo "PR $PR: deployment $1 is $2" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          show_run=""
          show_state=""
          while read -r action run value; do
            case $action in
              create)
                # Transient: GitHub does not set inactive on the other PRs' deployments.
                # No required contexts and no auto merge: the deployment is of
                # the commit, and does not wait for its checks.
                body=$(jq -n --arg sha "$value" --arg pr "$PR" --argjson run "$run" '{ref: $sha,
                  environment: "pr-preview", task: "preview-pr-\($pr)", description: "Preview of PR \($pr)",
                  payload: {run: $run}, transient_environment: true, required_contexts: [], auto_merge: false}')
                gh api --method POST "repos/$REPO/deployments" --input - > /dev/null <<< "$body" ;;
              show) show_run=$run show_state=$value ;;
            esac
          done <<< "$plan"

          deployments=$(gh api --paginate "repos/$REPO/deployments?environment=pr-preview&task=preview-pr-$PR&per_page=100")
          records=$(jq -rn 'inputs[] | "\(.id) \(.payload.run // 0)"' <<< "$deployments")
          while read -r id run; do
            [[ -n $id ]] || continue
            current=$(newest_state "$id")
            # A state never replaces inactive.
            [[ $current != inactive ]] || continue
            if [[ $run == "$show_run" ]]; then
              link=""
              [[ $show_state != success ]] || link="https://pr-$PR.ctxpipe.dev"
              [[ $current == "$show_state" ]] || set_status "$id" "$show_state" "$factory_runs$run" "$link"
            else
              set_status "$id" inactive "$run_url"
            fi
          done <<< "$records"

  sweep:
    if: github.event_name != 'workflow_dispatch'
    # Close merges start one sweep at a time; GitHub keeps the newest pending.
    concurrency:
      group: preview-deployments-sweep
      cancel-in-progress: false
    # github-hosted: a few GitHub API calls, without Docker (ADR-065)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      # The check runs of this workflow.
      actions: write
      deployments: read
      pull-requests: read
    steps:
      # A failed call for one PR does not stop the others; the step fails at
      # the end.
      - name: A check run for each PR whose preview can be gone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          # The $ names in the query are GraphQL variables, not shell ones.
          # shellcheck disable=SC2016
          pages=$(gh api graphql --paginate -F owner="${REPO%/*}" -F name="${REPO#*/}" -f query='
            query($owner: String!, $name: String!, $endCursor: String) {
              repository(owner: $owner, name: $name) {
                deployments(environments: ["pr-preview"], first: 100, after: $endCursor) {
                  nodes { task createdAt latestStatus { state createdAt } }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }')
          # "<PR> <time of the newest status, or of the deployment>" for each
          # deployment that is not inactive.
          live=$(jq -rn 'inputs.data.repository.deployments.nodes[]
            | select(.task | test("^preview-pr-[1-9][0-9]{0,5}$")) | select(.latestStatus.state != "INACTIVE")
            | "\(.task | ltrimstr("preview-pr-")) \((.latestStatus.createdAt // .createdAt) | fromdateiso8601)"' <<< "$pages")
          # The PRs whose check run failed in the last day, one in each line.
          since=$(date -u -d "1 day ago" +%Y-%m-%dT%H:%M:%SZ)
          failed_runs=$(gh api --paginate \
            "repos/$REPO/actions/workflows/preview-deployments.yaml/runs?event=workflow_dispatch&status=failure&created=%3E%3D$since&per_page=100")
          failed_check_prs=$(jq -rn 'inputs.workflow_runs[].display_title
            | capture("^preview deployments pr-(?<pr>[1-9][0-9]{0,5}) check\\s*$")? | .pr' <<< "$failed_runs")
          failed=0
          prs=""
          while read -r pr at; do
            [[ -n $pr ]] || continue
            pr_state=$(gh api "repos/$REPO/pulls/$pr" --jq .state) ||
              { echo "::error::No state of PR $pr"; failed=1; continue; }
            if [[ $pr_state != open ]] || (( now - at > 72 * 3600 )); then
              prs="$prs $pr"
            fi
          done <<< "$live"
          for pr in $(tr ' ' '\n' <<< "$prs" | sort -u); do
            if grep -qxF "$pr" <<< "$failed_check_prs"; then
              echo "::warning::PR $pr: a check run failed in the last day; no new check run"
              continue
            fi
            gh workflow run preview-deployments.yaml --repo "$REPO" --ref main -f pr="$pr" -f state=check < /dev/null ||
              { echo "::error::No check run for PR $pr"; failed=1; continue; }
            echo "Check run for PR $pr" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
