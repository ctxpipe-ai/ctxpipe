# The PR page shows an AWS PR preview as a GitHub Deployment in the environment
# `pr-preview` (CTX-1377), with a View deployment button, and no comment.
#
# - `factory preview up` and `down` (factory repo, machines/cli README,
#   "Previews") dispatch this workflow on main with the PR, the state, the
#   factory run and the commit. The job writes the deployments with
#   GITHUB_TOKEN: GitHub starts no workflow for the events of that token, so
#   the PR's own copy of a workflow on `deployment` events never runs.
# - Each dispatch is an event, and its run name holds it. The run name stays
#   in the list of runs also when GitHub cancels a pending run of a group.
#   Each run of a PR (one group for each PR) makes the PR's deployments agree
#   with all its events of the last 7 days: the newest `down` (`inactive`) is
#   a mark, and the newest `up` run after it shows its last state. Every other
#   deployment of the PR is `inactive`. GitHub never cancels the newest
#   dispatch, so the last run of a PR sees each event. A state never replaces
#   `inactive`: a deployment that is gone stays gone.
# - A closed PR has no live deployment, and a deployment whose newest status
#   is older than 72 hours gets `inactive`: the factory's expire runs delete
#   those previews, but they have no token for this repository. The 72 hours
#   are the TTL of the previews (factory machines/previews/pr/src/names.ts):
#   change both together.
# - Hourly, the sweep starts a `check` run for each PR with a deployment that
#   is not inactive, so all the changes of a PR go through its group. It
#   deletes the inactive deployments older than a day, so the list stays
#   short.
name: Preview deployments
run-name: >-
  ${{ github.event_name == 'schedule' && 'preview deployments sweep'
  || format('preview deployments pr-{0} {1} {2} {3}', inputs.pr, inputs.state, inputs.log_url, inputs.sha) }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The number of the ctxpipe pull request
        type: string
        required: true
      state:
        description: The new state of the PR's preview (check only reads the events again)
        type: choice
        required: true
        options: [in_progress, success, failure, inactive, check]
      log_url:
        description: The factory run of the preview (not for check)
        type: string
        default: ""
      sha:
        description: The commit of the preview (not for inactive and check)
        type: string
        default: ""
  schedule:
    - cron: "41 * * * *"

permissions: {}

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch'
    # github-hosted: a few GitHub API calls, without Docker (ADR-065)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # The runs of one PR one at a time; GitHub keeps the newest pending run.
    concurrency:
      group: preview-deployments-pr-${{ inputs.pr }}
      cancel-in-progress: false
    permissions:
      actions: read
      deployments: write
      pull-requests: read
    steps:
      # Each list goes into a variable first, so a failed call fails the step
      # and is never read as "nothing to do".
      - name: Make the PR's deployments agree with its events
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [[ $PR =~ ^[1-9][0-9]{0,5}$ ]] || { echo "::error::Not a PR number: $PR"; exit 1; }
          factory_runs="https://github.com/ctxpipe-ai/factory/actions/runs/"
          run_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"

          # The events of this PR: the run names of the dispatches of the last
          # 7 days, of each conclusion. Then the newest up run after the newest
          # down: "<factory run> <its last state> <commit>", or nothing.
          since=$(date -u -d "7 days ago" +%Y-%m-%dT%H:%M:%SZ)
          runs=$(gh api --paginate \
            "repos/$REPO/actions/workflows/preview-deployments.yaml/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=100")
          wanted=$(jq -rn --arg pr "$PR" --arg runs "$factory_runs" '
            [inputs.workflow_runs[].display_title
              | capture("^preview deployments pr-(?<pr>[0-9]+) (?<state>[a-z_]+) (?<url>\\S+) ?(?<sha>[0-9a-f]{40})?$")?
              | select(.pr == $pr and (.url | startswith($runs)))
              | .run = (.url | ltrimstr($runs) | tonumber? // empty)] as $events
            | ([$events[] | select(.state == "inactive") | .run] | max // 0) as $down
            | [$events[] | select(.run > $down and (.state | IN("in_progress", "success", "failure")) and .sha != null)]
            | group_by(.run) | map({run: .[0].run, sha: .[0].sha,
                state: ([.[] | select(.state != "in_progress")][0].state // "in_progress")})
            | max_by(.run) // empty | "\(.run) \(.state) \(.sha)"' <<< "$runs")
          read -r run state sha <<< "$wanted"
          pr_state=$(gh api "repos/$REPO/pulls/$PR" --jq .state)
          [[ $pr_state == open ]] || run=""

          # The newest status of deployment $1: "<state> <epoch seconds>", or "none 0".
          newest() {
            gh api "repos/$REPO/deployments/$1/statuses?per_page=1" \
              --jq '.[0] // {} | "\(.state // "none") \(.created_at // "1970-01-01T00:00:00Z" | fromdateiso8601)"'
          }
          mark() {
            local fields=(-f state="$2" -f log_url="$3")
            [[ -z ${4:-} ]] || fields+=(-f environment_url="$4")
            gh api --method POST "repos/$REPO/deployments/$1/statuses" "${fields[@]}" > /dev/null
            echo "PR $PR: deployment $1 is $2" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          deployments=$(gh api --paginate "repos/$REPO/deployments?environment=pr-preview&task=preview-pr-$PR&per_page=100")
          keep=""
          if [[ -n $run ]]; then
            keep=$(jq -rn --argjson run "$run" '[inputs[] | select(.payload.run == $run) | .id][0] // empty' <<< "$deployments")
            if [[ -z $keep ]]; then
              # Transient: GitHub does not set inactive on the other PRs' deployments.
              # No required contexts and no auto merge: the deployment is of
              # the PR's commit, and does not wait for its checks.
              body=$(jq -n --arg sha "$sha" --arg pr "$PR" --argjson run "$run" '{ref: $sha,
                environment: "pr-preview", task: "preview-pr-\($pr)", description: "Preview of PR \($pr)",
                payload: {run: $run}, transient_environment: true, required_contexts: [], auto_merge: false}')
              keep=$(gh api --method POST "repos/$REPO/deployments" --input - --jq .id <<< "$body")
            fi
            status=$(newest "$keep")
            read -r current at <<< "$status"
            if [[ $current != inactive ]]; then
              if [[ $current != none ]] && (( $(date +%s) - at > 72 * 3600 )); then
                mark "$keep" inactive "$run_url"
              elif [[ $current != "$state" ]]; then
                link=""
                [[ $state != success ]] || link="https://pr-$PR.ctxpipe.dev"
                mark "$keep" "$state" "$factory_runs$run" "$link"
              fi
            fi
          fi
          # Every other deployment of the PR is inactive. The sweep can delete
          # an old inactive one meanwhile, so a failed read skips it.
          others=$(jq -rn --arg keep "$keep" 'inputs[] | select((.id | tostring) != $keep) | .id' <<< "$deployments")
          for id in $others; do
            status=$(newest "$id") || continue
            read -r current _ <<< "$status"
            [[ $current == inactive ]] || mark "$id" inactive "$run_url"
          done

  sweep:
    if: github.event_name == 'schedule'
    # github-hosted: a few GitHub API calls, without Docker (ADR-065)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      # The check runs of this workflow.
      actions: write
      deployments: write
    steps:
      # A failed call for one deployment does not stop the others; the step
      # fails at the end.
      - name: A check run for each PR with a live deployment; delete old inactive ones
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          day_ago=$(( $(date +%s) - 86400 ))
          all=$(gh api --paginate "repos/$REPO/deployments?environment=pr-preview&per_page=100")
          rows=$(jq -rn 'inputs[] | select(.task | test("^preview-pr-[1-9][0-9]{0,5}$"))
            | "\(.id) \(.task | ltrimstr("preview-pr-")) \(.created_at | fromdateiso8601)"' <<< "$all")
          failed=0
          prs=""
          while read -r id pr created_at; do
            [[ -n $id ]] || continue
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // "none"') ||
              { echo "::error::No statuses of deployment $id (PR $pr)"; failed=1; continue; }
            if [[ $state != inactive ]]; then
              prs="$prs $pr"
            elif (( created_at < day_ago )); then
              gh api --method DELETE "repos/$REPO/deployments/$id" > /dev/null ||
                { echo "::error::Deployment $id (PR $pr) was not deleted"; failed=1; }
            fi
          done <<< "$rows"
          for pr in $(tr ' ' '\n' <<< "$prs" | sort -u); do
            gh workflow run preview-deployments.yaml --repo "$REPO" --ref main -f pr="$pr" -f state=check < /dev/null ||
              { echo "::error::No check run for PR $pr"; failed=1; continue; }
            echo "Check run for PR $pr" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
