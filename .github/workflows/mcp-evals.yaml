name: MCP evals

# MCPJam evals for the public MCP tools (CTX-574, ADR-051 section 10).
# The job starts its own backend from the checked-out code, with Postgres and
# FalkorDB as service containers and made-up fixture data. It never reaches a
# preview or production. Runs: by hand, and on a pull request with the label
# `mcp-evals`. A model call costs money, so a pull request does not run the
# suite by default. The gate report asks the author for the label.
# There is no schedule (ADR-062, revision 2026-11-10).
on:
  pull_request:
    branches:
      - main
    types:
      - labeled
      - synchronize
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Write the pass rates to baseline.json (in the artifact). Commit that file."
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # outside-gate: only with the mcp-evals label, because each run calls paid models (scripts/checks/README.md, Other pull request workflows)
  evals:
    name: MCPJam evals
    if: |
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'mcp-evals') ||
      (github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'mcp-evals')
      )
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 90
    # The model keys are secrets of the workbench environment: a spend-capped
    # MODEL_PROVIDER_API_KEY for CI. This job runs pnpm install, so it must
    # never get the production key. Settings keep the production value in the
    # Production environment, not in a repository secret.
    environment: workbench
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: ctxpipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe -d ctxpipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      falkordb:
        image: falkordb/falkordb:v4.20.7@sha256:13996aa523f0dd283f6bd6df6620b094dcea525452417c4d6ef9bef15dc9998d
        env:
          # CMD_INFO off, so that the cron thread does not use the Globals lock
          # before module load initializes it (see .github/actions/falkordb).
          # The first three values repeat the image default.
          FALKORDB_ARGS: MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000 CMD_INFO no
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping && redis-cli GRAPH.LIST && redis-cli GRAPH.QUERY ci_health 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # Local values only. Secrets stay on the eval steps that need them.
    env:
      MCPJAM_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ctxpipe_app:ctxpipe@localhost:5432/ctxpipe
      GRAPH_DB_URI: redis://127.0.0.1:6379
      AUTH_SECRET: mcp-eval-auth-secret-must-be-at-least-32-chars
      AUTH_BASE_URL: http://localhost:3000
      CODESEARCH_URL: http://127.0.0.1:3001
      MODEL_PROVIDER: ${{ vars.MODEL_PROVIDER || 'openrouter' }}
      MODEL_PROVIDER_URL: ${{ vars.MODEL_PROVIDER_URL }}
      MODEL_EMBEDDING_NAME: ${{ vars.MODEL_EMBEDDING_NAME }}
    steps:
      - name: Check the workbench model key
        env:
          MODEL_PROVIDER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
        run: |
          [[ -n "$MODEL_PROVIDER_API_KEY" ]] || {
            echo "::error::MODEL_PROVIDER_API_KEY is missing. Add the spend-capped model key to the workbench environment (Settings > Environments)."
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Install the SCIP TypeScript indexer
        run: npm install --global @sourcegraph/scip-typescript@0.4.0
      - name: Restore native revision index tools
        id: zoekt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/bin
          key: zoekt-${{ runner.os }}-${{ runner.arch }}-go1.25.12-${{ hashFiles('scripts/zoekt/go.mod', 'scripts/zoekt/go.sum', 'scripts/zoekt/build.sh') }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.zoekt.outputs.cache-hit != 'true'
        with:
          go-version: 1.25.12
          cache: false
      # The pinned zoekt of scripts/zoekt, and the ast-grep of the root
      # devDependencies.
      - name: Native revision index tools
        run: |
          if [ ! -x .tools/bin/zoekt-webserver ] || [ ! -x .tools/bin/zoekt-index ]; then
            scripts/zoekt/build.sh
          fi
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Migrate the schema
        env:
          DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5432/ctxpipe
          DATABASE_APP_PASSWORD: ctxpipe
        working-directory: apps/backend
        run: |
          pnpm exec tsx src/db/migrate.ts
      - name: Start codesearch
        run: |
          nohup bash scripts/codesearch-host-dev.sh > "$RUNNER_TEMP/codesearch.log" 2>&1 &
          for _ in $(seq 60); do
            code="$(curl --max-time 5 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/ || true)"
            [[ "$code" =~ ^2[0-9][0-9]$ ]] && exit 0
            sleep 2
          done
          exit 1
      - name: Start the backend from this checkout
        working-directory: apps/backend
        env:
          MODEL_PROVIDER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
        run: |
          nohup bun run src/server.ts > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 60); do
            code="$(curl --max-time 5 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/mcp || true)"
            [[ "$code" == "401" || "$code" =~ ^2[0-9][0-9]$ ]] && exit 0
            sleep 2
          done
          exit 1
      - name: Seed the fixture organizations and create the eval key
        working-directory: apps/backend
        env:
          MODEL_PROVIDER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
        run: |
          set -euo pipefail
          bun evals/mcp/run-seed.ts ci "ci${{ github.run_id }}" "$RUNNER_TEMP/mcp-eval-fixtures" "$RUNNER_TEMP/mcp-eval-seed.json"
      - name: Run the evals
        working-directory: apps/backend
        env:
          MODEL_PROVIDER_API_KEY: ${{ secrets.MODEL_PROVIDER_API_KEY }}
          # run.ts sends every model of MCP_EVAL_MODELS through OpenRouter
          # with this key (BYOK covers Anthropic and OpenAI).
          MODELS: ${{ vars.MCP_EVAL_MODELS }}
          UPDATE_BASELINE: ${{ inputs.update_baseline }}
        run: |
          set -euo pipefail
          EXTRA=()
          [[ "$UPDATE_BASELINE" == "true" ]] && EXTRA+=(--update-baseline)
          bun evals/mcp/run.ts \
            --url http://localhost:3000/mcp \
            --seed "$RUNNER_TEMP/mcp-eval-seed.json" \
            --models "$MODELS" \
            --iterations 3 \
            --out "$RUNNER_TEMP/mcp-eval-results.json" \
            "${EXTRA[@]}"
      - name: FalkorDB diagnostics
        if: failure()
        continue-on-error: true
        run: |
          # The server log alone shows nothing when the main thread stalls, so
          # also record what the server process and the runner were doing.
          id=$(docker ps -q --filter publish=6379 | head -n 1)
          docker ps -a
          docker stats --no-stream
          uptime
          free -m
          docker exec "$id" sh -c 'cat /proc/sys/vm/overcommit_memory; ps -eLo pid,tid,stat,wchan:30,pcpu,comm | head -40'
          timeout 5 docker exec "$id" redis-cli INFO server clients memory cpu || echo "INFO did not answer"
          timeout 5 docker exec "$id" redis-cli GRAPH.LIST || echo "GRAPH.LIST did not answer"
          timeout 5 docker exec "$id" redis-cli GRAPH.INFO || echo "GRAPH.INFO did not answer"
      - name: Summary
        if: always()
        run: |
          {
            echo "## MCP evals"
            if [ "$(tr -d '[:space:]' < apps/backend/evals/mcp/baseline.json)" = "null" ]; then
              echo "No baseline.json is committed. Only the 0.9 pass-rate floor applies."
            fi
            if [ -f "$RUNNER_TEMP/mcp-eval-results.json" ]; then
              echo '```json'
              jq '.report' "$RUNNER_TEMP/mcp-eval-results.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare public results
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mcp-eval-results.json" ]; then
            jq '{result: {iterations: .result.iterations, passes: .result.passes}, rates: .rates, usage: .usage, report: {passed: .report.passed, aggregates: .report.aggregates}}' "$RUNNER_TEMP/mcp-eval-results.json" > "$RUNNER_TEMP/mcp-eval-public-results.json"
          fi
      - name: Upload pass rates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-eval-results
          path: |
            ${{ runner.temp }}/mcp-eval-public-results.json
            apps/backend/evals/mcp/baseline.json
          if-no-files-found: ignore
