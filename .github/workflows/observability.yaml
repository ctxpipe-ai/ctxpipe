# The cost-telemetry package of ops/observability: tests on pull requests.
# deploy.yaml builds its image and copies it to the production ECR. The
# observability stack itself (ClickStack) lives in the factory repo
# (machines/observability, ADR-061).

name: Observability

on:
  pull_request:
    paths:
      - "ops/observability/**"
      - ".github/workflows/observability.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test cost-telemetry
    if: github.event_name == 'pull_request' && github.repository == 'ctxpipe-ai/ctxpipe'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: useblacksmith/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test cost-telemetry
        run: pnpm --filter cost-telemetry test

      - name: Typecheck cost-telemetry
        run: pnpm --filter cost-telemetry typecheck
