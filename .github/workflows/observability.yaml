name: Observability

on:
  push:
    branches: [main]
    paths:
      - "ops/observability/**"
      - ".github/workflows/observability.yaml"
  pull_request:
    paths:
      - "ops/observability/**"
      - ".github/workflows/observability.yaml"
  workflow_dispatch:

concurrency:
  group: observability-validate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate observability Terraform
    if: github.repository == 'ctxpipe-ai/ctxpipe'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops/observability/terraform
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
