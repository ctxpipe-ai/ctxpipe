# Observability Terraform.
#
# pull_request (same repo only): fmt/validate plus a speculative plan against
# github_repo_branch=main (the value apply uses). Plan never applies.
# GitHub Environment terraform-plan currently has no protection rules.
#
# push to main and workflow_dispatch apply only when github.ref is
# refs/heads/main. Create GitHub Environment observability with required
# reviewers and a main-only deployment branch policy BEFORE merging.
# If it does not exist, the first push creates it with no rules and apply
# runs ungated.
#
# After apply, redeploy GitHub-built services whose folders changed. The
# Railway GitHub App is not installed, so a push does not rebuild them.
#
# Security: terraform plan executes provider code with RAILWAY_TOKEN and the
# R2 state credentials present. Service secret values stay on Railway.

name: Observability

on:
  push:
    branches: [main]
    paths:
      - "ops/observability/**"
      - ".github/workflows/observability.yaml"
  pull_request:
    paths:
      - "ops/observability/**"
      - ".github/workflows/observability.yaml"
  workflow_dispatch:
    inputs:
      deploy_services:
        description: "After apply, deploy these GitHub-built services: all, or collector,clickhouse,railway-telemetry"
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate observability Terraform
    if: github.repository == 'ctxpipe-ai/ctxpipe'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    concurrency:
      group: observability-validate-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: ops/observability/terraform
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  plan:
    name: Observability Terraform plan (PR)
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    concurrency:
      group: observability-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment: terraform-plan
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: ops/observability/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_github_repo_branch: main
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1

      - name: Require observability Terraform credentials
        id: credentials
        run: bash require-credentials.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="access_key=$R2_ACCESS_KEY_ID" -backend-config="secret_key=$R2_SECRET_ACCESS_KEY" -backend-config="key=observability/terraform.tfstate"

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -lock-timeout=10m -out=terraform.plan | tee plan.txt

      - name: Refuse destructive observability plan
        id: guard
        run: bash plan-guard.sh terraform.plan

      - name: Generate Observability Terraform Plan comment
        if: always()
        env:
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/ops/observability/terraform"
          max_bytes=65536
          {
            echo "## Observability Terraform Plan"
            echo
            if [[ "$CREDENTIALS_OUTCOME" == "failure" ]]; then
              echo "Credential check failed. Missing \`RAILWAY_TOKEN\`, \`R2_ACCESS_KEY_ID\`, or \`R2_SECRET_ACCESS_KEY\`. Terraform plan did not run."
            elif [[ "$PLAN_OUTCOME" != "success" ]]; then
              echo "Terraform plan did not succeed (outcome \`$PLAN_OUTCOME\`). No plan was produced to apply."
            else
              if [[ "$GUARD_OUTCOME" == "failure" ]]; then
                echo "Plan guard refused this plan. It would delete or replace a service, custom domain, or variable collection, or change a service volume."
                echo
              fi
              truncated_note=""
              if [[ -f plan.txt ]]; then
                size=$(wc -c < plan.txt | tr -d ' ')
                if [[ "$size" -gt "$max_bytes" ]]; then
                  head -c "$max_bytes" plan.txt > plan.tmp && mv plan.tmp plan.txt
                  truncated_note=$'\n\n_Plan output truncated (first '"$max_bytes"' bytes); see the workflow run logs for the full plan._'
                fi
              fi
              echo "<details><summary>Show plan</summary>"
              echo
              echo '```hcl'
              cat plan.txt 2>/dev/null || true
              echo "$truncated_note"
              echo '```'
              echo
              echo "</details>"
            fi
          } > plan-comment.md

      - name: Find existing Observability Terraform Plan comment
        if: always()
        id: find-plan-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '## Observability Terraform Plan'

      - name: Create or update Observability Terraform Plan comment
        if: always()
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ steps.find-plan-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ops/observability/terraform/plan-comment.md
          edit-mode: replace

  apply:
    name: Observability Terraform apply
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.repository == 'ctxpipe-ai/ctxpipe'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 180
    concurrency:
      group: observability-apply
      cancel-in-progress: false
    environment: observability
    defaults:
      run:
        working-directory: ops/observability/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_github_repo_branch: main
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0

      - name: Require observability Terraform credentials
        id: credentials
        run: bash require-credentials.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="access_key=$R2_ACCESS_KEY_ID" -backend-config="secret_key=$R2_SECRET_ACCESS_KEY" -backend-config="key=observability/terraform.tfstate"

      # Provider Update() never sends multiRegionConfig (issue #77). Pin via
      # GraphQL before plan so Read() sees us-east4-eqdc4a. A region change
      # copies clickhouse-data / mongo-data and takes those services down.
      - name: Pin Railway observability region
        working-directory: ${{ github.workspace }}
        run: RAILWAY_SERVICE_SET=observability RAILWAY_PROJECT_ID=305aa114-c6f3-4aca-b883-0faa9c331aa2 bash scripts/railway-set-regions.sh

      - name: Terraform plan
        run: terraform plan -input=false -lock-timeout=10m -out=terraform.plan

      - name: Refuse destructive observability plan
        run: bash plan-guard.sh terraform.plan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -lock-timeout=10m terraform.plan

      # The Railway GitHub App is not installed (NO_INSTALLATION), so a push
      # does not rebuild these services. Deploy only the folders that changed.
      # ClickHouse restarts in place; this does not copy the volume.
      - name: Deploy changed GitHub-built services
        working-directory: ${{ github.workspace }}
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          DEPLOY_SERVICES: ${{ inputs.deploy_services }}
          RAILWAY_PROJECT_ID: 305aa114-c6f3-4aca-b883-0faa9c331aa2
        run: bash ops/observability/deploy-github-services.sh
