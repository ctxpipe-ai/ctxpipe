# The cost-telemetry package of ops/observability: tests on pull requests,
# and its image on GHCR. The observability stack itself (ClickStack) lives in
# the factory repo (machines/observability, ADR-061).

name: Observability

on:
  push:
    branches: [main]
    paths:
      - "ops/observability/**"
      - ".github/workflows/observability.yaml"
  pull_request:
    paths:
      - "ops/observability/**"
      - ".github/workflows/observability.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test observability packages
    if: github.event_name == 'pull_request' && github.repository == 'ctxpipe-ai/ctxpipe'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: useblacksmith/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test cost-telemetry
        run: pnpm --filter cost-telemetry test

      - name: Typecheck cost-telemetry
        run: pnpm --filter cost-telemetry typecheck

  tags:
    name: Observability image tags
    if: github.repository == 'ctxpipe-ai/ctxpipe' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    outputs:
      cost-telemetry: ${{ steps.tags.outputs['cost-telemetry'] }}
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Image tags
        id: tags
        run: |
          for service in cost-telemetry; do
            sha="$(git rev-parse "HEAD:ops/observability/${service}")"
            echo "${service}=ghcr.io/ctxpipe-ai/obs-${service}:${sha}" >> "$GITHUB_OUTPUT"
          done

  images:
    name: Build observability images
    needs: tags
    if: github.repository == 'ctxpipe-ai/ctxpipe' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # amd64: preserve image targets and run the amd64 Blacksmith cost-telemetry CLI.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [cost-telemetry]
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ops/observability/${{ matrix.service }}
          file: ops/observability/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ needs.tags.outputs[matrix.service] }}
