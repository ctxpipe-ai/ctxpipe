name: Claude plugin

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    timeout-minutes: 15
    name: Backend tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      DATABASE_URL: postgresql://ctxpipe:ctxpipe@localhost:5433/ctxpipe
      AUTH_SECRET: test-only-auth-secret-with-at-least-32-characters
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ctxpipe
          POSTGRES_PASSWORD: ctxpipe
          POSTGRES_DB: ctxpipe
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ctxpipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate database
        run: pnpm --filter @ctxpipe/backend db:migrate
      - name: Backend tests
        run: >-
          pnpm --filter @ctxpipe/backend exec vitest run
          src/auth/oauth-organization.test.ts
          src/auth/withAuth.test.ts
          src/routes/auth.test.ts
          src/routes/mcp.test.ts
          src/routes/mcp.conformance.test.ts
          src/mcp/transport.test.ts

  ui:
    timeout-minutes: 15
    name: UI tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm --filter @ctxpipe/ui test

  package:
    timeout-minutes: 15
    name: Validate and install package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      # The check policy:claude-plugin of the check manifest runs the same
      # script (scripts/checks/README.md).
      - name: Validate and install the plugin
        run: node scripts/ci/check-claude-plugin.mjs
