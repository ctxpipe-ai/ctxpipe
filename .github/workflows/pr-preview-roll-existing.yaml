# Deploy-only PR preview roll (avoids Blacksmith image rebuild / codeload 429).
# Uses an already-published GHCR tag and clears UI healthcheck so Railway can roll.
name: PR preview roll existing images

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Full git SHA already published to GHCR as pr-<N>-<sha>
        required: true
        type: string

# The same group as PR Deploy for this PR branch, so a roll never runs
# between the migrate and the roll of a PR Deploy run. Run this workflow from
# the PR branch: the first step checks that the branch is the head of the PR.
concurrency:
  group: pr-deploy-${{ github.ref_name }}
  cancel-in-progress: false

# The checkout reads the repository, and the first step reads the PR. Railway
# and Vercel calls use their own secrets, not the GitHub token.
permissions: {}

jobs:
  roll:
    permissions:
      contents: read
      pull-requests: read
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    # RAILWAY_API_TOKEN, the preview GitHub App secrets and the preview
    # VERCEL_ACCESS_TOKEN come from this protected environment. That Vercel
    # token reaches only the preview Vercel project
    # (scripts/preview-sandbox-vars.sh), never production. Each secret is in
    # the env of the steps that need it, never in the job env. The job uses
    # the Railway API with curl: no CLI, no package.
    environment: Preview
    env:
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
      WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
      UI_SERVICE_ID: ${{ vars.RAILWAY_UI_SERVICE_ID }}
      CODESEARCH_SERVICE_ID: ${{ vars.RAILWAY_CODESEARCH_SERVICE_ID }}
      PR_NUMBER: ${{ inputs.pr_number }}
      PR_ENV: pr-${{ inputs.pr_number }}
      IMAGE_TAG: pr-${{ inputs.pr_number }}-${{ inputs.head_sha }}
      BACKEND_IMAGE: ghcr.io/ctxpipe-ai/backend:pr-${{ inputs.pr_number }}-${{ inputs.head_sha }}
      WORKER_IMAGE: ghcr.io/ctxpipe-ai/worker:pr-${{ inputs.pr_number }}-${{ inputs.head_sha }}
      UI_IMAGE: ghcr.io/ctxpipe-ai/ui:pr-${{ inputs.pr_number }}-${{ inputs.head_sha }}
      CODESEARCH_IMAGE: ghcr.io/ctxpipe-ai/codesearch:pr-${{ inputs.pr_number }}-${{ inputs.head_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - name: Check inputs and the branch
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "pr_number must be a number" >&2; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "head_sha must be a full git SHA" >&2; exit 1; }
          [[ -n "$RAILWAY_API_TOKEN" ]] || {
            echo "::error::RAILWAY_API_TOKEN is missing. Add it to the Preview environment (Settings > Environments)."
            exit 1
          }
          # The concurrency group is the ref name, so it must be the PR branch.
          if [[ "$REF" != "refs/heads/${BRANCH}" || "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.ref)" != "$BRANCH" ]]; then
            echo "::error::Run this workflow from the branch of PR #${PR_NUMBER}, not from ${BRANCH}."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve Railway environment ID
        id: env
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/railway-graphql.sh"
          ENV_ID="$(railway_environment_id "$RAILWAY_PROJECT_ID" "$PR_ENV")"
          [[ -n "$ENV_ID" ]] || { echo "Missing env id for $PR_ENV"; exit 1; }
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"
          echo "ENV_ID=$ENV_ID"

      - name: Roll images and wait for UI SUCCESS
        env:
          ENV_ID: ${{ steps.env.outputs.env_id }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          OBSERVABILITY_OTLP_HEADERS: ${{ secrets.OBSERVABILITY_OTLP_HEADERS }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_SLUG: ${{ secrets.GH_APP_SLUG }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GH_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/railway-graphql.sh"
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/preview-otel-vars.sh"
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/preview-sandbox-vars.sh"
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/preview-github-app-vars.sh"
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/preview-ui-private.sh"
          # shellcheck disable=SC1091
          source "${GITHUB_WORKSPACE}/scripts/preview-own-secrets.sh"

          update_ui() {
            railway_graphql \
              'mutation serviceInstanceUpdate($environmentId: String, $serviceId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: $input) }' \
              "$(jq -nc --arg env "$ENV_ID" --arg service "$UI_SERVICE_ID" --arg img "$UI_IMAGE" \
                '{environmentId:$env, serviceId:$service, input:{source:{image:$img}, sleepApplication:true, healthcheckPath:""}}')"
            echo "UI image=$UI_IMAGE healthcheckPath cleared"
          }

          update_img() {
            local sid="$1" img="$2"
            railway_graphql \
              'mutation serviceInstanceUpdate($environmentId: String, $serviceId: String!, $input: ServiceInstanceUpdateInput!) { serviceInstanceUpdate(environmentId: $environmentId, serviceId: $serviceId, input: $input) }' \
              "$(jq -nc --arg env "$ENV_ID" --arg service "$sid" --arg img "$img" \
                '{environmentId:$env, serviceId:$service, input:{source:{image:$img}, sleepApplication:true}}')" >/dev/null
          }

          deploy() {
            railway_graphql \
              'mutation serviceInstanceDeployV2($serviceId: String!, $environmentId: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }' \
              "$(jq -nc --arg env "$ENV_ID" --arg service "$1" '{environmentId:$env, serviceId:$service}')" >/dev/null
          }

          wait_ok() {
            local label="$1" sid="$2" expected="$3"
            local tag="${expected##*:}" deadline=$(( $(date +%s) + 420 ))
            echo "Waiting for $label ($expected)"
            while true; do
              local response node status
              response="$(railway_graphql \
                'query deployments($input: DeploymentListInput!) { deployments(input: $input) { edges { node { id status meta } } } }' \
                "$(jq -nc --arg env "$ENV_ID" --arg service "$sid" '{input:{environmentId:$env, serviceId:$service}}')")"
              node="$(echo "$response" | jq -c --arg tag "$tag" '[.data.deployments.edges[]?.node // empty | select((.meta|tostring)|contains($tag))][0] // empty')"
              status="$(echo "$node" | jq -r '.status // empty')"
              echo "$label status=${status:-none}"
              if [[ "$status" == "SUCCESS" || "$status" == "SLEEPING" ]]; then
                return 0
              fi
              if [[ "$status" == "FAILED" || "$status" == "CRASHED" || "$status" == "REMOVED" ]]; then
                echo "$node" >&2
                dep="$(echo "$node" | jq -r '.id // empty')"
                if [[ -n "$dep" ]]; then
                  railway_graphql \
                    'query($id: String!, $limit: Int) { deploymentLogs(deploymentId: $id, limit: $limit) { timestamp severity message } }' \
                    "$(jq -nc --arg id "$dep" '{id:$id, limit:100}')" \
                    | jq -r '(.data.deploymentLogs // [])[]? | "\(.timestamp) [\(.severity)] \(.message)"' >&2 || true
                fi
                return 1
              fi
              if (( $(date +%s) >= deadline )); then
                echo "timeout $label" >&2
                return 1
              fi
              sleep 8
            done
          }

          # Bind UI + SSR API origin: the backend private domain, as in
          # pr-deploy.yaml, on port 8080 (the backend PORT that Terraform sets
          # in production). AUTH_ALLOWED_ORIGINS gives the UI browser OTEL
          # proxy the public origin. `dollar` keeps GitHub Actions from reading
          # the Railway reference as an expression.
          dollar='$'
          railway_graphql \
            'mutation variableCollectionUpsert($input: VariableCollectionUpsertInput!) { variableCollectionUpsert(input: $input) }' \
            "$(jq -nc --arg project "$RAILWAY_PROJECT_ID" --arg env "$ENV_ID" --arg service "$UI_SERVICE_ID" --arg auth "http://${dollar}{{backend.RAILWAY_PRIVATE_DOMAIN}}:8080" --arg origins "https://backend-pr-${PR_NUMBER}.up.railway.app" \
              '{input:{projectId:$project,environmentId:$env,serviceId:$service,skipDeploys:true,variables:{HOST:"0.0.0.0",NITRO_HOST:"0.0.0.0",AUTH_BASE_URL:$auth,AUTH_ALLOWED_ORIGINS:$origins}}}')" >/dev/null

          point_preview_backend_at_private_ui

          sync_preview_otel_variables
          sync_preview_sandbox_variables
          sync_preview_github_app_variables
          # A preview from before PR Deploy gave it its own secrets still has
          # the production AUTH_SECRET and the account token. Replace them
          # before branch code rolls. A marked preview keeps its values.
          sync_preview_own_secrets

          update_img "$BACKEND_SERVICE_ID" "$BACKEND_IMAGE"
          deploy "$BACKEND_SERVICE_ID"
          wait_ok backend "$BACKEND_SERVICE_ID" "$BACKEND_IMAGE"
          # The backend now proxies to the UI private domain, so the UI
          # needs no public domain. Production UI has none either.
          remove_preview_ui_public_domains

          update_img "$WORKER_SERVICE_ID" "$WORKER_IMAGE"
          deploy "$WORKER_SERVICE_ID"
          wait_ok worker "$WORKER_SERVICE_ID" "$WORKER_IMAGE"

          update_ui
          deploy "$UI_SERVICE_ID"
          wait_ok ui "$UI_SERVICE_ID" "$UI_IMAGE"

          update_img "$CODESEARCH_SERVICE_ID" "$CODESEARCH_IMAGE"
          deploy "$CODESEARCH_SERVICE_ID"
          wait_ok codesearch "$CODESEARCH_SERVICE_ID" "$CODESEARCH_IMAGE"

          echo "Rolled preview to $IMAGE_TAG"

          bash scripts/ci/smoke-preview-ui.sh "https://backend-pr-${PR_NUMBER}.up.railway.app"
