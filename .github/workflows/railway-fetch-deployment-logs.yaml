# One-shot: dump Railway deployment runtime/build logs for a failed deploy ID.
name: Railway fetch deployment logs

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Railway deployment UUID
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch deploymentLogs + buildLogs
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          gql() {
            local query="$1"
            local variables="$2"
            curl -sS \
              -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$query" --argjson v "$variables" '{query:$q,variables:$v}')" \
              https://backboard.railway.com/graphql/v2
          }
          echo "=== deployment ==="
          gql 'query($id: String!) { deployment(id: $id) { id status createdAt staticUrl meta } }' \
            "$(jq -nc --arg id "$DEPLOYMENT_ID" '{id:$id}')" | jq .
          echo "=== deploymentLogs (last 200) ==="
          gql 'query($id: String!, $limit: Int) { deploymentLogs(deploymentId: $id, limit: $limit) { timestamp severity message } }' \
            "$(jq -nc --arg id "$DEPLOYMENT_ID" '{id:$id, limit:200}')" | jq -r '
              .errors // empty,
              (.data.deploymentLogs // [])[]? | "\(.timestamp) [\(.severity)] \(.message)"
            '
          echo "=== buildLogs (last 100) ==="
          gql 'query($id: String!, $limit: Int) { buildLogs(deploymentId: $id, limit: $limit) { timestamp severity message } }' \
            "$(jq -nc --arg id "$DEPLOYMENT_ID" '{id:$id, limit:100}')" | jq -r '
              .errors // empty,
              (.data.buildLogs // [])[]? | "\(.timestamp) [\(.severity)] \(.message)"
            '
