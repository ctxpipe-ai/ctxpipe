# Terraform speculative plans on infra PRs.
#
# The merge gate of ci.yaml starts this workflow on the PR branch when its
# plan selects the check policy:terraform-plan:infra/main.tf (job
# merge-gate-terraform-plan), so a PR that changes no Terraform input never
# starts it. A person can start it with Run workflow from the PR branch.
#
# Security: terraform plan executes provider/external code with secrets present. Assign this job to a
# GitHub Environment named below and enable required reviewers under repo Settings → Environments

name: Terraform Infra Plan (PR)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to plan (e.g. 255)"
        required: true
        type: string

concurrency:
  group: terraform-infra-plan

permissions:
  contents: read

jobs:
  resolve:
    timeout-minutes: 5
    name: Resolve the PR
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.resolve.outputs.current }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
    steps:
      - name: Resolve
        id: resolve
        # The script reads each context value from the environment, never from
        # an inline expression, so a branch name or an input stays data.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          BRANCH: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "The pr_number input must be a number" >&2
            exit 1
          fi
          PR_JSON="$(gh api "repos/${REPO}/pulls/${INPUT_PR_NUMBER}")"
          # Only branches of this repository (not forks): the plan runs the
          # code of the branch with the state keys.
          if [[ "$(jq -r .head.repo.full_name <<<"$PR_JSON")" != "$REPO" ]]; then
            echo "::error::Refusing to plan fork PR #${INPUT_PR_NUMBER}"
            exit 1
          fi
          if [[ "$(jq -r .head.ref <<<"$PR_JSON")" != "$BRANCH" || "$REF" != "refs/heads/${BRANCH}" ]]; then
            echo "::error::Run this workflow from the branch of PR #${INPUT_PR_NUMBER}, not from ${BRANCH}."
            exit 1
          fi
          echo "base_sha=$(jq -r .base.sha <<<"$PR_JSON")" >> "$GITHUB_OUTPUT"
          # A newer push started its own run of the merge gate. This run is
          # stale: it would plan old code and replace the newer comment.
          if [[ "$(jq -r .head.sha <<<"$PR_JSON")" != "$RUN_SHA" ]]; then
            echo "::notice::The PR head moved on; a newer run plans it"
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

  terraform-plan:
    timeout-minutes: 30
    name: Terraform Plan (PR)
    needs: resolve
    if: needs.resolve.outputs.current == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    defaults:
      run:
        working-directory: infra

    # Required reviewers → Settings → Environments → terraform-plan
    environment: terraform-plan

    permissions:
      contents: read
      pull-requests: write

    # Values that are not secret. Each secret goes in the env of the steps
    # that need it: Terraform Init gets the state keys only.
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_image_tag: ${{ needs.resolve.outputs.base_sha }}
      TF_VAR_model_provider: ${{ vars.MODEL_PROVIDER || 'openrouter' }}
      TF_VAR_linear_redirect_uri: ${{ vars.LINEAR_REDIRECT_URI }}
      TF_VAR_pagerduty_redirect_uri: ${{ vars.PAGERDUTY_REDIRECT_URI }}
      # No secret value: Terraform does not hold the app secrets
      # (scripts/railway-sync-variables.mjs writes them to Railway).
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7

      - name: Terraform Init
        # -lockfile=readonly: each provider must match the hashes in
        # .terraform.lock.hcl (scripts/ci/check-secret-jobs.mjs).
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -lockfile=readonly -backend-config="access_key=$R2_ACCESS_KEY_ID" -backend-config="secret_key=$R2_SECRET_ACCESS_KEY" -backend-config="key=production/terraform.tfstate"

      - name: Terraform Plan
        id: plan
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # The plan runs PR branch code, so it gets no Railway or Neon token.
          # -refresh=false compares the code with the state and calls no
          # provider API; the providers need only a non-empty token to start.
          # Drift shows in the deploy plan.
          RAILWAY_TOKEN: pr-plan-placeholder
          NEON_API_KEY: pr-plan-placeholder
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: |
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/infra"
            terraform plan -refresh=false -no-color -input=false > "${GITHUB_WORKSPACE}/infra/plan.txt"

      - name: Generate Terraform Plan Comment
        if: always()
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/infra"
          max_bytes=65536
          truncated_note=""
          if [[ -f plan.txt ]]; then
            size=$(wc -c < plan.txt | tr -d ' ')
            if [[ "$size" -gt "$max_bytes" ]]; then
              head -c "$max_bytes" plan.txt > plan.tmp && mv plan.tmp plan.txt
              truncated_note=$'\n\n_Plan output truncated (first '"$max_bytes"' bytes); see the workflow run artifact / logs for the full plan._'
            fi
          else
            truncated_note=$'\n\n_No plan.txt produced (Terraform plan failed or did not write output)._'
          fi
          {
            echo "## Terraform Plan"
            echo
            echo "<details><summary>Show plan</summary>"
            echo
            echo '```hcl'
            cat plan.txt 2>/dev/null || true
            echo "$truncated_note"
            echo '```'
            echo
            echo "</details>"
          } > plan-comment.md

      - name: Find existing Terraform Plan comment
        if: always()
        id: find-plan-comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        with:
          issue-number: ${{ inputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: '## Terraform Plan'

      - name: Create or update Terraform Plan comment
        if: always()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ steps.find-plan-comment.outputs.comment-id }}
          issue-number: ${{ inputs.pr_number }}
          body-path: infra/plan-comment.md
          edit-mode: replace
