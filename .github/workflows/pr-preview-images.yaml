# The images of a pull request for its AWS preview (ADR-061 decisions 5 and 19 to 24; factory CTX-1218). On each push
# to a pull request from this repo, this builds the linux/arm64 images that a preview runs on Graviton (backend,
# worker, ui) and pushes them to the preview account's ECR as `ctxpipe-pr/<image>:pr-<N>-<head sha>`. The factory
# preview workflow (`factory preview up <N>`) takes them from there by digest.
#
# - Only pull requests from this repo: the role trusts no fork.
# - The build runs before the job has any AWS credential, and BuildKit runs the Dockerfile steps in containers that do
#   not see the runner's environment. The role (`github-actions-ctxpipe-pr-ecr-push`, factory aws-core) can only push
#   to `ctxpipe-pr/*` in the preview account, where preview code runs anyway.
# - The tags are immutable: a run again for the same commit finds its images there and goes on.
# - Off until the repository variable PREVIEW_ECR_PUSH is `enabled` (after factory aws-core made the role).
name: PR preview images

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-preview-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  images:
    name: Preview image (${{ matrix.image }})
    if: vars.PREVIEW_ECR_PUSH == 'enabled' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: apps/backend/Dockerfile
          - image: worker
            dockerfile: apps/backend/Dockerfile.worker
          - image: ui
            dockerfile: apps/ui/Dockerfile
    env:
      REGISTRY: 573018602187.dkr.ecr.us-west-2.amazonaws.com
      TAG: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-buildx
      # No credential yet: the image is built into the local Docker only.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          load: true
          push: false
          tags: preview/${{ matrix.image }}:local
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::573018602187:role/github-actions-ctxpipe-pr-ecr-push
          aws-region: us-west-2
      - name: Push to the preview account
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          target="$REGISTRY/ctxpipe-pr/$IMAGE:$TAG"
          docker tag "preview/$IMAGE:local" "$target"
          if ! out=$(docker push "$target" 2>&1); then
            # A run again for the same commit: the immutable tag is there already.
            grep -q 'already exists' <<< "$out" || { echo "$out"; exit 1; }
            echo "$target is there already"
          fi
          echo "Pushed $target" >> "$GITHUB_STEP_SUMMARY"
