name: Changeset Guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  require_changesets:
    name: Require changesets for apps and packages
    if: |
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'pull_request') !=
        (github.actor == 'cursor[bot]' || github.actor == 'cursoragent'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch comparison base
        run: git fetch origin ${{ github.event.pull_request.base.ref || 'main' }}

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require changesets when versionable packages changed
        run: pnpm changeset status --since=origin/${{ github.event.pull_request.base.ref || 'main' }}
