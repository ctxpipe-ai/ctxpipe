name: Changeset Guard

# Runs on every pull request on purpose, not through the merge gate of ci.yaml.
# A missing changeset is a property of the whole diff against the base branch.
# It is cheap, and no check input describes it, so a selector cannot decide
# when it matters (scripts/checks/README.md, Other pull request workflows).

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  require_changesets:
    timeout-minutes: 10
    name: Require changesets for apps and packages
    if: |
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch comparison base
        run: git fetch origin ${{ github.event.pull_request.base.ref || 'main' }}

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require changesets when versionable packages changed
        run: pnpm changeset status --since=origin/${{ github.event.pull_request.base.ref || 'main' }}
