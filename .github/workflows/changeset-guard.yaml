name: Changeset Guard

# Runs on every pull request on purpose, not through the merge gate of ci.yaml.
# A missing changeset is a property of the whole diff against the base branch.
# It is cheap, and no check input describes it, so a selector cannot decide
# when it matters (scripts/checks/README.md, Other pull request workflows).

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # outside-gate: it reads the diff against the base branch, which is no input of a check (scripts/checks/README.md, Other pull request workflows)
  require_changesets:
    timeout-minutes: 10
    name: Require changesets for apps and packages
    if: |
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch comparison base
        run: git fetch origin ${{ github.event.pull_request.base.ref || 'main' }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require changesets when versionable packages changed
        run: pnpm changeset status --since=origin/${{ github.event.pull_request.base.ref || 'main' }}

      # A changeset that names a package starts its summary with a kind
      # (ADR-020, item 7). Only the changesets that this PR adds or changes,
      # so a changeset on the base branch does not stop other PRs.
      - name: Require a kind in each changeset that names a package
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" -- '.changeset/*.md' ':!.changeset/README.md')
          [ -z "$files" ] && exit 0
          # shellcheck disable=SC2086
          node scripts/release/check-changeset-kinds.mjs $files
