# One-time cleanup (CTX-1313). The Railway PR previews pushed images to GHCR
# with tags `pr-<N>-<sha>`, and their teardown deleted them. The previews are
# gone (Railway removed; AWS previews push to the preview account's ECR), so
# nothing deletes the old tags. This workflow deletes them once.
#
# - It deletes a version of backend, worker, ui or codesearch only when the
#   version has tags and each tag matches `^pr-[0-9]+-`. It keeps each version
#   that has another tag too (`latest`, a commit sha), and each untagged
#   version.
# - `dry_run` (default true) only lists and counts.
# - The GITHUB_TOKEN can make about 1,000 API calls per hour. The job waits
#   for the reset when few calls are left.
# - Remove this file after the cleanup.
name: GHCR prune PR preview tags

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List and count only; delete nothing.
        type: boolean
        default: true

permissions: {}

jobs:
  prune:
    timeout-minutes: 330
    permissions:
      packages: write
    # github-hosted: only API calls; it waits for the rate limit reset for hours (ADR-065)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Delete the versions whose every tag is a PR preview tag
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          wait_for_calls() {
            local remaining reset
            read -r remaining reset < <(gh api rate_limit --jq '.resources.core | "\(.remaining) \(.reset)"')
            if (( remaining < 50 )); then
              echo "Rate limit: $remaining calls left; waiting until $(date -u -d "@$reset")"
              sleep $(( reset - $(date +%s) + 5 ))
            fi
          }
          {
            echo "| Package | Versions | To delete | Kept with a PR tag and another tag | Deleted |"
            echo "| --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for package in backend worker ui codesearch; do
            versions="$RUNNER_TEMP/$package.json"
            gh api --paginate "/orgs/$ORG/packages/container/$package/versions?per_page=100" \
              --jq '.[] | {id, tags: .metadata.container.tags}' > "$versions"
            total=$(jq -s 'length' "$versions")
            jq -r 'select((.tags | length) > 0 and all(.tags[]; test("^pr-[0-9]+-"))) | .id' \
              "$versions" > "$RUNNER_TEMP/$package.ids"
            matched=$(wc -l < "$RUNNER_TEMP/$package.ids")
            mixed=$(jq -s '[.[] | select(any(.tags[]; test("^pr-[0-9]+-")) and any(.tags[]; test("^pr-[0-9]+-") | not))] | length' "$versions")
            deleted=0
            if [[ $DRY_RUN != true ]]; then
              while read -r id; do
                if (( deleted % 25 == 0 )); then wait_for_calls; fi
                gh api --silent -X DELETE "/orgs/$ORG/packages/container/$package/versions/$id"
                # Stay below the secondary rate limit of GitHub.
                sleep 1
                deleted=$(( deleted + 1 ))
              done < "$RUNNER_TEMP/$package.ids"
            fi
            echo "$package: $total versions, $matched to delete, $mixed kept with a PR tag and another tag, $deleted deleted"
            echo "| $package | $total | $matched | $mixed | $deleted |" >> "$GITHUB_STEP_SUMMARY"
          done
