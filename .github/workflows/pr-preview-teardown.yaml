# Teardown of the Railway PR previews, kept after the preview deploy is gone
# (CTX-1220). When a PR closes, it deletes the preview's Neon branch, revokes
# its Railway project token, deletes its Railway environment and its GHCR
# images, and deletes its Vercel sandboxes. Delete this file when the Railway
# product project is gone (CTX-1220 step 11b).
#
# Secrets: RAILWAY_API_TOKEN and NEON_API_KEY come from the protected GitHub
# environment `Preview`, only in the steps that need them, in a job that runs
# no package manager. cleanup_pr_sandboxes installs packages with the preview
# Vercel token: a reviewed exception in scripts/ci/check-secret-jobs.mjs.
name: PR Preview Teardown

on:
  pull_request:
    types:
      - closed

permissions:
  contents: read
  packages: write

jobs:
  cleanup_pr_environment:
    timeout-minutes: 20
    name: Cleanup Neon, Railway, and PR GHCR images
    if: |
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pr-cleanup-environment-${{ github.event.number }}
      cancel-in-progress: false
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # RAILWAY_API_TOKEN and NEON_API_KEY come from this protected environment.
    # The job calls only the Neon and Railway APIs with curl: no CLI, no
    # package. Each secret is in the env of the steps that need it.
    environment: Preview
    steps:
      - name: Check the Railway token
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_WORKSPACE_TOKEN }}
        run: |
          [[ -n "$RAILWAY_API_TOKEN" ]] || {
            echo "::error::RAILWAY_WORKSPACE_TOKEN is missing. Add it to the Preview environment (Settings > Environments)."
            exit 1
          }

      - name: Delete Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          BRANCH_NAME="preview/pr-${PR_NUMBER}"
          API="https://console.neon.tech/api/v2"
          RESP=$(curl -fsS -H "Authorization: Bearer ${NEON_API_KEY}" \
            "${API}/projects/${PROJECT_ID}/branches")
          BID=$(echo "$RESP" | jq -r --arg n "$BRANCH_NAME" '.branches[]? | select(.name == $n) | .id' | head -1)
          if [[ -z "$BID" ]]; then
            echo "Neon branch not found (already deleted?): $BRANCH_NAME"
            exit 0
          fi
          curl -fsS -X DELETE -H "Authorization: Bearer ${NEON_API_KEY}" \
            "${API}/projects/${PROJECT_ID}/branches/${BID}"
          echo "Deleted Neon branch $BRANCH_NAME"

      - name: Find the Railway environment
        id: railway_env
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_WORKSPACE_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          PR_ENV: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          ENV_ID="$(curl -fsS --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -nc --arg id "$RAILWAY_PROJECT_ID" '{query:"query($id: String!) { project(id: $id) { environments { edges { node { id name } } } } }",variables:{id:$id}}')" \
            https://backboard.railway.com/graphql/v2 \
            | jq -er --arg n "$PR_ENV" '.data.project.environments.edges | [.[].node | select(.name == $n) | .id][0] // ""')"
          if [[ -z "$ENV_ID" ]]; then
            echo "No Railway environment $PR_ENV (already deleted?)"
          fi
          echo "env_id=$ENV_ID" >>"$GITHUB_OUTPUT"

      - name: Revoke the preview worker-wake token
        # The old Railway PR Deploy made one Railway project token for each
        # preview environment. Delete each token of this
        # environment before the environment goes. Prints no token value.
        # A failure here must not stop the environment delete, because the
        # token is scoped to that environment.
        if: steps.railway_env.outputs.env_id != ''
        continue-on-error: true
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_WORKSPACE_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          ENV_ID: ${{ steps.railway_env.outputs.env_id }}
          PR_ENV: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          gql() {
            curl -fsS -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$1" --argjson v "$2" '{query:$q,variables:$v}')" \
              https://backboard.railway.com/graphql/v2
          }
          TOKEN_IDS="$(gql 'query($projectId: String!) { projectTokens(projectId: $projectId, first: 100) { edges { node { id environmentId } } } }' \
            "$(jq -nc --arg p "$RAILWAY_PROJECT_ID" '{projectId:$p}')" \
            | jq -r --arg env "$ENV_ID" '.data.projectTokens.edges[]?.node | select(.environmentId == $env) | .id')"
          for id in $TOKEN_IDS; do
            gql 'mutation($id: String!) { projectTokenDelete(id: $id) }' "$(jq -nc --arg id "$id" '{id:$id}')" >/dev/null
            echo "Revoked Railway project token $id of $PR_ENV"
          done

      - name: Delete Railway environment
        # The id comes from the exact name pr-<N>, so this never deletes
        # production. Railway API calls can be flaky; retry once.
        if: steps.railway_env.outputs.env_id != ''
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_WORKSPACE_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          ENV_ID: ${{ steps.railway_env.outputs.env_id }}
          PR_ENV: pr-${{ github.event.number }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: |
            set -euo pipefail
            RESP="$(curl -fsS -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg id "$ENV_ID" '{query:"mutation($id: String!) { environmentDelete(id: $id) }",variables:{id:$id}}')" \
              https://backboard.railway.com/graphql/v2)"
            if jq -e '.errors | type == "array" and length > 0' >/dev/null <<<"$RESP"; then
              # An earlier attempt or another cleanup can have deleted it.
              LEFT="$(curl -fsS -H "Authorization: Bearer $RAILWAY_API_TOKEN" -H "Content-Type: application/json" \
                -d "$(jq -nc --arg id "$RAILWAY_PROJECT_ID" '{query:"query($id: String!) { project(id: $id) { environments { edges { node { id } } } } }",variables:{id:$id}}')" \
                https://backboard.railway.com/graphql/v2 \
                | jq -er --arg env "$ENV_ID" '.data.project.environments.edges | [.[].node | select(.id == $env)] | length')"
              if [[ "$LEFT" == "0" ]]; then
                echo "Railway environment $PR_ENV is already deleted"
                exit 0
              fi
              echo "Railway did not delete $PR_ENV: $(jq -c '.errors' <<<"$RESP")" >&2
              exit 1
            fi
            echo "Deleted Railway environment $PR_ENV"

      # Requires packages:write (workflow) and Admin on each GHCR package → Manage Actions access for this repo.
      - name: Delete PR-tagged GHCR images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ctxpipe-ai
          packages: backend,worker,ui,codesearch
          delete-tags: '^pr-${{ github.event.number }}-'
          use-regex: true

  # Runs after the preview teardown was attempted (even if it failed), so a
  # preview backend is unlikely to start a sandbox behind it; re-running the
  # job deletes any straggler. The sandboxes' GitHub token rows live in the
  # preview's Neon branch, which the teardown deletes.
  cleanup_pr_sandboxes:
    timeout-minutes: 20
    name: Delete preview Vercel sandboxes
    needs: cleanup_pr_environment
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pr-cleanup-sandboxes-${{ github.event.number }}
      cancel-in-progress: false
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    permissions:
      contents: read
    # The preview Vercel project and token that the old Railway previews used.
    # This job runs pnpm install with that token: a reviewed exception in
    # scripts/ci/check-secret-jobs.mjs. It stays in Preview: it deletes
    # the sandboxes of the Railway PR preview, not those of CI contracts.
    environment: Preview
    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1

      - name: Mount pnpm store sticky disk
        uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1
        with:
          # Not the production key: branch code writes to this store.
          key: ${{ github.repository }}-pnpm-store-pr
          path: ~/.pnpm-store

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: useblacksmith/setup-node@65c6ca86fdeb0ab3d85e78f57e4f6a7e4780b391 # v5
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Force pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter @ctxpipe/backend...

      - name: Delete sandboxes tagged with this preview environment
        working-directory: apps/backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_TEAM_ID: ctxpipe
          VERCEL_PROJECT_ID: ctxpipe-previews
        run: bun src/scripts/deletePreviewSandboxes.ts "pr-${{ github.event.number }}"
